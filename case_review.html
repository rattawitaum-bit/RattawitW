<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ระบบช่วยคิดและปฏิบัติงานคดีของทนายความไทย (Single-File Standalone Edition)">
  <meta name="theme-color" content="#15324e">
  <title>ระบบช่วยคิดคดี — Case Review (Standalone)</title>
  <style>
/* ==========================================================================
   CSS Design System: Thai Lawyer Case Review PWA
   Responsive Architecture: Mobile (<600px) | Tablet (600-1024px) | PC (>1024px)
   ========================================================================== */

/* ─── Root Variables & Theme Tokens ─── */
:root, [data-theme="light"] {
  --bg: #f5f2eb;               /* Warm legal paper background */
  --card-bg: #ffffff;          /* Clean white card surface */
  --card-border: #e0d9cc;      /* Subtle paper edge */
  --card-shadow: 0 2px 8px rgba(23, 50, 77, 0.05);
  
  --ink: #1b2430;              /* Deep charcoal ink for high readability */
  --ink-muted: #536273;        /* Subdued text */
  --ink-faint: #8896a6;        /* Placeholder text */
  
  --navy: #15324e;             /* Classical Court Navy */
  --navy-hover: #0d2236;
  --gold: #b38226;             /* Legal Gold */
  --line: #e2ddd3;
  
  --success: #1e7e44;          /* Confirmed fact green */
  --danger: #b52b27;           /* Assumption / Warning red */
  --warning: #c26910;          /* Unknown fact amber */
  
  /* Document Specific */
  --report-sheet-bg: #ffffff;
  --report-text: #17212d;
  --report-border: #d8d1c2;
  --report-meta-bg: #eae5da;
  
  --pii-bg: #ffe066;
  --pii-text: #1a1a1a;
  --pii-border: #d4a72c;
  
  --max: 920px;
  --fs: 16px;
  --radius: 8px;
}

[data-theme="dark"] {
  --bg: #0e131a;               /* Dark executive slate */
  --card-bg: #161d27;          /* Elevated card surface */
  --card-border: #263242;      /* Defined card border */
  --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  
  --ink: #f0f4f8;              /* Crisp white-gray for maximum contrast */
  --ink-muted: #94a3b8;        /* Slate text */
  --ink-faint: #64748b;
  
  --navy: #3b82f6;             /* Modern blue accent */
  --navy-hover: #2563eb;
  --gold: #f59e0b;             /* Radiant gold */
  --line: #263242;
  
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  
  /* Document Specific */
  --report-sheet-bg: #161d27;
  --report-text: #f1f5f9;
  --report-border: #334155;
  --report-meta-bg: #1e2736;
  
  --pii-bg: #d97706;
  --pii-text: #ffffff;
  --pii-border: #f59e0b;
}

/* Fallback for OS Dark Mode when theme is auto */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a;
    --card-bg: #161d27;
    --card-border: #263242;
    --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    --ink: #f0f4f8;
    --ink-muted: #94a3b8;
    --ink-faint: #64748b;
    --navy: #3b82f6;
    --navy-hover: #2563eb;
    --gold: #f59e0b;
    --line: #263242;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --report-sheet-bg: #161d27;
    --report-text: #f1f5f9;
    --report-border: #334155;
    --report-meta-bg: #1e2736;
    --pii-bg: #d97706;
    --pii-text: #ffffff;
    --pii-border: #f59e0b;
  }
}

/* ─── Global Reset & Typography ─── */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Sarabun", "Leelawadee UI", "Tahoma", sans-serif;
  font-size: var(--fs);
  color: var(--ink);
  background-color: var(--bg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* ─── Top Bar (Header) ─── */
.top-bar {
  position: sticky;
  top: 0;
  background-color: var(--navy);
  color: #ffffff;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  padding-top: env(safe-area-inset-top, 0px);
}

.top-bar-inner {
  display: flex;
  align-items: center;
  padding: 0.5rem 1rem;
  max-width: var(--max);
  margin: 0 auto;
  gap: 0.75rem;
}

.top-bar-brand {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-weight: 700;
  white-space: nowrap;
  user-select: none;
  cursor: pointer;
  touch-action: manipulation;
}
.top-bar-brand:hover { opacity: 0.9; }

.brand-icon { font-size: 1.25em; }
.brand-text { font-size: 0.98rem; letter-spacing: 0.3px; }

.top-bar-title {
  flex: 1;
  font-size: 0.95rem;
  font-weight: 500;
  margin: 0;
  color: rgba(255,255,255,0.9);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.top-bar-actions {
  display: flex;
  gap: 0.35rem;
}

@media (max-width: 480px) {
  .top-bar-inner {
    padding: 0.45rem 0.65rem;
    gap: 0.5rem;
  }
  .brand-text {
    display: none;
  }
}

/* ─── Main Content Container ─── */
.main-content {
  flex-grow: 1;
  padding: 0.85rem 0.85rem calc(4.5rem + env(safe-area-inset-bottom, 0px));
  max-width: var(--max);
  margin: 0 auto;
  width: 100%;
}

@media (min-width: 768px) {
  .main-content {
    padding-bottom: 2.5rem;
  }
}

/* ─── Bottom Navigation (Mobile & Tablet) ─── */
.nav-desktop { display: none; }
@media (min-width: 768px) {
  .nav-desktop { display: inline-flex; }
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background-color: var(--card-bg);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-around;
  padding: 0.35rem 0 calc(0.45rem + env(safe-area-inset-bottom, 0px));
  z-index: 99;
  box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
}

@media (min-width: 768px) {
  .bottom-nav { display: none; }
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  background: none;
  border: none;
  color: var(--ink-muted);
  cursor: pointer;
  padding: 0.35rem 1rem;
  font-family: inherit;
  border-radius: 6px;
  touch-action: manipulation;
  min-height: 44px;
  min-width: 60px;
}

.nav-item.active {
  color: var(--navy);
  font-weight: bold;
}

.nav-icon { font-size: 1.25rem; }
.nav-label { font-size: 0.74rem; }

/* ─── Buttons ─── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.35rem;
  padding: 0.45rem 0.9rem;
  border-radius: var(--radius);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s ease;
  text-decoration: none;
  font-family: inherit;
  line-height: 1.3;
  touch-action: manipulation;
  min-height: 36px;
}

.btn:active {
  transform: scale(0.98);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-sm {
  padding: 0.3rem 0.65rem;
  font-size: 0.82rem;
  min-height: 32px;
}

.btn-primary {
  background-color: var(--navy);
  color: #ffffff;
}
.btn-primary:hover:not(:disabled) {
  background-color: var(--navy-hover);
}

.btn-secondary {
  background-color: transparent;
  border-color: var(--card-border);
  color: var(--ink);
}
.btn-secondary:hover:not(:disabled) {
  background-color: var(--card-border);
}

.btn-danger {
  background-color: var(--danger);
  color: #ffffff;
}

.btn-ghost {
  background: transparent;
  color: var(--ink);
  border: none;
}

/* ─── Cards & Form Controls ─── */
.card {
  background-color: var(--card-bg);
  border-radius: var(--radius);
  border: 1px solid var(--card-border);
  padding: 0.85rem 1rem;
  box-shadow: var(--card-shadow);
  margin-bottom: 0.75rem;
  color: var(--ink);
}

.form-group {
  margin-bottom: 0.65rem;
}

.form-label {
  display: block;
  margin-bottom: 0.25rem;
  font-weight: 600;
  font-size: 0.88rem;
  color: var(--ink);
}

.form-hint {
  font-size: 0.78rem;
  color: var(--ink-muted);
  margin-top: 0.2rem;
}

.form-hint a {
  color: var(--navy);
  text-decoration: none;
  font-weight: 600;
}

/* 16px font-size on mobile prevents iOS Safari auto-zoom on input focus */
.form-input, .form-textarea, .form-select {
  width: 100%;
  padding: 0.45rem 0.65rem;
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 0.92rem;
  background-color: var(--card-bg);
  color: var(--ink);
  transition: border-color 0.15s, box-shadow 0.15s;
}

@media (max-width: 768px) {
  .form-input, .form-textarea, .form-select {
    font-size: 16px !important;
  }
}

.form-input:focus, .form-textarea:focus, .form-select:focus {
  outline: none;
  border-color: var(--navy);
  box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
}

/* Responsive 2-column Form Row */
.form-row-2col {
  display: grid;
  grid-template-columns: 2fr 1.2fr;
  gap: 10px;
}

@media (max-width: 600px) {
  .form-row-2col {
    grid-template-columns: 1fr;
    gap: 8px;
  }
}

/* ─── 3-Tier Case Facts Visual Borders ─── */
.fact-confirmed { border-left: 4px solid var(--success); }
.fact-unknown { border-left: 4px solid var(--warning); }
.fact-assumption { border-left: 4px solid var(--danger); }

/* ─── PII Restored Highlight Badge ─── */
mark.restored-pii {
  background-color: var(--pii-bg);
  color: var(--pii-text);
  border: 1px solid var(--pii-border);
  padding: 0.05rem 0.3rem;
  border-radius: 4px;
  font-weight: 600;
  font-style: normal;
  display: inline-block;
}

/* ─── Local-First Reassurance Banner ─── */
.local-security-banner {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.6rem 0.85rem;
  background-color: rgba(30, 126, 68, 0.08);
  border: 1px solid rgba(30, 126, 68, 0.3);
  border-radius: var(--radius);
  margin-bottom: 0.85rem;
}

/* ─── Dashboard Filter Bar (Responsive) ─── */
.dashboard-filter-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
  align-items: center;
  flex-wrap: wrap;
}

@media (max-width: 640px) {
  .dashboard-filter-bar {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .dashboard-filter-bar input {
    max-width: 100% !important;
  }
  .tab-bar {
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }
}

/* ─── Tab Bar ─── */
.tab-bar {
  display: flex;
  border-bottom: 1px solid var(--card-border);
  margin-bottom: 0.75rem;
}
.tab-item {
  padding: 0.45rem 1rem;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  font-size: 0.85rem;
  touch-action: manipulation;
}
.tab-item.active {
  border-bottom-color: var(--navy);
  font-weight: bold;
  color: var(--navy);
}

/* ==========================================================================
   REPORT VIEW: Responsive Typography
   ========================================================================== */
.report-view-wrapper {
  max-width: 880px;
  margin: 0 auto;
}

.report-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.75rem;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.report-header-info .back-link {
  font-size: 0.8rem;
  color: var(--ink-muted);
  text-decoration: none;
  font-weight: 600;
}

.report-main-title {
  font-size: 1.25rem;
  color: var(--ink);
  font-weight: 700;
  margin: 0;
}

.report-actions {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  flex-wrap: wrap;
}

.font-zoom-ctrl {
  display: flex;
  align-items: center;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 2px 4px;
  gap: 2px;
}

/* Metadata Strip */
.report-meta-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1.25rem;
  padding: 0.5rem 0.85rem;
  background-color: var(--report-meta-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  margin-bottom: 0.85rem;
  font-size: 0.82rem;
  color: var(--ink);
}

.meta-item {
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.meta-label { color: var(--ink-muted); }
.meta-value { font-weight: 600; }

.meta-badge {
  background: var(--navy);
  color: white;
  padding: 0.1rem 0.45rem;
  border-radius: 4px;
  font-size: 0.78rem;
  font-weight: 600;
}

.meta-badge-secure {
  background: var(--success);
  color: white;
  padding: 0.1rem 0.45rem;
  border-radius: 4px;
  font-size: 0.78rem;
  font-weight: 600;
}

/* Document Sheet */
.report-document-sheet {
  background-color: var(--report-sheet-bg);
  color: var(--report-text);
  border: 1px solid var(--report-border);
  border-radius: var(--radius);
  padding: 1.25rem 1.5rem;
  box-shadow: var(--card-shadow);
  line-height: 1.6;
}

@media (max-width: 600px) {
  .report-document-sheet {
    padding: 0.85rem 1rem;
  }
}

.court-document-header {
  text-align: center;
  border-bottom: 2px solid var(--gold);
  padding-bottom: 0.75rem;
  margin-bottom: 1rem;
}

.court-crest {
  font-size: 2rem;
  display: block;
}

@media (max-width: 480px) {
  .court-crest { font-size: 1.5rem; }
}

.court-document-header h3 {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--ink);
}

.court-sub {
  font-size: 0.78rem;
  color: var(--ink-muted);
}

/* Tier Card Boxes */
.tier-card {
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  margin-bottom: 0.85rem;
  overflow: hidden;
  background-color: var(--card-bg);
}

.tier-card-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.45rem 0.85rem;
  background-color: var(--report-meta-bg);
  border-bottom: 1px solid var(--card-border);
}

.tier-badge {
  font-size: 0.78rem;
  font-weight: 700;
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
  background-color: var(--navy);
  color: white;
  white-space: nowrap;
}

.tier-title {
  font-size: 1.02rem;
  font-weight: 700;
  color: var(--ink);
  margin: 0;
}

.tier-card-body {
  padding: 0.85rem 1rem;
}

@media (max-width: 600px) {
  .tier-card-body {
    padding: 0.65rem 0.75rem;
  }
}

.tier-1 { border-top: 3px solid var(--navy); }
.tier-2 { border-top: 3px solid var(--success); }
.tier-2 .tier-badge { background-color: var(--success); }
.tier-3 { border-top: 3px solid var(--warning); }
.tier-3 .tier-badge { background-color: var(--warning); }
.tier-4 { border-top: 3px solid #f97316; }
.tier-4 .tier-badge { background-color: #f97316; }
.tier-5 { border-top: 3px solid var(--danger); }
.tier-5 .tier-badge { background-color: var(--danger); }

.report-bullet-list, .report-numbered-list {
  margin-left: 1.35rem;
  margin-bottom: 0.5rem;
}

.report-bullet-list li, .report-numbered-list li {
  margin-bottom: 0.35rem;
  color: var(--ink);
}

.report-paragraph {
  margin-bottom: 0.5rem;
}

.report-divider {
  border: 0;
  height: 1px;
  background: var(--line);
  margin: 1rem 0;
}

/* ─── Modal Overlay (Mobile Scroll Optimized) ─── */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(0, 0, 0, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 1rem;
}

.modal-box {
  background-color: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  max-width: 480px;
  width: 100%;
  padding: 1.25rem;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  color: var(--ink);
  max-height: 85vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

@media (max-width: 480px) {
  .modal-box {
    padding: 1rem;
  }
}

.modal-info-box {
  display: flex;
  gap: 0.6rem;
  align-items: flex-start;
  padding: 0.6rem 0.75rem;
  background-color: var(--report-meta-bg);
  border-radius: var(--radius);
}

/* ─── Toast Notifications ─── */
.toast-container {
  position: fixed;
  bottom: calc(70px + env(safe-area-inset-bottom, 0px));
  right: 15px;
  left: 15px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

@media (min-width: 600px) {
  .toast-container {
    left: auto;
    max-width: 360px;
  }
}

@media (min-width: 768px) {
  .toast-container {
    bottom: 25px;
  }
}

.toast {
  background-color: var(--navy);
  color: #ffffff;
  padding: 0.75rem 1rem;
  border-radius: var(--radius);
  box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  font-size: 0.88rem;
  display: flex;
  align-items: center;
  pointer-events: auto;
}

.toast-error { background-color: var(--danger); }
.toast-success { background-color: var(--success); }
.toast-warning { background-color: var(--warning); color: white; }

/* ─── Settings View Specific ─── */
.settings-container {
  max-width: 640px;
  margin: 0 auto;
}

.card-header-with-icon {
  display: flex;
  align-items: flex-start;
  gap: 0.65rem;
}

.card-icon { font-size: 1.35rem; }
.card-subtext {
  font-size: 0.8rem;
  color: var(--ink-muted);
}

.font-size-badge {
  font-size: 0.8rem;
  font-weight: 700;
  background: var(--report-meta-bg);
  padding: 0.15rem 0.45rem;
  border-radius: 4px;
}

.save-success-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.6rem 0.85rem;
  background-color: rgba(30, 126, 68, 0.12);
  border: 1px solid var(--success);
  border-radius: var(--radius);
  color: var(--success);
  font-weight: 600;
  font-size: 0.88rem;
}

/* ─── Utilities ─── */
.badge {
  display: inline-block;
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 600;
}

.empty-state {
  text-align: center;
  padding: 2rem 1rem;
  color: var(--ink-muted);
}

.loading-spinner {
  display: inline-block;
  width: 24px;
  height: 24px;
  border: 3px solid rgba(0,0,0,0.1);
  border-radius: 50%;
  border-top-color: var(--navy);
  animation: spin 0.8s ease-in-out infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ─── Print Stylesheet (PC Document Printing) ─── */
@media print {
  .top-bar, .bottom-nav, .no-print, .toast-container, .btn, .modal-overlay, .tab-bar {
    display: none !important;
  }
  body {
    background: #ffffff !important;
    color: #000000 !important;
  }
  .main-content {
    padding: 0 !important;
    max-width: 100% !important;
  }
  .report-document-sheet {
    box-shadow: none !important;
    border: none !important;
    padding: 0 !important;
    color: #000000 !important;
  }
  .tier-card {
    border: 1px solid #999 !important;
    page-break-inside: avoid;
    margin-bottom: 1rem !important;
    background: #ffffff !important;
  }
  .tier-card-header {
    background: #f0f0f0 !important;
    color: #000000 !important;
  }
  .tier-badge {
    background: #333333 !important;
    color: #ffffff !important;
  }
  mark.restored-pii {
    background: transparent !important;
    border-bottom: 1px dotted #000 !important;
    color: #000 !important;
  }
}
  </style>
</head>
<body>
  <!-- ─── Top Bar ─── -->
  <header class="top-bar">
    <div class="top-bar-inner">

    /* ==========================================================================
       INDEXEDDB LOCAL STORAGE
       ========================================================================== */
    const DB_NAME = 'caseReviewStandaloneDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'cases';

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            store.createIndex('updatedAt', 'updatedAt', { unique: false });
          }
        };
        request.onsuccess = (event) => resolve(event.target.result);
        request.onerror = (event) => reject(event.target.error);
      });
    }

    async function putCase(caseData) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction([STORE_NAME], 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.put(caseData);
        req.onsuccess = () => resolve(caseData.id);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    async function getCase(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction([STORE_NAME], 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.get(id);
        req.onsuccess = (e) => resolve(e.target.result || null);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    async function getAllCases() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction([STORE_NAME], 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = (e) => {
          const cases = e.target.result || [];
          cases.sort((a, b) => (b.updatedAt > a.updatedAt ? 1 : -1));
          resolve(cases);
        };
        req.onerror = (e) => reject(e.target.error);
      });
    }

    async function deleteCase(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction([STORE_NAME], 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e.target.error);
      });
    }

    /* ==========================================================================
       REVERSIBLE PII SANITIZER (Masking / Unmasking Engine)
       ========================================================================== */
    const PII_PATTERNS = [
      { type: 'citizen_id', tokenPrefix: 'CITIZEN_ID', regex: /[1-8]\s?[-–]?\s?\d{4}\s?[-–]?\s?\d{5}\s?[-–]?\s?\d{2}\s?[-–]?\s?\d{1}/g },
      { type: 'bank_account', tokenPrefix: 'BANK_ACCT', regex: /\d{3}\s?[-–]?\s?\d{1}\s?[-–]?\s?\d{5}\s?[-–]?\s?\d{1}/g },
      { type: 'phone', tokenPrefix: 'PHONE', regex: /0[2-9]\d\s?[-–.]?\s?\d{3,4}\s?[-–.]?\s?\d{4}/g },
      { type: 'address', tokenPrefix: 'ADDRESS', regex: /\d{1,4}[\/\-]?\d{0,4}\s+(?:หมู่|ซอย|ซ\.|ถนน|ถ\.|ตำบล|ต\.|อำเภอ|อ\.|แขวง|เขต|จังหวัด|จ\.)[\u0E00-\u0E7F\w\s\/\-,\.]{10,80}/g }
    ];

    function extractNameVariants(rawLabel) {
      if (!rawLabel) return [];
      const variants = new Set();
      const trimmed = rawLabel.trim();
      if (!trimmed) return [];

      variants.add(trimmed);

      const withoutParens = trimmed.replace(/\s*[\(\[（].*?[\)\]）]\s*/g, '').trim();
      if (withoutParens && withoutParens !== trimmed) {
        variants.add(withoutParens);
      }

      const base = withoutParens || trimmed;
      const titles = ['นาย', 'นางสาว', 'นาง', 'เด็กชาย', 'เด็กหญิง', 'คุณ', 'บจก.', 'หจก.', 'บริษัท'];
      for (const t of titles) {
        if (base.startsWith(t)) {
          const stripped = base.slice(t.length).trim();
          if (stripped.length >= 3) variants.add(stripped);
        }
      }
      return Array.from(variants);
    }

    function sanitize(text, parties = []) {
      let sanitizedText = text || '';
      const mappings = {};
      const counters = { party: 0, citizen_id: 0, bank_account: 0, phone: 0, address: 0 };
      const valueToToken = new Map();
      const labelChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const partyTokens = [];

      parties.forEach(party => {
        const raw = party.label || (typeof party === 'string' ? party : '');
        if (!raw.trim()) return;

        const variants = extractNameVariants(raw);
        const primaryName = variants[1] || variants[0];

        const lbl = counters.party < labelChars.length ? labelChars[counters.party] : `PARTY_${counters.party}`;
        const token = `[PARTY_${lbl}]`;
        counters.party++;

        mappings[token] = primaryName;

        variants.forEach(v => {
          partyTokens.push({ variant: v, token });
        });
      });

      partyTokens.sort((a, b) => b.variant.length - a.variant.length);

      partyTokens.forEach(({ variant, token }) => {
        const escaped = variant.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        sanitizedText = sanitizedText.replace(new RegExp(escaped, 'g'), token);
      });

      PII_PATTERNS.forEach(({ type, tokenPrefix, regex }) => {
        sanitizedText = sanitizedText.replace(regex, (match) => {
          let token = valueToToken.get(match);
          if (!token) {
            counters[type]++;
            token = `[${tokenPrefix}_${counters[type]}]`;
            valueToToken.set(match, token);
            mappings[token] = match;
          }
          return token;
        });
      });

      return { sanitizedText, mappings, counters };
    }

    function unsanitize(text, mappings) {
      if (!text || !mappings) return text || '';
      let result = text;
      const sortedTokens = Object.keys(mappings).sort((a, b) => b.length - a.length);
      sortedTokens.forEach(token => {
        const original = mappings[token];
        const replacement = `<mark class="restored-pii" title="ข้อมูลที่ถูก unmask: ${original}">${original}</mark>`;
        const escaped = token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        result = result.replace(new RegExp(escaped, 'g'), replacement);
      });
      return result;
    }

        }
      }
      return sanitize(fullText.trim(), parties);
    }

    function buildUserPrompt(caseData) {
      const { title, caseType, parties, facts, specificTriggers } = caseData;
      let prompt = `ขอให้ท่านช่วยวิเคราะห์ข้อเท็จจริงและวางกลยุทธ์ทางคดีต่อไปนี้:\n\n`;
      prompt += `📌 ชื่อคดี: ${title || 'ไม่ระบุ'}\n`;
      prompt += `📌 ประเภทคดี: ${caseType || 'ทั่วไป'}\n\n`;

      if (parties && parties.length > 0) {
        prompt += `👥 คู่ความในคดี:\n`;
        parties.forEach(p => { prompt += `* ${p.label || 'ไม่ระบุชื่อ'} (${p.role || 'คู่ความ'})\n`; });
        prompt += `\n`;
      }

      if (specificTriggers && Object.keys(specificTriggers).length > 0) {
        prompt += `⚖️ ข้อมูลจุดชี้ขาดเฉพาะคดี (${caseType}):\n`;
        for (const [key, val] of Object.entries(specificTriggers)) {
          if (val) prompt += `* ${key}: ${val}\n`;
        }
        prompt += `\n`;
      }

      prompt += `📋 ข้อเท็จจริงของคดี (3 ชั้นข้อมูล):\n\n`;
      if (facts) {
        if (facts.confirmed && facts.confirmed.length > 0) {
          prompt += `[1. ข้อเท็จจริงที่ยืนยันแล้ว - มีหลักฐานชัดเจน]\n`;
          facts.confirmed.forEach(f => { prompt += `* ${f.text || f}\n`; });
          prompt += `\n`;
        }
        if (facts.unknown && facts.unknown.length > 0) {
          prompt += `[2. ข้อเท็จจริงที่ยังไม่ทราบ - ต้องสืบค้นเพิ่ม]\n`;
          facts.unknown.forEach(f => { prompt += `* ${f.text || f}\n`; });
          prompt += `\n`;
        }
        if (facts.assumptions && facts.assumptions.length > 0) {
          prompt += `[3. ข้อสันนิษฐาน - มีความเสี่ยงหากถูกหักล้าง]\n`;
          facts.assumptions.forEach(f => { prompt += `* ${f.text || f}\n`; });
          prompt += `\n`;
        }
      }
      return prompt.trim();
    }

    async function callGemini(model, sanitizedFactsText, apiKey) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
      const requestBody = {
        system_instruction: { parts: [{ text: buildSystemInstruction() }] },
        contents: [{ role: "user", parts: [{ text: sanitizedFactsText }] }],
        generationConfig: { temperature: 0.3, topP: 0.95, maxOutputTokens: 8192 },
        safetySettings: [
          { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
          { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
          { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
          { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
        ]
      };

      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": apiKey
        },
        body: JSON.stringify(requestBody)
      });

      if (!response.ok) {
        const errorBody = await response.text();
        let msg = `(${response.status}) ${errorBody}`;
        try {
          const parsed = JSON.parse(errorBody);
          if (parsed.error && parsed.error.message) msg = parsed.error.message;
        } catch (e) {}
        const err = new Error(msg);
        err.status = response.status;
        throw err;
      }

      const data = await response.json();
      if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
        throw new Error("API ไม่ส่งผลลัพธ์ข้อความกลับมา");
      }

      return {
        text: data.candidates[0].content.parts[0].text,
        tokenUsage: data.usageMetadata ? {
          input: data.usageMetadata.promptTokenCount,
          output: data.usageMetadata.candidatesTokenCount
        } : null
      };
    }

        try {
          if (i > 0 && typeof onFallback === 'function') {
            onFallback({ originalModel: targetModel, fallbackModel: currentModel, attempt: i });
          }
          const result = await callGemini(currentModel, sanitizedFactsText, apiKey);
          return { ...result, modelUsed: currentModel, fallbackTriggered: i > 0 };
        } catch (err) {
          console.warn(`[AI Client] Model ${currentModel} failed:`, err.message);
          lastError = err;
          if (err.status === 401) {
            let detail = err.message || "";
            if (detail.includes("API_KEY_SERVICE_BLOCKED") || detail.includes("ACCESS_TOKEN_TYPE_UNSUPPORTED")) {
              detail = "คีย์/โทเคนนี้ไม่ได้รับอนุญาตให้ใช้งาน Generative Language API (กรุณาใช้ API Key จาก Google AI Studio ที่ aistudio.google.com/app/apikey)";
            }
            throw new Error(`การยืนยันตัวตนล้มเหลว (401 Unauthorized): ${detail}`);
          }
          if (err.status === 400 && err.message.includes('API_KEY_INVALID')) {
            throw new Error("API Key ไม่ถูกต้อง กรุณาตรวจสอบในหน้าตั้งค่า");
          }
          if (err.status === 403) throw new Error(`การเข้าถึงถูกปฏิเสธ (403): ${err.message}`);
        }
      }
      throw new Error(`ไม่สามารถวิเคราะห์ได้หลังจากลองโมเดลสำรองทั้งหมดแล้ว: ${lastError?.message || 'Unknown error'}`);
    }

    async function testApiKey(apiKey, preferredModel = 'gemini-3.8-flash') {
      const modelsToTry = [preferredModel, 'gemini-3.7-flash', 'gemini-2.5-flash'];
      for (const m of modelsToTry) {
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${apiKey}`;
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": apiKey
            },
            body: JSON.stringify({ contents: [{ parts: [{ text: "ping" }] }] })
          });
          if (response.ok) return true;
        } catch (e) {}
      }
      return false;
    }

    /* ==========================================================================
       REPORT FORMATTER (Tailored for Thai Litigation)
       ========================================================================== */
    
    function computeFactsHash(data) {
      const str = JSON.stringify({
        title: (data.title || '').trim(),
        type: (data.type || '').trim(),
        parties: (data.parties || []).map(p => ({ label: (p.label || '').trim(), role: (p.role || '').trim() })),
        triggers: data.specificTriggers || {},
        confirmed: (data.factsConfirmed || []).map(f => (f.text || f || '').trim()),
        unknown: (data.factsUnknown || []).map(f => (f.text || f || '').trim()),
        assumptions: (data.assumptions || []).map(f => (f.text || f || '').trim())
      });
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash |= 0;
      }
      return String(hash);
    }

    function formatForLine(text, caseTitle) {
      if (!text) return '';
      let clean = text
        .replace(/^##\s+ชั้นที่\s+(\d+)[:\s]+(.+)$/gm, '📌 ชั้นที่ $1: $2')
        .replace(/^##\s+ส่วนที่\s+(\d+)[:\s]+(.+)$/gm, '📌 ส่วนที่ $1: $2')
        .replace(/^##\s+(.+)$/gm, '📌 $1')
        .replace(/^###\s+(.+)$/gm, '👉 $1')
        .replace(/\*\*(.+?)\*\*/g, '$1')
        .replace(/\*(.+?)\*/g, '$1')
        .replace(/^[\*\-]\s+/gm, '• ')
        .replace(/\n{3,}/g, '\n\n')
        .trim();

      return `⚖️ สรุปรายงานคดี: ${caseTitle || 'ไม่มีชื่อคดี'}\n--------------------------------\n${clean}\n--------------------------------\n(ส่งผ่านระบบช่วยคิดคดีความทนายความไทย)`;
    }

    function formatForEmail(text, caseTitle) {
      if (!text) return '';
      let clean = text
        .replace(/\*\*(.+?)\*\*/g, '$1')
        .replace(/\*(.+?)\*/g, '$1')
        .replace(/^[\*\-]\s+/gm, '• ')
        .trim();

      return `เรื่อง: สรุปรายงานและความเห็นทางกฎหมาย — ${caseTitle || 'คดีความ'}\n\nเรียน ลูกความที่เคารพ,\n\n${clean}\n\nขอแสดงความนับถือ,\nทนายความผู้รับผิดชอบคดี`;
    }

    function formatLegalReport(markdownText) {
      if (!markdownText) return '';
      let text = markdownText.replace(/\r\n/g, '\n');
      text = text.replace(/^(เรียน\s+[^\n]+)/gim, '<p style="margin-bottom: 1rem;"><strong>$1</strong></p>');
      text = text.replace(/^---$/gm, '<hr class="report-divider">');

      text = text.replace(/^##\s+(ชั้นที่\s+(\d+)[:\s]+[^\n]+)/gm, (match, fullTitle, tierNum) => {
        return `<div class="tier-card tier-${tierNum}">
          <div class="tier-card-header">
            <span class="tier-badge">ชั้นที่ ${tierNum}</span>
            <h3 class="tier-title">${fullTitle.replace(/^ชั้นที่\s+\d+[:\s]*/, '')}</h3>
          </div>
          <div class="tier-card-body">`;
      });

      text = text.replace(/^##\s+(ส่วนที่\s+(\d+)[:\s]+[^\n]+)/gm, (match, fullTitle, secNum) => {
        return `<div class="tier-card tier-${secNum}">
          <div class="tier-card-header">
            <span class="tier-badge">ส่วนที่ ${secNum}</span>
            <h3 class="tier-title">${fullTitle.replace(/^ส่วนที่\s+\d+[:\s]*/, '')}</h3>
          </div>
          <div class="tier-card-body">`;
      });

      text = text.replace(/^##\s+(.+)$/gm, '<h3 style="margin-top: 1rem; margin-bottom: 0.5rem; color: var(--navy);">$1</h3>');
      text = text.replace(/^###\s+(.+)$/gm, '<h4 style="margin-top: 0.8rem; margin-bottom: 0.4rem; color: var(--gold);">$1</h4>');
      text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');

      const lines = text.split('\n');
      const processedLines = [];
      let inList = false;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        const bulletMatch = line.match(/^[\*\-]\s+(.+)$/);
        const numberMatch = line.match(/^(\d+)\.\s+(.+)$/);

        if (bulletMatch) {
          if (!inList) { processedLines.push('<ul class="report-bullet-list">'); inList = true; }
          processedLines.push(`<li>${bulletMatch[1]}</li>`);
        } else if (numberMatch) {
          if (!inList) { processedLines.push('<ol class="report-numbered-list">'); inList = true; }
          processedLines.push(`<li>${numberMatch[2]}</li>`);
        } else {
          if (inList) { processedLines.push('</ul>'); inList = false; }
          if (!line) {
            processedLines.push('');
          } else if (!line.startsWith('<h') && !line.startsWith('<div') && !line.startsWith('<hr') && !line.startsWith('</div')) {
            processedLines.push(`<p class="report-paragraph">${line}</p>`);
          } else {
            processedLines.push(line);
          }
        }
      }
      if (inList) processedLines.push('</ul>');

      let finalHtml = processedLines.join('\n');
      const tierOpenCount = (finalHtml.match(/<div class="tier-card /g) || []).length;
      if (tierOpenCount > 0) {
        finalHtml = finalHtml.replace(/(<\/div>\s*<\/div>)?(\s*<div class="tier-card )/g, '</div></div>$2');
        finalHtml += '</div></div>';
        finalHtml = finalHtml.replace(/^<\/div><\/div>/, '');
      }
      return finalHtml;
    }

            caseType: caseData.type,
            parties: caseData.parties,
            specificTriggers: caseData.specificTriggers,
            facts: {
              confirmed: caseData.factsConfirmed.map(f => f.text),
              unknown: caseData.factsUnknown.map(f => f.text),
              assumptions: caseData.assumptions.map(f => f.text)
            }
          };
          const userPrompt = buildUserPrompt(promptData);
          const { sanitizedText: sanitizedPrompt, mappings: promptMappings } = sanitize(userPrompt, caseData.parties);

          const res = await analyzeCase(sanitizedPrompt, runSettings, (fallbackInfo) => {
            showToast(`⚠️ โมเดล ${fallbackInfo.originalModel} ไม่พร้อม สลับไปใช้ ${fallbackInfo.fallbackModel} อัตโนมัติ`, 'warning');
          });

          const sanitizerMap = {};
          Object.keys(promptMappings).forEach(k => sanitizerMap[k] = promptMappings[k]);
          Object.keys(mappings).forEach(k => sanitizerMap[k] = mappings[k]);

          // Dual-output splitting
          const separatorRegex = /(?:={3,}\s*CLIENT_REPORT_SEPARATOR\s*={3,}|(?:###|##)\s*\[?ส่วนที่ 2[:\s]+(?:ร่างข้อความ)?รายงานลูกความ)/i;
          const rawText = res.text || '';
          const parts = rawText.split(separatorRegex);
          const strategyPart = (parts[0] || '').trim();
          const clientPart = (parts.length > 1 ? parts.slice(1).join('\n') : strategyPart).trim();
          const currentFactsHash = computeFactsHash(caseData);

          caseData.aiAnalysis = {
            strategyResponse: strategyPart,
            clientResponse: clientPart,
            rawResponse: rawText,
            model: res.modelUsed || selectedModel,
            analyzedAt: new Date().toISOString(),
            tokenUsage: res.tokenUsage,
            factsHash: currentFactsHash
          };
          caseData.sanitizerMap = sanitizerMap;
          caseData.status = 'reviewed';
          caseData.updatedAt = new Date().toISOString();
          await putCase(caseData);

          showToast('วิเคราะห์และแคชรายงานลงเครื่องเรียบร้อย!', 'success');
          window.location.hash = '#report/' + caseData.id;
        } catch (err) {
          showToast(`เกิดข้อผิดพลาด: ${err.message}`, 'error');
        }
      });

      if (caseId) {
        document.getElementById('btn-delete').addEventListener('click', async () => {
          if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบคดีนี้?')) {
            await deleteCase(caseId);
            showToast('ลบคดีเรียบร้อยแล้ว', 'info');
            window.location.hash = '#dashboard';
          }
        });
      }
    }

    /* ==========================================================================
       UI: SETTINGS PANEL
       ========================================================================== */
    function renderSettings(container) {
      const settings = getSettings();

      container.innerHTML = `
        <div class="settings-container" style="max-width: 640px; margin: 0 auto;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
            <h2 style="margin: 0; font-size: 1.35rem;">ตั้งค่าระบบ</h2>
            <a href="#dashboard" class="btn btn-secondary btn-sm">← กลับหน้าคดี</a>
          </div>

          <div class="local-security-banner">
            <div style="font-size: 1.3rem;">🔒</div>
            <div>
              <strong style="color: var(--ink);">ระบบ Standalone ทำงานในเครื่อง 100%</strong>
              <div style="font-size: 0.84rem; color: var(--ink-muted); margin-top: 2px;">
                คีย์ของคุณถูกฝังไว้แล้วและจัดเก็บในเครื่อง ข้อมูลคดีจะไม่มีวันหลุดออกนอกบราวเซอร์ของคุณ
              </div>
            </div>
          </div>

          <div class="card" style="margin-top: 10px;">
            <div style="display: flex; align-items: flex-start; gap: 0.65rem; margin-bottom: 8px;">
              <span style="font-size: 1.35rem;">⚡</span>
              <div>
                <h3 style="margin: 0; font-size: 1.05rem;">การเชื่อมต่อ Google AI Studio (Gemini)</h3>
                <p class="form-hint" style="margin-top: 2px;">ส่งคำขอตรงจากเครื่องของคุณไปยัง Google โดยผ่านการ Masking ข้อมูลส่วนบุคคลก่อนเสมอ</p>
              </div>
            </div>

            <div class="form-group" style="margin-top: 10px;">
              <label class="form-label" for="api-key">Gemini API Key (ฝังไว้เรียบร้อยแล้ว)</label>
              <div style="display: flex; gap: 8px;">
                <input type="password" id="api-key" class="form-input" value="${settings.apiKey || EMBEDDED_API_KEY}" placeholder="AIzaSy...">
                <button id="btn-toggle-key" class="btn btn-secondary btn-sm">👁️</button>
                <button id="btn-test" class="btn btn-secondary btn-sm" style="min-width: 80px;">ทดสอบ</button>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="model-select">โมเดลเริ่มต้นสำหรับวิเคราะห์ (Default Model)</label>
              <select id="model-select" class="form-select">
                ${SUPPORTED_MODELS.map(m => `
                  <option value="${m.id}" ${m.id === (settings.selectedModel || 'gemini-3.8-flash') ? 'selected' : ''}>
                    ${m.label}
                  </option>
                `).join('')}
              </select>
              <div class="form-hint">💡 หากโมเดลที่เลือกไม่พร้อมใช้งาน ระบบมี Auto-Fallback สลับไปใช้รุ่นอื่นให้อัตโนมัติ</div>
            </div>
          </div>

          <div class="card">
            <div style="display: flex; align-items: flex-start; gap: 0.65rem; margin-bottom: 8px;">
              <span style="font-size: 1.35rem;">🎨</span>
              <div>
                <h3 style="margin: 0; font-size: 1.05rem;">การแสดงผลและขนาดตัวอักษร</h3>
                <p class="form-hint" style="margin-top: 2px;">ปรับโทนสีและขนาดให้อ่านสบายตาที่สุด</p>
              </div>
            </div>

            <div class="form-group" style="margin-top: 10px;">
              <label class="form-label" for="theme-select">ธีมสีของโปรแกรม</label>
              <select id="theme-select" class="form-select">
                <option value="auto" ${settings.theme === 'auto' ? 'selected' : ''}>อัตโนมัติตามระบบ (System Default)</option>
                <option value="light" ${settings.theme === 'light' ? 'selected' : ''}>สว่าง - โทนกระดาษศาล (Light Paper)</option>
                <option value="dark" ${settings.theme === 'dark' ? 'selected' : ''}>มืด - ถนอมสายตา (Dark Slate)</option>
              </select>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <label class="form-label" for="font-size" style="margin-bottom: 0;">ขนาดตัวอักษรพื้นฐาน</label>
                <span class="badge" style="background: var(--report-meta-bg); color: var(--ink);"><span id="font-size-val">${settings.fontSize || 16}</span> px</span>
              </div>
              <input type="range" id="font-size" min="14" max="22" value="${settings.fontSize || 16}" style="width: 100%; margin-top: 6px;">
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px;">
            <button id="btn-save" class="btn btn-primary" style="padding: 11px; font-size: 1.05rem; font-weight: bold; width: 100%;">
              💾 บันทึกการตั้งค่า
            </button>
            <div id="save-success-box" style="display: none; align-items: center; justify-content: space-between; padding: 0.6rem 0.85rem; background-color: rgba(30,126,68,0.12); border: 1px solid var(--success); border-radius: var(--radius); color: var(--success); font-weight: 600; font-size: 0.88rem;">
              <span>✅ บันทึกการตั้งค่าเรียบร้อย</span>
              <button class="btn btn-sm btn-primary" onclick="window.location.hash='#dashboard'">ไปที่หน้าคดีทันที →</button>
            </div>
          </div>
        </div>
      `;

      const apiKeyInput = document.getElementById('api-key');
      const toggleBtn = document.getElementById('btn-toggle-key');
      toggleBtn.addEventListener('click', () => {
        if (apiKeyInput.type === 'password') {
          apiKeyInput.type = 'text';
          toggleBtn.textContent = '🔒';
        } else {
          apiKeyInput.type = 'password';
          toggleBtn.textContent = '👁️';
        }
      });

      document.getElementById('font-size').addEventListener('input', (e) => {
        document.getElementById('font-size-val').textContent = e.target.value;
        document.documentElement.style.fontSize = `${e.target.value}px`;
      });

      document.getElementById('theme-select').addEventListener('change', (e) => {
        const val = e.target.value;
        if (val === 'auto') {
          const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } else {
          document.documentElement.setAttribute('data-theme', val);
        }
      });

      document.getElementById('btn-test').addEventListener('click', async () => {
        const key = document.getElementById('api-key').value.trim();
        if (!key) return showToast('กรุณากรอก API Key ก่อนทดสอบ', 'warning');
        const btn = document.getElementById('btn-test');
        btn.disabled = true;
        btn.textContent = 'ทดสอบ...';
        try {
          const ok = await testApiKey(key, document.getElementById('model-select').value);
          if (ok) showToast('เชื่อมต่อกับ Google AI Studio สำเร็จ!', 'success');
          else showToast('API Key ไม่ถูกต้อง หรือโมเดลไม่ตอบสนอง', 'error');
        } catch (e) {
          showToast(`เกิดข้อผิดพลาด: ${e.message}`, 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'ทดสอบ';
        }
      });

      document.getElementById('btn-save').addEventListener('click', () => {
        const apiKey = document.getElementById('api-key').value.trim();
        const selectedModel = document.getElementById('model-select').value;
        const theme = document.getElementById('theme-select').value;
        const fontSize = parseInt(document.getElementById('font-size').value, 10);
        updateSettings({ apiKey, selectedModel, theme, fontSize });
        showToast('บันทึกการตั้งค่าเรียบร้อยแล้ว', 'success');
        document.getElementById('save-success-box').style.display = 'flex';
      });
    }

    /* ==========================================================================
       ROUTER & INITIALIZATION
       ========================================================================== */
    const ROUTES = {
      dashboard: { render: renderCaseList, title: 'คดีทั้งหมด' },
      settings: { render: renderSettings, title: 'ตั้งค่า' }
    };

    function getMainContainer() { return document.getElementById('main-content'); }

    function setActiveNav(route) {
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.route === route);
      });
    }

    function updateTitle(title) {
      const titleEl = document.getElementById('page-title');
      if (titleEl) titleEl.textContent = title;
    }

    async function handleRoute() {
      const hash = window.location.hash.slice(1) || 'dashboard';
      const container = getMainContainer();
      container.innerHTML = '<div class="loading-spinner" aria-label="กำลังโหลด..."></div>';

      try {
        if (ROUTES[hash]) {
          setActiveNav(hash);
          updateTitle(ROUTES[hash].title);
          await ROUTES[hash].render(container);
          return;
        }

        if (hash === 'case/new') {
          setActiveNav('dashboard');
          updateTitle('สร้างคดีใหม่');
          await renderCaseForm(container);
          return;
        }

        const caseMatch = hash.match(/^case\/(.+)$/);
        if (caseMatch) {
          setActiveNav('dashboard');
          updateTitle('แก้ไขคดี');
          await renderCaseForm(container, caseMatch[1]);
          return;
        }

        const reportMatch = hash.match(/^report\/(.+)$/);
        if (reportMatch) {
          setActiveNav('dashboard');
          updateTitle('รายงานวิเคราะห์');
          await renderReport(container, reportMatch[1]);
          return;
        }

        window.location.hash = '#dashboard';
      } catch (err) {
        console.error('[Router] Error:', err);
        container.innerHTML = `
          <div class="empty-state">
            <p>❌ เกิดข้อผิดพลาด: ${err.message}</p>
            <button class="btn btn-primary" onclick="window.location.hash='#dashboard'">กลับหน้าหลัก</button>
          </div>
        `;
      }
    }

    function initApp() {
      applyTheme();

      document.querySelectorAll('.nav-item, .nav-desktop').forEach(el => {
        el.addEventListener('click', (e) => {
          e.preventDefault();
          const route = el.dataset.route;
          if (route) window.location.hash = '#' + route;
        });
      });

      window.addEventListener('hashchange', handleRoute);
      handleRoute();
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
