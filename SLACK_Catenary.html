                              <span key={l} className="flex items-center gap-1"><svg width="10" height="10"><path d="M5,10 L0,1 L10,1 Z" fill={BUOY_FILL[isDark ? 'dark' : 'light'][l]}/></svg>{l === 'ok' ? 'Buoy sub. <50%' : l === 'warn' ? '50-85%' : '≥85% / fully sub.'}</span>
                          ))}
                      </div>
                  </div>
                  <div className="flex-1 w-full h-full">
                      <ResponsiveContainer width="100%" height="100%">
                          <ScatterChart margin={{ top: 10, right: 30, bottom: 30, left: 20 }}>
                              <CartesianGrid strokeDasharray="3 3" stroke={isDark ? "#26344A" : "#E6EBF1"} strokeOpacity={0.9} />
                              <XAxis dataKey="x" type="number" unit="m" ticks={xTicks} domain={[0, maxX]} stroke={isDark ? "#94A4B8" : "#55687F"} tick={{fontSize: 11, fill: isDark ? "#94A4B8" : "#55687F"}} tickLine={{stroke: isDark ? "#3C4C60" : "#BCC8D8"}} label={{ value: 'Distance from Fairlead (m)', position: 'insideBottomRight', offset: -10, fill: isDark ? "#94A4B8" : "#55687F", fontSize: 12 }} />
                              <YAxis dataKey="z" type="number" unit="m" ticks={yTicks} domain={[minDepth, maxDepth]} stroke={isDark ? "#94A4B8" : "#55687F"} reversed={true} tick={{fontSize: 11, fill: isDark ? "#94A4B8" : "#55687F"}} tickLine={{stroke: isDark ? "#3C4C60" : "#BCC8D8"}} label={{ value: 'Depth (m)', angle: -90, position: 'insideLeft', fill: isDark ? "#94A4B8" : "#55687F", fontSize: 12 }} />
                              <Tooltip cursor={{ strokeDasharray: '3 3', stroke: isDark ? '#94A4B8' : '#55687F', strokeWidth: 1 }} content={({ active, payload }) => {
                                  if (active && payload && payload.length) {
                                      const currentX = payload[0].payload.x;
                                      const getInterpolatedData = (caseData) => {
                                          const allPoints = flatSortedByCase.get(caseData.id) || caseData.segments.flat().sort((a, b) => a.x - b.x);
                                          let p1 = allPoints[0], p2 = allPoints[allPoints.length - 1];
                                          for (let i = 0; i < allPoints.length - 1; i++) { if (allPoints[i].x <= currentX && allPoints[i+1].x >= currentX) { p1 = allPoints[i]; p2 = allPoints[i+1]; break; } }
                                          if (!p1 || !p2) return null;
                                          const ratio = (currentX - p1.x) / (p2.x - p1.x || 1);
                                          const interpZ = p1.z + (p2.z - p1.z) * ratio;
                                          return { z: interpZ, heightAboveSeabed: caseData.waterDepth - interpZ };
                                      };
                                      return (
                                          <div className={`p-3 rounded shadow-lg text-xs border z-50 ${isDark ? 'bg-gray-900 border-gray-700 text-gray-200' : 'bg-white border-gray-200 text-gray-800'}`}>
                                              <div className="font-bold mb-2 border-b pb-1 border-gray-200 dark:border-gray-700">Distance: {currentX.toFixed(1)} m</div>
                                              <div className="flex flex-col gap-2">
                                                  {chartData.map((res) => {
                                                      const data = getInterpolatedData(res);
                                                      if (!data) return null;
                                                      const nearBuoys = res.buoys.filter(b => Math.abs(b.x - currentX) <= 10);
                                                      const nearbyBuoy = nearBuoys[0];
                                                      let baseLabel = res.isMax ? `Max (${res.horizontalTension?.toFixed(1)}t)` : `Case ${res.horizontalTension?.toFixed(1)}t`;
                                                      const label = res.isActiveTab ? baseLabel : `[${res.tabName}] ${baseLabel}`;
                                                      let buoyInfo = null;
                                                      if(nearbyBuoy) {
                                                          buoyInfo = nearBuoys.map((nb, k) => { const u = (nb.buoyUtilization || 0) * 100;
                                                              return <span key={k} className={`ml-1 text-[11px] ${u >= 85 ? 'text-bad-600 dark:text-bad-400 font-bold' : 'text-gray-500 dark:text-gray-400'}`}>(B{getBuoyDisplayNumber(nb, [], k)} {u.toFixed(0)}% sub.)</span>; });
                                                      }
                                                      return (
                                                          <div key={res.id} className="flex items-center justify-between gap-4">
                                                              <div className="flex items-center gap-2" style={{opacity: res.isActiveTab ? 1 : 0.6}}>
                                                                  <span className="w-2 h-2 rounded-full" style={{backgroundColor: res.color}}></span>
                                                                  <span className="font-mono">{label}</span>
                                                                  {buoyInfo}
                                                                  {nearbyBuoy && nearbyBuoy.isSlack && <span className="text-[11px] bg-gray-200 text-gray-600 px-1 rounded font-bold">SLACK</span>}
                                                              </div>
                                                              <div className="text-right"><span className={`font-semibold ${data.heightAboveSeabed < 0.1 ? 'text-gray-400' : 'text-accent-600 dark:text-accent-400'}`}>{data.heightAboveSeabed <= 0.05 ? 'On seabed' : `↑ ${data.heightAboveSeabed.toFixed(1)} m above seabed`}</span></div>
                                                          </div>
                                                      );
                                                  })}
                                              </div>
                                          </div>
                                      );
                                  }
                                  return null;
                              }} />
                              
                              {chartData.map((res) => (
                                  <React.Fragment key={res.id}>
                                      {res.buoys.map((b, bIdx) => {
                                          const pennantStroke = theme === 'dark' ? '#F5A524' : '#A85D00';
                                          return (
                                              <Scatter key={`pennant-wire-${res.id}-${bIdx}`} data={[{ x: b.x, z: b.pennantBaseZ }, { x: b.x, z: b.pennantTopZ }]} line={{ stroke: b.isSlack ? '#7286A0' : pennantStroke, strokeWidth: 2, strokeDasharray: b.isSlack ? '5 5' : '2 2' }} shape={() => null} legendType="none" isAnimationActive={false} />
                                          );
                                      })}
                                      {res.segments.map((segPoints, sIdx) => {
                                          const segType = segPoints[0].segmentType;
                                          const isChain = isChainType(segType);
                                          // U16: invalid cases drawn dashed + faded. E3: no per-point hit circles, no animation.
                                          return (
                                              <Scatter key={`seg-${res.id}-${sIdx}`} data={segPoints} line={{ stroke: res.color, strokeWidth: isChain ? 3.5 : 2, strokeDasharray: res.invalid ? '2 4' : (isChain ? '7 3' : '0'), strokeOpacity: res.invalid ? 0.55 : 1 }} shape={() => null} legendType="none" isAnimationActive={false} onMouseEnter={() => setHoverCaseId(res.id)} onMouseLeave={() => setHoverCaseId(null)} />
                                          );
                                      })}
                                      {res.buoysData.length > 0 && (
                                          <Scatter key={`buoys-${res.id}`} data={res.buoysData} shape={renderBuoyShape} legendType="none" isAnimationActive={false} />
                                      )}
                                      {res.anchor && (
                                          <Scatter key={`anchor-${res.id}`} data={[res.anchor]} shape={(props) => renderAnchorShape({...props, fill: res.color})} legendType="none" isAnimationActive={false} />
                                      )}
                                  </React.Fragment>
                              ))}
                              
                              {structurePoints.length > 0 && (
                                  <Scatter key="subsea-structures" data={structurePoints} shape={renderStructureShape} legendType="none" isAnimationActive={false} />
                              )}

                              <ReferenceLine y={0} stroke="#2E9BF0" strokeDasharray="4 2" strokeOpacity={1} strokeWidth={1.5} ifOverflow="extendDomain" label={{ position: 'insideTopRight', value: 'Sea Surface', fill: '#2E9BF0', fontSize: 10, fontWeight: 'bold' }} />
                              <ReferenceLine y={activeWD} stroke={isDark ? "#94A4B8" : "#55687F"} strokeWidth={2} strokeOpacity={0.8} ifOverflow="extendDomain" label={{ position: 'insideBottomRight', value: 'Seabed', fill: isDark ? "#94A4B8" : "#55687F", fontSize: 10, fontWeight: 'bold' }} />
                              
                              {structures.map((stX, idx) => (
                                  <ReferenceLine key={`struct-line-${idx}`} x={stX} stroke={isDark ? "#FF5C5C" : "#C42B2B"} strokeDasharray="3 3" strokeOpacity={0.6} label={{ value: `STRUCT ${stX} m · min clr ${statusCtx?.minClearance ?? DEFAULT_MIN_CLEARANCE} m`, angle: -90, position: 'insideTopLeft', fill: isDark ? "#FF5C5C" : "#C42B2B", fontSize: 9, opacity: 0.9, dy: 30 }} />
                              ))}
                          </ScatterChart>
                      </ResponsiveContainer>
                  </div>
              </div>
          );
      };

      // ===== v9: TopViewPanel (all 8 v7 bugs fixed) =====
      // Fixes: B1-B7 documented in deep QC report
      //   B1: Grounded = near anchor (touchdown -> anchor), not near rig
      //   B2: touchdownDist = fairleadX - groundedLen (correct units)
      //   B3: Collision threshold 150m per GMI 7.1.5 (was 30m)
      //   B4: Buoy uses line-length ratio, not fairleadX subtract
      //   B5: Case focus dropdown + no auto-dim
      //   B6: Nice 1/2/5 x 10^n range rings
      //   B7: Tension legend uses actual COLORS palette
      const TopViewPanel = ({ configs, activeConfigId, theme, patternType, anchorBearings, setAnchorBearings, setPattern, statusCtx }) => {
          const activeCfg = configs.find(c => c.id === activeConfigId) || configs[0];
          const results = activeCfg?.results || [];
          const isDark = theme === 'dark';
          const buoysInput = activeCfg?.buoys || [];
          // v11: structures accept an optional bearing + half-sector:
          //   "400" = all-bearing ring (back-compatible) | "400@270" = +/-45 deg | "400@270:30"
          const structures = (activeCfg?.subseaStructuresStr || '')
              .split(',').map(x => x.trim()).filter(Boolean).map(raw => {
                  const [dPart, bPart] = raw.split('@');
                  const dist = parseFloat(dPart);
                  if (isNaN(dist) || dist <= 0) return null;   // C_UI4
                  if (bPart === undefined) return { dist, bearing: null, half: null };
                  const [bStr, wStr] = bPart.split(':');
                  const bearing = parseFloat(bStr);
                  if (isNaN(bearing)) return { dist, bearing: null, half: null };
                  const half = (wStr !== undefined && !isNaN(parseFloat(wStr))) ? Math.abs(parseFloat(wStr)) : 45;
                  return { dist, bearing: ((bearing % 360) + 360) % 360, half };
              }).filter(Boolean);
          const bearingInSector = (lineBearing, st) => {
              if (st.bearing === null) return true;
              const diff = Math.abs(((lineBearing - st.bearing + 540) % 360) - 180);
              return diff <= st.half;
          };
          const template = PATTERN_TEMPLATES[patternType] || PATTERN_TEMPLATES.tender_8pt;
          const nLines = template.length;
          const bearings = (anchorBearings && anchorBearings.length === nLines)
              ? anchorBearings : template.map(t => ({...t}));

          // v13 U20: default focus = Max case (or the heaviest case); 'all' still available.
          const [caseFocusRaw, setCaseFocus] = useState('auto');
          const caseFocus = caseFocusRaw !== 'auto' ? caseFocusRaw
              : (results.some(r => r.isMaxTensionCase) ? 'max' : String(Math.max(0, results.length - 1)));
          const [zoomNear, setZoomNear] = useState(false);   // U22

          // Safe field extractors (worker verified: fairleadX, groundedLength, totalLength, horizontalTension)
          const getFX = (r) => safeFloat(r?.fairleadX, 0);
          const getGL = (r) => safeFloat(r?.groundedLength, 0);
          const getTL = (r) => safeFloat(r?.totalLength, 1);
          const getHT = (r) => safeFloat(r?.horizontalTension, 0);

          const fullRange = Math.max(50, ...results.map(getFX), ...structures.map(s => s.dist));
          const nearRange = Math.max(150, 2 * Math.max(0, ...structures.map(s => s.dist)), 300);
          const maxFairleadX = zoomNear ? Math.min(fullRange, nearRange) : fullRange;
          const chartSize = 440;
          const cx = chartSize / 2;
          const cy = chartSize / 2;
          const padding = 34;   // U18: room for P1/S1 labels
          const scale = (chartSize / 2 - padding) / maxFairleadX;

          const toXY = (bearing, dist) => {
              const rad = (bearing - 90) * Math.PI / 180;
              return { x: cx + dist * scale * Math.cos(rad), y: cy + dist * scale * Math.sin(rad) };
          };

          const updateBearing = (idx, val) => {
              const v = parseFloat(val); if (isNaN(v)) return;
              const next = bearings.map((b, i) => i === idx ? { ...b, bearing: ((v % 360) + 360) % 360 } : b);
              setAnchorBearings(next);
          };

          // B6: nice 1/2/5 x 10^n rings
          const niceStep = (span) => {
              if (!span || span <= 0) return 100;
              const raw = span / 5;
              const pow = Math.pow(10, Math.floor(Math.log10(raw)));
              const norm = raw / pow;
              const mult = norm < 1.5 ? 1 : norm < 3.5 ? 2 : norm < 7.5 ? 5 : 10;
              return mult * pow;
          };
          const ringStep = niceStep(maxFairleadX);
          const rings = [];
          for (let r = ringStep; r <= maxFairleadX * 1.05; r += ringStep) rings.push(r);

          // B5: Filter cases based on focus
          const casesToRender = results.map((r, i) => ({r, i})).filter(({r, i}) => {
              if (caseFocus === 'all') return true;
              if (caseFocus === 'max') return !!r.isMaxTensionCase;
              return i === parseInt(caseFocus);
          });

          // Label case (only most extreme gets anchor names, avoid overlap)
          const labelCase = results.find(r => r.isMaxTensionCase)
              || results[results.length - 1] || null;

          // B3: GMI 7.1.5 = 150m minimum anchor-to-pipeline horizontal
          const GMI_MIN_HORIZONTAL = 150;

          return (
              <div className="flex-1 bg-white dark:bg-gray-850 border border-gray-200 dark:border-gray-800 rounded-xl p-3 relative min-h-[400px] flex flex-col shadow-card overflow-y-auto">
                  <div className="flex flex-wrap items-center gap-3 pb-1">
                      <h3 className="text-gray-700 dark:text-gray-300 text-xs font-semibold flex items-center gap-2">
                          <IconAnchor size={14} className="text-accent-600 dark:text-accent-500"/>
                          Top View (Plan)
                      </h3>
                      <select value={patternType} onChange={e => setPattern(e.target.value)} aria-label="Anchor pattern"
                              className="text-[11px] bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded px-1.5 py-0.5 text-gray-700 dark:text-gray-300 cursor-pointer">
                          <option value="tender_8pt">8-point Tender/AWB</option>
                          <option value="jackup_4pt">4-point Jackup</option>
                      </select>
                      {results.length > 0 && (
                          <select value={caseFocus} onChange={e => setCaseFocus(e.target.value)}
                                  className="text-[11px] bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded px-1.5 py-0.5 text-gray-700 dark:text-gray-300 cursor-pointer">
                              <option value="all">Show all {results.length}</option>
                              {results.some(r => r.isMaxTensionCase) && <option value="max">Max case only</option>}
                              {results.map((r, i) => (
                                  <option key={i} value={String(i)}>
                                      {r.isMaxTensionCase ? `Max (${getHT(r).toFixed(1)}t)` : `${getHT(r).toFixed(1)}t`}
                                  </option>
                              ))}
                          </select>
                      )}
                      <button onClick={() => setZoomNear(z => !z)} className={`text-[11px] font-semibold px-2 py-0.5 rounded border ${zoomNear ? 'bg-accent-600 text-white border-accent-600' : 'border-gray-300 dark:border-gray-700 text-gray-600 dark:text-gray-300'}`} title="Zoom to the near field (structures / rig area)">
                          {zoomNear ? 'Near field' : 'Full extent'}
                      </button>
                  </div>

                  <div className="flex-1 min-h-[320px] flex items-center justify-center overflow-hidden">
                      <svg viewBox={`0 0 ${chartSize} ${chartSize}`} className="w-full h-full" preserveAspectRatio="xMidYMid meet" style={{ overflow: 'hidden' }}>
                          {rings.map((r, i) => (
                              <g key={i}>
                                  <circle cx={cx} cy={cy} r={r * scale} fill="none"
                                          stroke={isDark ? "#26344A" : "#E6EBF1"} strokeWidth={1}
                                          strokeDasharray="3 4" strokeOpacity={0.6}/>
                                  {(() => { const lp = toXY(22.5, r); return (
                                  <text x={lp.x + 3} y={lp.y - 3} fontSize={10}
                                        fill={isDark ? "#94A4B8" : "#55687F"}>{r}m</text>); })()}
                              </g>
                          ))}
                          <line x1={cx} y1={padding/2} x2={cx} y2={chartSize - padding/2}
                                stroke={isDark ? "#3C4C60" : "#BCC8D8"} strokeOpacity={0.5}/>
                          <line x1={padding/2} y1={cy} x2={chartSize - padding/2} y2={cy}
                                stroke={isDark ? "#3C4C60" : "#BCC8D8"} strokeOpacity={0.5}/>
                          <text x={cx} y={padding/2 - 4} textAnchor="middle" fontSize={10}
                                fill={isDark ? "#94A4B8" : "#55687F"} fontWeight="bold">N</text>
                          <text x={chartSize - padding/2 + 8} y={cy + 4} textAnchor="middle" fontSize={10}
                                fill={isDark ? "#94A4B8" : "#55687F"} fontWeight="bold">E</text>
                          <text x={cx} y={chartSize - padding/2 + 12} textAnchor="middle" fontSize={10}
                                fill={isDark ? "#94A4B8" : "#55687F"} fontWeight="bold">S</text>
                          <text x={padding/2 - 8} y={cy + 4} textAnchor="middle" fontSize={10}
                                fill={isDark ? "#94A4B8" : "#55687F"} fontWeight="bold">W</text>

                          {structures.map((st, i) => {
                              const col = isDark ? "#FF5C5C" : "#C42B2B";
                              if (st.bearing === null) {
                                  return (
                                      <g key={`str-${i}`}>
                                          <circle cx={cx} cy={cy} r={st.dist * scale} fill="none" stroke={col}
                                                  strokeWidth={2} strokeDasharray="6 6" strokeOpacity={0.55}/>
                                          {(() => { const lp = toXY(202.5, st.dist); return (
                                          <text x={lp.x - 4} y={lp.y + 12} textAnchor="end" fontSize={10} fill={col} fontWeight="bold">
                                              Struct {st.dist} m (all bearings)
                                          </text>); })()}
                                      </g>
                                  );
                              }
                              const p1 = toXY(st.bearing - st.half, st.dist);
                              const p2 = toXY(st.bearing + st.half, st.dist);
                              const mid = toXY(st.bearing, st.dist);
                              const rr = st.dist * scale;
                              const largeArc = (st.half * 2) > 180 ? 1 : 0;
                              return (
                                  <g key={`str-${i}`}>
                                      <path d={`M ${p1.x} ${p1.y} A ${rr} ${rr} 0 ${largeArc} 1 ${p2.x} ${p2.y}`}
                                            fill="none" stroke={col} strokeWidth={3} strokeDasharray="6 6" strokeOpacity={0.7}/>
                                      <text x={mid.x} y={mid.y - 6} textAnchor="middle" fontSize={10} fill={col} fontWeight="bold">
                                          Pipeline @ {st.dist}m ({st.bearing}°±{st.half}°)
                                      </text>
                                  </g>
                              );
                          })}

                          {casesToRender.map(({r: res, i: resIdx}) => {
                              const color = res.isMaxTensionCase ? maxCaseColor(isDark) : seriesColor(resIdx, isDark);
                              const isLabelCase = res === labelCase;
                              const fairleadX = getFX(res);
                              const groundedLen = getGL(res);
                              // B1/B2: touchdown = where line leaves the seabed (near anchor side)
                              // horizontal touchdown from center = fairleadX - groundedLen
                              const touchdownDist = Math.max(0, fairleadX - groundedLen);

                              return bearings.map((b, li) => {
                                  const anchor = toXY(b.bearing, fairleadX);
                                  const touch = toXY(b.bearing, touchdownDist);
                                  // v11: TWO distinct checks. The old test only asked whether the ANCHOR was within
                                  // 150 m of the pipeline radius, so a line whose anchor sits at 900 m with a pipeline
                                  // at 400 m physically CROSSES it and was never flagged at all.
                                  const onThisLine = structures.filter(st => bearingInSector(b.bearing, st));
                                  const crossesPipeline = onThisLine.some(st => st.dist > 0 && st.dist < fairleadX);
                                  const anchorTooClose = onThisLine.some(st => Math.abs(fairleadX - st.dist) < GMI_MIN_HORIZONTAL);
                                  const crossingPoints = onThisLine.filter(st => st.dist > 0 && st.dist < fairleadX).map(st => ({ ...toXY(b.bearing, st.dist), sector: st.bearing !== null, grounded: (st.dist >= touchdownDist && groundedLen > 0.5) || contactsOf(res).some(cc => st.dist >= cc.near && st.dist <= cc.far) }));

                                  return (
                                      <g key={`ln-${resIdx}-${li}`}>
                                          {/* B1: Suspended = center to touchdown (solid) */}
                                          <line x1={cx} y1={cy} x2={touch.x} y2={touch.y}
                                                stroke={color} strokeWidth={1.8} strokeOpacity={0.9}/>
                                          {/* B1: Grounded = touchdown to anchor (dashed thick, near anchor) */}
                                          {groundedLen > 0.5 && (
                                              <line x1={touch.x} y1={touch.y} x2={anchor.x} y2={anchor.y}
                                                    stroke={color} strokeWidth={3.2} strokeDasharray="6 4"
                                                    strokeOpacity={0.8}/>
                                          )}
                                          {groundedLen > 0.5 && (
                                              <circle cx={touch.x} cy={touch.y} r={2.5} fill={color} opacity={0.9}/>
                                          )}
                                          {contactsOf(res).map((cc, ci) => {
                                              const a = toXY(b.bearing, Math.max(0, cc.far));
                                              const c = toXY(b.bearing, Math.max(0, cc.near));
                                              return <line key={`ct-${ci}`} x1={a.x} y1={a.y} x2={c.x} y2={c.y} stroke={color} strokeWidth={3.2} strokeDasharray="6 4" strokeOpacity={0.8}/>;
                                          })}
                                          {/* v11: was a linear arc-length ratio - wrong for a catenary. Read the buoy's
                                              actual profile point and use its real horizontal position instead. */}
                                          {isLabelCase && buoysInput.map((bo, bIdx) => {
                                              const distAnchor = safeFloat(bo.distanceFromAnchor, 0);
                                              const totLen = getTL(res);
                                              if (totLen <= 0) return null;
                                              const buoyPts = (res.points || []).filter(pp => pp.isBuoy);
                                              let bp = buoyPts.find(pp => pp.buoyIndex === bIdx)
                                                    || buoyPts.find(pp => Math.abs(safeFloat(pp.s, NaN) - distAnchor) < Math.max(1, distAnchor * 0.02));
                                              if (!bp) bp = buoyPts[bIdx];
                                              const buoyHoriz = bp ? Math.max(0, fairleadX - safeFloat(bp.x, 0))
                                                                   : fairleadX * ((totLen - distAnchor) / totLen);
                                              if (!isFinite(buoyHoriz)) return null;
                                              const bxy = toXY(b.bearing, buoyHoriz);
                                              return (
                                                  <circle key={`by-${bIdx}`} cx={bxy.x} cy={bxy.y}
                                                          r={5} fill={bp ? BUOY_FILL[isDark ? 'dark' : 'light'][buoyLevel(bp.buoyUtilization || 0, bp.isSlack)] : '#F5A524'} stroke={isDark ? '#EAEFF4' : '#26344A'}
                                                          strokeWidth={1.2} opacity={0.9}/>
                                              );
                                          })}
                                          <rect x={anchor.x - 6} y={anchor.y - 6} width={12} height={12}
                                                fill={color} stroke={isDark ? '#EAEFF4' : '#26344A'} strokeWidth={1}/>
                                          {isLabelCase && (
                                              <text x={anchor.x} y={anchor.y - 10} textAnchor="middle"
                                                    fontSize={11} fill={color} fontWeight="bold">
                                                  {b.name}
                                              </text>
                                          )}
                                          {isLabelCase && anchorTooClose && (
                                              <>
                                                  <circle cx={anchor.x} cy={anchor.y} r={12} fill="none" stroke="#FF5C5C" strokeWidth={2} strokeDasharray="3 2"/>
                                                  <circle cx={anchor.x} cy={anchor.y} r={16} fill="none" stroke="#FF5C5C" strokeWidth={1} strokeOpacity={0.5}/>
                                              </>
                                          )}
                                          {isLabelCase && crossingPoints.map((pt, ci) => (
                                              <g key={`cross-${resIdx}-${li}-${ci}`}>
                                                  <circle cx={pt.x} cy={pt.y} r={4} fill="#FF5C5C" stroke={isDark ? '#EAEFF4' : '#26344A'} strokeWidth={1.5}/>
                                                  {pt.sector && <text x={pt.x} y={pt.y - 9} textAnchor="middle" fontSize={10} fill="#FF5C5C" fontWeight="bold">{pt.grounded ? 'ON SEABED' : 'CROSSES'}</text>}
                                                  {pt.grounded && <rect x={pt.x - 6} y={pt.y - 6} width={12} height={12} fill="none" stroke="#FF5C5C" strokeWidth={2}/>}
                                              </g>
                                          ))}
                                      </g>
                                  );
                              });
                          }).flat()}

                          <rect x={cx - 20} y={cy - 12} width={40} height={24} rx={2}
                                fill="#F5A524" stroke="#3C2500" strokeWidth={2}/>
                          <text x={cx} y={cy + 4} textAnchor="middle" fontSize={10}
                                fill="#3C2500" fontWeight="900">RIG</text>
                      </svg>
                  </div>

                  {/* B7: Tension legend with actual COLORS palette */}
                  {results.length > 0 && (
                      <div className="border-t border-gray-200 dark:border-gray-700 pt-2 mt-2">
                          <div className="flex items-center gap-3 flex-wrap">
                              <span className="text-[11px] font-bold uppercase text-gray-500 dark:text-gray-400 tracking-wider">Cases:</span>
                              {results.map((r, i) => {
                                  const color = r.isMaxTensionCase ? maxCaseColor(isDark) : seriesColor(i, isDark);
                                  const active = caseFocus === 'all'
                                      || (caseFocus === 'max' && r.isMaxTensionCase)
                                      || caseFocus === String(i);
                                  return (
                                      <div key={i} className={`flex items-center gap-1.5 text-[11px] ${active ? '' : 'opacity-40'}`}>
                                          <div className="w-6 h-0.5" style={{backgroundColor: color}}></div>
                                          <span className="font-mono" style={{color}}>
                                              {r.isMaxTensionCase ? `Max ${getHT(r).toFixed(1)}t` : `${getHT(r).toFixed(1)}t`}
                                          </span>
                                      </div>
                                  );
                              })}
                          </div>
                      </div>
                  )}

                  <div className="border-t border-gray-200 dark:border-gray-700 pt-2 mt-2">
                      <div className="flex justify-between items-center mb-1.5">
                          <span className="text-[11px] font-bold uppercase text-gray-500 dark:text-gray-400 tracking-wider">
                              Anchor Bearings ({nLines} lines)
                          </span>
                          <button onClick={() => setAnchorBearings(template.map(t => ({...t})))}
                                  className="text-[11px] font-bold text-accent-600 dark:text-accent-400 hover:underline">
                              Reset to default
                          </button>
                      </div>
                      <div className="grid grid-cols-4 gap-1.5 text-[11px]">
                          {bearings.map((b, i) => (
                              <div key={i} className="flex items-center gap-1 bg-gray-100 dark:bg-gray-800 rounded px-1.5 py-1">
                                  <span className="font-bold text-accent-600 dark:text-accent-400 w-8">{b.name}</span>
                                  <input type="number" value={b.bearing}
                                         onChange={e => updateBearing(i, e.target.value)}
                                         min="0" max="359" step="5"
                                         className="w-14 bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded px-1 py-0.5 text-[11px] font-mono focus:outline-none focus:border-accent-500"/>
                                  <span className="text-gray-500">°</span>
                              </div>
                          ))}
                      </div>
                  </div>

                  {labelCase && structures.length > 0 && (() => {
                      const fx = getFX(labelCase);
                      const rows = [];
                      bearings.forEach(b => structures.filter(st => bearingInSector(b.bearing, st)).forEach(st => {
                          const crosses = st.dist < fx;
                          const clr = crosses ? clearanceAt(labelCase, st.dist, statusCtx?.waterDepth ?? 0) : null;
                          const tooClose = Math.abs(fx - st.dist) < GMI_MIN_HORIZONTAL;
                          const minC = statusCtx?.minClearance ?? DEFAULT_MIN_CLEARANCE;
                          const grounded = crosses && clr !== null && clr <= 0.05;
                          const level = grounded || (crosses && clr !== null && clr < minC) || tooClose ? 'bad' : crosses ? 'warn' : 'ok';
                          const label = grounded ? 'GROUNDED ON STRUCT' : (crosses && clr < minC) ? 'LOW CLEARANCE' : tooClose ? 'ANCHOR < GMI' : crosses ? 'SUSPENDED CROSSING' : 'OK';
                          rows.push({ line: b.name, dist: st.dist, crosses, clr, tooClose, level, label });
                      }));
                      if (!rows.length) return null;
                      return (
                          <div className="border-t border-gray-200 dark:border-gray-700 pt-2 mt-2">
                              <div className="text-[11px] font-bold uppercase text-gray-500 dark:text-gray-400 tracking-wider mb-1">
                                  Structure check · {labelCase.isMaxTensionCase ? 'Max' : getHT(labelCase).toFixed(1) + ' t'} case · min clr {statusCtx?.minClearance ?? DEFAULT_MIN_CLEARANCE} m · GMI {GMI_MIN_HORIZONTAL} m
                              </div>
                              <table className="w-full text-[11px] tabular-nums">
                                  <thead className="text-gray-500 dark:text-gray-400"><tr><th className="text-left font-semibold py-0.5">Line</th><th className="text-left font-semibold">Structure @</th><th className="text-left font-semibold">Crosses</th><th className="text-left font-semibold">Clearance</th><th className="text-left font-semibold">Anchor ↔ struct</th><th className="text-left font-semibold">Status</th></tr></thead>
                                  <tbody>{rows.map((r, i) => (
                                      <tr key={i} className="border-t border-gray-100 dark:border-gray-800">
                                          <td className="py-0.5 font-bold">{r.line}</td><td>{r.dist} m</td><td>{r.crosses ? 'Yes' : 'No'}</td>
                                          <td>{r.clr === null ? '-' : `${Math.max(0, r.clr).toFixed(1)} m`}</td>
                                          <td>{Math.abs(fx - r.dist).toFixed(0)} m</td>
                                          <td><span className={`px-1.5 rounded-full font-bold ${PILL_CLS[r.level]}`}>{r.label}</span></td>
                                      </tr>))}</tbody>
                              </table>
                          </div>
                      );
                  })()}

                  <div className="flex gap-3 text-[11px] flex-wrap border-t border-gray-200 dark:border-gray-700 pt-2 mt-2">
                      <div className="flex items-center gap-1"><div className="w-3 h-3 bg-amber-500 border border-amber-900"></div><span className="text-gray-600 dark:text-gray-400">Rig</span></div>
                      <div className="flex items-center gap-1"><div className="w-6 h-0.5 bg-gray-500"></div><span className="text-gray-600 dark:text-gray-400">Suspended</span></div>
                      <div className="flex items-center gap-1"><div className="w-6 h-1 border-b-2 border-dashed border-gray-500"></div><span className="text-gray-600 dark:text-gray-400">Grounded (near anchor)</span></div>
                      <div className="flex items-center gap-1"><div className="w-3 h-3 rounded-full bg-ok-600 dark:bg-ok-400"></div><span className="text-gray-600 dark:text-gray-400">MLB (colour = util)</span></div>
                      <div className="flex items-center gap-1"><div className="w-3 h-3 rounded-full border-2 border-dashed border-red-500"></div><span className="text-red-600 dark:text-red-400 font-bold">GMI &lt;150m</span></div>
                  </div>
              </div>
          );
      };

      // v13 ResultsTable: SWL util (A7), real Anch V (A5), multi-pill status (A8), buoy pills by configured
      // number with shared thresholds (A1/A9), touchdown column, auto height, stale dimming (A10).
      const ResultsTable = ({ results, buoys, segments, theme, statusCtx, isStale }) => {
          const isDarkTbl = theme === 'dark';
          const { minMBL, minIdx, hasMBL, missing, df } = statusCtx;
          const swl = hasMBL ? minMBL / df : NaN;
          const totalLen = results[0]?.totalLength;
          const cols = 11;
          return (
              <div className={`max-h-[36vh] min-h-[160px] bg-white dark:bg-gray-850 border border-gray-200 dark:border-gray-800 rounded-xl overflow-hidden flex flex-col shadow-card shrink-0 transition-opacity ${isStale ? 'opacity-60' : ''}`}>
                  <div className="px-4 py-2.5 border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900/60 flex flex-wrap gap-x-4 gap-y-1 justify-between items-center">
                      <h3 className="font-semibold text-gray-700 dark:text-gray-200 text-sm flex items-center gap-2"><IconInfo size={16} className="text-accent-600 dark:text-accent-500"/> Calculation Results</h3>
                      <div className="text-[11px] text-gray-600 dark:text-gray-400 flex flex-wrap gap-x-3">
                          {totalLen !== undefined && <span>Payout <b className="font-mono">{totalLen.toFixed(1)} m</b></span>}
                          {hasMBL && <span>SWL <b className="font-mono">{swl.toFixed(1)} t</b> (seg #{minIdx + 1} MBL {minMBL} t / DF {df})</span>}
                          {missing.length > 0 && <span className="text-warn-600 dark:text-warn-400 font-semibold">No MBL on seg #{missing.join(', #')} - not checked</span>}
                          {isStale && <span className="text-warn-600 dark:text-warn-400 font-semibold">Inputs changed - results outdated</span>}
                      </div>
                  </div>
                  <div className="overflow-auto flex-1">
                      <table className="w-full min-w-[1120px] text-left text-sm text-gray-700 dark:text-gray-300 tabular-nums">
                          <thead className="bg-gray-100 dark:bg-gray-900 text-[11px] uppercase font-semibold text-gray-600 dark:text-gray-400 tracking-[0.06em] sticky top-0 z-10">
                              <tr>
                                  <th className="px-3 py-2.5">Case (t)</th>
                                  <th className="px-3 py-2.5" title="Horizontal distance fairlead → anchor">Offset (m)</th>
                                  <th className="px-3 py-2.5" title="Anchor-side grounded length (+ intermediate contact length when the line touches down twice)">Grounded (m)</th>
                                  <th className="px-3 py-2.5" title="Horizontal distance from the fairlead to the nearest seabed touchdown (2nd contact when the line touches down twice)">Touchdown (m)</th>
                                  <th className="px-3 py-2.5">Anch H (t)</th>
                                  <th className="px-3 py-2.5">Anch V (t)</th>
                                  <th className="px-3 py-2.5" title="Resultant anchor tension sqrt(H^2+V^2)">Anch Res (t)</th>
                                  <th className="px-3 py-2.5">FL Ten (t)</th>
                                  <th className="px-3 py-2.5" title="FL tension / SWL. 100% = at SWL">SWL Util</th>
                                  <th className="px-3 py-2.5" title="Submerged fraction of each buoy (Worker v4.1). <50% ok · 50-85% warn · ≥85% high · 100% fully submerged">Buoys (sub.)</th>
                                  <th className="px-3 py-2.5">Status</th>
                              </tr>
                          </thead>
                          <tbody className="divide-y divide-gray-200 dark:divide-gray-800">
                              {results.map((res, idx) => {
                                  const flags = getStatusFlags(res, statusCtx);
                                  const invalid = isInvalidCase(flags);
                                  const util = hasMBL ? (res.fairleadTension / swl) * 100 : null;
                                  const utilCls = util === null ? '' : util >= 100 ? 'text-bad-600 dark:text-bad-400 font-bold' : util >= 80 ? 'text-warn-600 dark:text-warn-400 font-bold' : '';
                                  const td = res.touchdownX !== undefined ? res.fairleadX - res.touchdownX : res.fairleadX - res.groundedLength;
                                  const caseColor = res.isMaxTensionCase ? maxCaseColor(isDarkTbl) : seriesColor(idx, isDarkTbl);
                                  return (
                                      <tr key={idx} className={`hover:bg-gray-50 dark:hover:bg-white/5 ${res.isMaxTensionCase ? 'bg-maxc-600/5 dark:bg-maxc-400/5' : ''} ${invalid ? 'opacity-60' : ''}`}>
                                          <td className="px-3 py-2 font-mono font-semibold whitespace-nowrap" style={{ color: caseColor }}>
                                              <span className="inline-block w-2.5 h-2.5 rounded-full mr-1.5 align-middle" style={{ backgroundColor: caseColor }}></span>
                                              {res.horizontalTension?.toFixed(1)}{res.isMaxTensionCase ? ' (Max)' : ''}
                                          </td>
                                          <td className="px-3 py-2 font-mono">{res.fairleadX?.toFixed(1)}</td>
                                          <td className="px-3 py-2 font-mono">{res.groundedLength?.toFixed(1)}{res.multiTouchdown && <span className="text-[11px] text-accent-700 dark:text-accent-400" title="Second (intermediate) seabed contact length"> +{res.contact2Length.toFixed(1)}</span>}</td>
                                          <td className="px-3 py-2 font-mono">
                                              {/* v13.4 MT-4: with a 2nd contact, the touchdown nearest the vessel is the FL end of that stretch */}
                                              {res.multiTouchdown
                                                  ? <span title={`Nearest to FL (mid-line contact). Anchor-side touchdown: ${isFinite(td) && res.groundedLength > 0.05 ? td.toFixed(1) + ' m' : 'none (anchor lifted)'}`}>{contactsOf(res)[0].near.toFixed(1)}<span className="text-[11px] text-accent-700 dark:text-accent-400"> (mid)</span></span>
                                                  : (isFinite(td) && res.groundedLength > 0.05 ? td.toFixed(1) : '-')}
                                          </td>
                                          <td className="px-3 py-2 font-mono">{res.anchorTension?.toFixed(2)}</td>
                                          <td className={`px-3 py-2 font-mono ${res.isAnchorUplift ? 'text-bad-600 dark:text-bad-400 font-bold' : (res.anchorUpliftForce || 0) > 0.005 ? 'text-warn-600 dark:text-warn-400' : ''}`}>
                                              {(res.anchorUpliftForce || 0).toFixed(2)}
                                          </td>
                                          <td className="px-3 py-2 font-mono">{(res.anchorResultantTension ?? Math.sqrt((res.anchorTension || 0) ** 2 + (res.anchorUpliftForce || 0) ** 2)).toFixed(2)}</td>
                                          <td className="px-3 py-2 font-mono font-medium">{res.fairleadTension?.toFixed(1)}</td>
                                          <td className={`px-3 py-2 font-mono ${utilCls}`}>{util === null ? '-' : `${util.toFixed(0)}%`}</td>
                                          <td className="px-3 py-2 text-xs">
                                              {buoyPoints(res).length > 0 ? (
                                                  <div className="flex flex-wrap gap-1">
                                                      {buoyPoints(res)
                                                          .map((b, i) => ({ b, no: getBuoyDisplayNumber(b, buoys || [], i) }))
                                                          .sort((x, y) => x.no - y.no)
                                                          .map(({ b, no }) => {
                                                              const u = (b.buoyUtilization || 0) * 100;
                                                              const lvl = buoyLevel(b.buoyUtilization || 0, b.isSlack);
                                                              const cls = lvl === 'slack' ? 'bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-400'
                                                                        : lvl === 'ok' ? PILL_CLS.ok : lvl === 'warn' ? PILL_CLS.warn : PILL_CLS.bad;
                                                              return <span key={no} className={`px-1.5 py-0.5 rounded font-mono font-semibold whitespace-nowrap ${cls}`} title={b.inGroundedZone ? 'On grounded zone' : undefined}>
                                                                  B{no} {lvl === 'slack' ? 'SLACK' : lvl === 'sub' ? 'SUB' : `${u.toFixed(0)}%`}{b.inGroundedZone ? ' ⚠' : ''}
                                                              </span>;
                                                          })}
                                                  </div>
                                              ) : <span className="text-gray-400">-</span>}
                                          </td>
                                          <td className="px-3 py-2 text-xs">
                                              <div className="flex flex-wrap gap-1">
                                                  {flags.length === 0
                                                      ? <span className={`px-2 py-0.5 rounded-full text-[11px] font-bold ${PILL_CLS.ok}`}>OK</span>
                                                      : flags.map((f, i) => <span key={i} title={f.tip} className={`px-2 py-0.5 rounded-full text-[11px] font-bold whitespace-nowrap ${PILL_CLS[f.level]}`}>{f.text}</span>)}
                                              </div>
                                          </td>
                                      </tr>
                                  );
                              })}
                              {results.length === 0 && (<tr><td colSpan={cols} className="px-4 py-10 text-center text-gray-500 dark:text-gray-400">No results yet - set targets and press Calculate (Ctrl+Enter).</td></tr>)}
                          </tbody>
                      </table>
                  </div>
              </div>
          );
      };

      const createDefaultConfig = (id) => ({
          id: id,
          projectName: `Mooring_Line_${id}`,
          waterDepth: 73,
          fairleadElev: "3",
          subseaStructuresStr: "",
          segments: [
              makeSegment(SegmentType.WIRE, 38, 700, { id: `seg-wire-${id}-1` }),
              makeSegment(SegmentType.CHAIN, 38, 55, { id: `seg-chain-${id}-2` })
          ],
          buoys: [
              { id: `buoy-${id}-1`, distanceFromAnchor: 500, netBuoyancy: 5, pennantLength: 30, pennantDiameter: DEFAULT_PENNANT_DIA,
                pennantWeight: pennantWeightT(30, DEFAULT_PENNANT_DIA), height: 2.0, pennantLoad: 0.05, isPennantWeightManual: false }
          ],
          tensionsStr: "5, 20, 40",
          calcMode: 'tension',
          showMaxTension: false,
          patternType: 'tender_8pt',
          anchorBearings: PATTERN_TEMPLATES.tender_8pt.map(a => ({...a})),
          designFactor: DEFAULT_DF,
          minClearance: DEFAULT_MIN_CLEARANCE,
          presetKey: '',
          results: [],
          resultsSig: null,
          calcWaterDepth: null
      });

      const App = () => {
          const [theme, setTheme] = useState(() => {
              try { const t = localStorage.getItem('slack_theme'); if (t) return t; } catch(e) {}
              return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          });
          const [showGuide, setShowGuide] = useState(false);
          const [sidebarOpen, setSidebarOpen] = useState(false);
          const [configs, setConfigs] = useState([createDefaultConfig(1)]);
          const [activeTabId, setActiveTabId] = useState(1);
          const [calcError, setCalcError] = useState(null);
          const [loading, setLoading] = useState(false);


          // v10 M5: toast notification queue
          const [toasts, setToasts] = useState([]);
          const pushToast = (type, message, duration = 3000) => {
              const id = Date.now() + Math.random();
              setToasts(prev => [...prev, { id, type, message }]);
              if (duration > 0) setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), duration);
          };
          const removeToast = (id) => setToasts(prev => prev.filter(t => t.id !== id));

          // v10 M7: confirm dialog state
          const [confirmState, setConfirmState] = useState({ open: false });
          const openConfirm = (opts) => setConfirmState({ open: true, ...opts });
          const closeConfirm = () => setConfirmState({ open: false });

          // v10 M5: prompt dialog state
          const [promptState, setPromptState] = useState({ open: false });
          const openPrompt = (opts) => setPromptState({ open: true, ...opts });
          const closePrompt = () => setPromptState({ open: false });

          const activeConfig = configs.find(c => c.id === activeTabId) || configs[0];

          const updateConfig = (updates) => {
              setConfigs(prev => prev.map(c => c.id === activeTabId ? { ...c, ...updates } : c));
          };
          // Async results must land on the tab that STARTED the calc, not whichever is active now.
          const updateConfigById = (id, updates) => setConfigs(prev => prev.map(c => c.id === id ? { ...c, ...updates } : c));

          // v10 M6: batched update alias (semantic name for preset load / bulk changes)
          const bulkUpdateConfig = (updates) => {
              setConfigs(prev => prev.map(c => c.id === activeTabId ? { ...c, ...updates } : c));
          };

          const projectName = activeConfig.projectName;
          const waterDepth = activeConfig.waterDepth;
          const fairleadElev = activeConfig.fairleadElev;
          const subseaStructuresStr = activeConfig.subseaStructuresStr;
          const segments = activeConfig.segments;
          const buoys = activeConfig.buoys;
          const tensionsStr = activeConfig.tensionsStr;
          const calcMode = activeConfig.calcMode;
          const showMaxTension = activeConfig.showMaxTension;
          const results = activeConfig.results;

          const setProjectName = (val) => updateConfig({ projectName: val });
          const setWaterDepth = (val) => updateConfig({ waterDepth: val });
          const setFairleadElev = (val) => updateConfig({ fairleadElev: val });
          const setSubseaStructuresStr = (val) => updateConfig({ subseaStructuresStr: val });
          const setSegments = (val) => updateConfig({ segments: val });
          const setBuoys = (val) => updateConfig({ buoys: val });
          const setTensionsStr = (val) => updateConfig({ tensionsStr: val });
          const setCalcMode = (val) => updateConfig({ calcMode: val });
          const setShowMaxTension = (val) => updateConfig({ showMaxTension: val });
          const patternType = activeConfig.patternType || 'tender_8pt';
          const setPatternType = (val) => updateConfig({ patternType: val });
          const designFactor = activeConfig.designFactor ?? DEFAULT_DF;
          const minClearance = activeConfig.minClearance ?? DEFAULT_MIN_CLEARANCE;
          const setMinClearance = (val) => updateConfig({ minClearance: val });
          const activePresetKey = activeConfig.presetKey || '';
          const setDesignFactor = (val) => updateConfig({ designFactor: val });
          const anchorBearings = activeConfig.anchorBearings || PATTERN_TEMPLATES.tender_8pt.map(a => ({...a}));
          const setAnchorBearings = (val) => updateConfig({ anchorBearings: val });
          const [activeView, setActiveView] = useState('profile');
          const setResults = (val) => updateConfig({ results: val });

          const fileInputRef = useRef(null);

          useEffect(() => {
              if (theme === 'dark') document.documentElement.classList.add('dark');
              else document.documentElement.classList.remove('dark');
          }, [theme]);

          const toggleTheme = () => setTheme(prev => { const t = prev === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('slack_theme', t); } catch(e) {} return t; });

          // v10 M4: export includes anchor pattern + bearings + results (optional)
          const exportToJson = () => {
              const data = {
                  projectName, waterDepth, fairleadElev, subseaStructuresStr,
                  segments, buoys, tensionsStr, calcMode, showMaxTension,
                  // v10 NEW fields
                  patternType: activeConfig.patternType || 'tender_8pt',
                  anchorBearings: activeConfig.anchorBearings || [],
                  results: activeConfig.results || [],
                  designFactor, minClearance,
                  presetKey: activePresetKey || null,
                  resultsSig: activeConfig.resultsSig || null,
                  calcWaterDepth: activeConfig.calcWaterDepth ?? null,
                  version: "1.3",
                  timestamp: new Date().toISOString()
              };
              const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = url;
              link.download = `${projectName.replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.json`;
              link.click();
              URL.revokeObjectURL(url);
              pushToast('success', `Exported ${projectName}.json`);
          };

          // v11: CSV export of the active tab's results, for rig-move reporting.
          const exportToCsv = () => {
              const res = activeConfig.results || [];
              if (res.length === 0) { pushToast('warning', 'No results to export - run Calculate first.'); return; }
              const num = (v, d = 2) => (typeof v === 'number' && isFinite(v)) ? v.toFixed(d) : '';
              const header = ['Case(t)','TotalLen(m)','Offset(m)','Grounded(m)','TouchdownFromFL(m)','AnchH(t)','AnchV(t)',
                  'AnchResultant(t)','FLTen(t)','SWLUtil(%)','Buoys(sub%/state)','Contact2Len(m)','Contact2FromFL(m)','Converged','Residual(m)','Solver','Status'];
              const swl = statusCtx.hasMBL ? statusCtx.minMBL / statusCtx.df : NaN;
              const rows = res.map(r => {
                  const flags = getStatusFlags(r, statusCtx);
                  return [
                      r.isMaxTensionCase ? `${num(r.horizontalTension,1)} (Max)` : num(r.horizontalTension,1),
                      num(r.totalLength,1), num(r.fairleadX,1), num(r.groundedLength,1),
                      r.multiTouchdown ? num(contactsOf(r)[0].near,1) : (r.touchdownX !== undefined && r.groundedLength > 0.05 ? num(r.fairleadX - r.touchdownX,1) : ''),
                      num(r.anchorTension), num(r.anchorUpliftForce),
                      num(r.anchorResultantTension ?? Math.sqrt((r.anchorTension||0)**2 + (r.anchorUpliftForce||0)**2)),
                      num(r.fairleadTension,1), isFinite(swl) ? num(r.fairleadTension / swl * 100, 0) : '',
                      buoyPoints(r).map((b, i) => `B${getBuoyDisplayNumber(b, buoys, i)}:${buoyLevel(b.buoyUtilization || 0, b.isSlack) === 'slack' ? 'SLACK' : ((b.buoyUtilization || 0) * 100).toFixed(0) + '%'}${b.pennantTension !== undefined ? '/' + b.pennantTension.toFixed(2) + 't' : ''}`).join(' '),
                      r.multiTouchdown ? num(r.contact2Length,1) : '',
                      r.multiTouchdown ? contactsOf(r).map(c => `${num(c.near,0)}-${num(c.far,0)}`).join(' ') : '',
                      r.converged === undefined ? '' : r.converged, num(r.residual,3), r.solver || '',
                      flags.length ? flags.map(f => f.code).join('|') : 'OK'
                  ];
              });
              const totalLen = segments.reduce((a, s) => a + (parseFloat(s.length) || 0), 0);
              const meta = [['# Project', projectName], ['# WaterDepth(m)', activeConfig.calcWaterDepth ?? waterDepth],
                  ['# FairleadElev(m)', fairleadElev], ['# Payout(m)', totalLen.toFixed(1)],
                  ['# DesignFactor', designFactor], ['# SWL(t)', isFinite(swl) ? swl.toFixed(1) : 'n/a'],
                  ['# MinClearance(m)', minClearance], ['# Material model', 'Generic (OrcaFlex wizard fits) unless manual'],
                  ['# Exported', new Date().toISOString()]];
              const csv = [...meta, header, ...rows].map(r => r.map(csvCell).join(',')).join('\n');
              const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = url;
              link.download = `${projectName.replace(/[^\w.-]+/g, '_')}_results_${new Date().toISOString().split('T')[0]}.csv`;
              link.click();
              URL.revokeObjectURL(url);
              pushToast('success', `Exported ${res.length} rows to CSV`);
          };

          const handleImport = (e) => {
              const file = e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = (event) => {
                  try {
                      const data = JSON.parse(event.target.result);
                      if (!data || typeof data !== 'object' || !Array.isArray(data.segments) || data.waterDepth === undefined) {
                          throw new Error('Not a SLACK setup file (segments / waterDepth missing)');
                      }
                      const updates = {};
                      if (data.projectName !== undefined) updates.projectName = data.projectName;
                      if (data.waterDepth !== undefined) updates.waterDepth = data.waterDepth;
                      if (data.fairleadElev !== undefined) updates.fairleadElev = data.fairleadElev;
                      if (data.subseaStructuresStr !== undefined) updates.subseaStructuresStr = data.subseaStructuresStr;
                      
                      if (data.segments !== undefined) {
                          updates.segments = Array.isArray(data.segments) 
                              ? data.segments.map(s => deriveSegment({ ...s, id: makeClientId('seg'),
                                    // v12 files have no manual flags for w: treat a provided value as manual so cert data survives
                                    isWeightManual: s.isWeightManual ?? (parseFloat(s.w) > 0),
                                    isEAManual: s.isEAManual ?? (parseFloat(s.EA) > 0),
                                    isMBLManual: s.isMBLManual ?? (parseFloat(s.mbl) > 0) }))
                              : [];
                      }
                      if (data.buoys !== undefined) {
                          updates.buoys = Array.isArray(data.buoys) 
                              ? data.buoys.map(b => ({ ...b, id: makeClientId('buoy'), isPennantWeightManual: b.isPennantWeightManual ?? true }))
                              : [];
                      }
                      
                      if (data.tensionsStr !== undefined) updates.tensionsStr = data.tensionsStr;
                      if (data.calcMode !== undefined) updates.calcMode = data.calcMode;
                      if (data.showMaxTension !== undefined) updates.showMaxTension = data.showMaxTension;
                      
                      // v10 M4: import new fields (patternType, anchorBearings)
                      if (data.patternType !== undefined) updates.patternType = data.patternType;
                      if (data.anchorBearings !== undefined) updates.anchorBearings = data.anchorBearings;
                      // v10 M3: restore results if present -> skip auto-calc (save API quota)
                      const hasResults = Array.isArray(data.results) && data.results.length > 0;
                      if (hasResults) updates.results = data.results;
                      updates.presetKey = data.presetKey || data.activePresetKey || '';
                      if (data.designFactor !== undefined) updates.designFactor = data.designFactor;
                      if (data.minClearance !== undefined) updates.minClearance = data.minClearance;
                      updates.results = hasResults ? data.results : [];
                      updates.resultsSig = hasResults ? (data.resultsSig || '__imported__') : null;
                      updates.calcWaterDepth = hasResults ? (data.calcWaterDepth ?? data.waterDepth) : null;
                      updateConfig(updates);
                      pushToast(hasResults ? 'success' : 'info', hasResults
                          ? `Imported "${data.projectName || 'setup'}" with ${data.results.length} cached results`
                          : `Imported "${data.projectName || 'setup'}" - press Calculate`);
                  } catch (err) {
                      pushToast('error', 'Invalid JSON configuration file: ' + err.message, 5000);
                  } finally {
                      if (fileInputRef.current) fileInputRef.current.value = '';
                  }
              };
              reader.readAsText(file);
          };

          // v10 M1: handleCalculate with retry, timeout, and classified error state
          const handleCalculate = async (isRetry = false, force = false, overrides = {}) => {
              setCalcError(null);
              const tabId = activeConfig.id;
              // v13.1 B18: merge not-yet-debounced input buffers so the engine never sees stale values
              const cfg = { ...activeConfig, ...overrides };
              if (Object.keys(overrides).length) updateConfigById(tabId, overrides);
              const { waterDepth, fairleadElev, segments, buoys, tensionsStr, calcMode, showMaxTension } = cfg;
              const sig = solverSig(cfg);
              if (!force && cfg.resultsSig === sig && (cfg.results || []).length > 0) {
                  pushToast('info', 'Inputs unchanged - showing cached results (no engine call). Shift+Click to force.');
                  return;
              }
              const inputs = tensionsStr.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n) && n > 0).sort((a, b) => a - b);
              // v10: de-duplicate targets (B3 fix from deep review)
              const dedupInputs = inputs.filter((v, i, arr) => arr.indexOf(v) === i);
              if (dedupInputs.length === 0 && !showMaxTension) return;
              setLoading(true);
              const flZ = -1 * (parseFloat(fairleadElev) || 0);
              const processedSegments = segments.map(seg => ({
                  ...seg,
                  length: parseFloat(seg.length) || 0,   // v10: normalize types
                  EA: (seg.EA && parseFloat(seg.EA) > 0) ? parseFloat(seg.EA) : 1e9
              }));
              const payload = {
                  waterDepth: parseFloat(waterDepth),
                  targetZ: flZ,
                  segments: processedSegments,
                  buoys: buoys.map((b, buoyIndex) => ({
                      ...b,
                      buoyId: String(b.id),
                      buoyIndex,
                      distanceFromAnchor: safeFloat(b.distanceFromAnchor, 0),
                      netBuoyancy: safeFloat(b.netBuoyancy, 0),
                      pennantLength: safeFloat(b.pennantLength, 0),
                      pennantWeight: safeFloat(b.pennantWeight, 0),
                      pennantLoad: safeFloat(b.pennantLoad, 0),
                      height: safeFloat(b.height, 0)
                  })),
                  targets: dedupInputs,
                  calcMode: calcMode,
                  calculateMax: showMaxTension
              };
              const WORKER_URL = "https://catcal-engine.rattawit-aum.workers.dev/";
              const MAX_RETRIES = 1;   // v13: network/timeout only, never 5xx
              const TIMEOUT_MS = 20000;
              let lastErr = null;
              for (let attempt = 1; attempt <= MAX_RETRIES + 1; attempt++) {
                  try {
                      const controller = new AbortController();
                      const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
                      const response = await fetch(WORKER_URL, {
                          method: "POST",
                          headers: { "Content-Type": "text/plain;charset=UTF-8" },   // simple request: no CORS preflight
                          body: JSON.stringify(payload),
                          signal: controller.signal
                      });
                      clearTimeout(timer);
                      if (!response.ok) {
                          const errData = await response.json().catch(() => ({}));
                          const errMsg = errData.error || `HTTP ${response.status}`;
                          // v11: never retry a CPU/budget 503 - retrying re-burns the CPU that caused it.
                          if (response.status === 503 && /CPU|budget/i.test(errMsg)) {
                              if (Array.isArray(errData.partialResults) && errData.partialResults.length) {
                                  updateConfigById(tabId, { results: errData.partialResults, resultsSig: null, calcWaterDepth: parseFloat(waterDepth) });
                                  pushToast('warning', `Budget limit reached — showing ${errData.partialResults.length} of ${dedupInputs.length} cases. Reduce targets or turn off Find Max.`, 6000);
                                  setLoading(false);
                                  return;
                              }
                              throw new Error(errMsg);
                          }
                          throw new Error(errMsg);
                      }
                      const data = await response.json();
                      updateConfigById(tabId, { results: data, resultsSig: sig, calcWaterDepth: parseFloat(waterDepth) });
                      setLoading(false);
                      if (isRetry) pushToast('success', 'Calculation succeeded on retry');
                      return;
                  } catch (err) {
                      lastErr = err;
                      // retry AbortError and TypeErrors (network) once
                      if (attempt <= MAX_RETRIES && (err.name === 'AbortError' || err.message === 'Failed to fetch' || err.message.includes('NetworkError'))) {
                          await new Promise(r => setTimeout(r, attempt * 500));
                          continue;
                      }
                      console.error('[SLACK v10] calc error:', err);
                      setCalcError(classifyError(err));
                      setLoading(false);
                      return;
                  }
              }
              // Fallback: exhausted retries
              console.error('[SLACK v10] exhausted retries:', lastErr);
              setCalcError(classifyError(lastErr || new Error('Unknown error')));
              setLoading(false);
          };

          // v13 C7: no auto-calc on load / new tab - the engine is only called on explicit Calculate.
          const isStale = (results || []).length > 0 && activeConfig.resultsSig !== solverSig(activeConfig) && activeConfig.resultsSig !== '__imported__';

          // Ctrl/Cmd+Enter = Calculate (U8)
          const calcRef = useRef(null);
          const flushRef = useRef(null);
          calcRef.current = handleCalculate;
          useEffect(() => {
              const onKey = (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); calcRef.current(false, e.shiftKey, flushRef.current ? flushRef.current() : {}); } };
              window.addEventListener('keydown', onKey);
              return () => window.removeEventListener('keydown', onKey);
          }, []);

          const structures = useMemo(() => {
              if (!subseaStructuresStr) return [];
              return parseStructDists(subseaStructuresStr);
          }, [subseaStructuresStr]);

          const statusCtx = useMemo(() => {
              const dfv = parseFloat(designFactor) > 0 ? parseFloat(designFactor) : DEFAULT_DF;
              const mc = parseFloat(minClearance);
              return { ...mblSummary(segments), df: dfv, structures, minClearance: isNaN(mc) ? DEFAULT_MIN_CLEARANCE : mc,
                       waterDepth: parseFloat(activeConfig.calcWaterDepth ?? waterDepth) || 0 };
          }, [segments, designFactor, minClearance, structures, activeConfig.calcWaterDepth, waterDepth]);

          const bgClass = theme === 'dark' ? 'bg-gray-950 text-gray-100' : 'bg-gray-50 text-gray-800';
          const sidebarBorder = theme === 'dark' ? 'border-gray-800' : 'border-gray-200';
          const sidebarBg = theme === 'dark' ? 'bg-gray-900' : 'bg-white';

          return (
              /* ROOT CONTAINER USING DVH - OPTION 2 */
              <div className={`flex h-[100dvh] w-screen overflow-hidden font-sans selection:bg-accent-500/30 ${bgClass}`}>
                  {showGuide && <UserGuideModal onClose={() => setShowGuide(false)} />}
                  {/* v10 M5+M7: Toast + Confirm + Prompt dialogs */}
                  <Toast toasts={toasts} removeToast={removeToast} />
                  <ConfirmDialog {...confirmState} onCancel={() => { if (confirmState.onCancel) confirmState.onCancel(); closeConfirm(); }} onConfirm={() => { if (confirmState.onConfirm) confirmState.onConfirm(); closeConfirm(); }} />
                  <PromptDialog {...promptState} onCancel={() => { if (promptState.onCancel) promptState.onCancel(); closePrompt(); }} onConfirm={(v) => { if (promptState.onConfirm) promptState.onConfirm(v); closePrompt(); }} />
                  
                  {sidebarOpen && (<div className="fixed inset-0 bg-black/60 z-20 lg:hidden" onClick={() => setSidebarOpen(false)} aria-hidden="true"/>)}
                  <div className={`fixed lg:relative inset-y-0 left-0 w-[340px] flex-shrink-0 border-r ${sidebarBorder} h-full ${sidebarBg} flex flex-col transition-transform duration-300 z-30 lg:z-20 lg:translate-x-0 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                      <div className={`p-4 border-b ${sidebarBorder}`}>
                          <div className="flex justify-between items-center mb-1">
                              <h1 className="text-xl font-bold tracking-tight flex items-center gap-2.5 min-w-0">
                                  <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-accent-400 to-accent-600 flex items-center justify-center shadow-soft">
                                      <IconAnchor size={19} className="text-white dark:text-gray-950" strokeWidth={2.4}/>
                                  </div>
                                  <div className="flex flex-col">
                                      <span className="leading-none tracking-[0.14em] text-gray-800 dark:text-gray-100">SLACK</span>
                                      <span className="text-[11px] font-normal text-gray-500 dark:text-gray-400 mt-1 whitespace-nowrap">Catenary Analysis · v13.7</span>
                                  </div>
                              </h1>
                              <div className="flex gap-0.5">
                                  <button onClick={() => fileInputRef.current.click()} aria-label="Import JSON configuration" className="p-1.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 transition-colors" title="Import JSON"><IconImport size={16} aria-hidden="true"/></button>
                                  <button onClick={exportToJson} aria-label="Export current configuration as JSON" className="p-1.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 transition-colors relative" title="Export JSON">
                                      <IconExport size={16} aria-hidden="true"/>
                                  </button>
                                  <button onClick={exportToCsv} aria-label="Export results as CSV" className="px-1 py-1.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 dark:text-gray-400 transition-colors text-[10px] font-bold" title="Export results CSV">CSV</button>
                                  <input type="file" ref={fileInputRef} onChange={handleImport} className="hidden" accept=".json" aria-label="JSON file input"/>
                                  <button onClick={() => setShowGuide(true)} aria-label="Open user guide" className="p-1.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 transition-colors" title="Guide"><IconHelp size={16} aria-hidden="true"/></button>
                                  <button onClick={toggleTheme} aria-label={`Switch to ${theme === 'dark' ? 'light' : 'dark'} theme`} className="p-1.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 transition-colors" title="Theme">{theme === 'dark' ? <IconSun size={16} aria-hidden="true"/> : <IconMoon size={16} aria-hidden="true"/>}</button>
                              </div>
                          </div>
                      </div>
                      <div className="flex-1 overflow-hidden p-4">
                          <InputPanel
                              key={activeTabId}
                              flushRef={flushRef}
                              waterDepth={waterDepth} setWaterDepth={setWaterDepth}
                              fairleadElev={fairleadElev} setFairleadElev={setFairleadElev}
                              segments={segments} setSegments={setSegments}
                              buoys={buoys} setBuoys={setBuoys}
                              tensions={tensionsStr} setTensions={setTensionsStr}
                              calculate={(e, ov) => handleCalculate(false, !!(e && e.shiftKey), ov || {})} loading={loading}
                              isUpToDate={(results || []).length > 0 && !isStale}
                              showMaxTension={showMaxTension} setShowMaxTension={setShowMaxTension}
                              subseaStructures={subseaStructuresStr} setSubseaStructures={setSubseaStructuresStr}
                              calcMode={calcMode} setCalcMode={(m) => {
                                  if (m === calcMode) return;
                                  // v13.1 B20: keep each mode's own target list
                                  const saved = activeConfig[`targets_${m}`];
                                  updateConfig({ calcMode: m, [`targets_${calcMode}`]: tensionsStr });
                                  if (saved) { setTensionsStr(saved); return; }
                                  if (m === 'offset') {
                                      // v11: pre-fill 95% of the PHYSICAL max sqrt(L^2 - vSpan^2). Pre-filling the
                                      // full payout always exceeded the worker limit -> guaranteed 400 on first click.
                                      const totalLen = segments.reduce((acc, s) => acc + (typeof s.length === 'string' ? parseFloat(s.length) : s.length), 0);
                                      const vSpan = Math.abs(safeFloat(waterDepth) - (-1 * safeFloat(fairleadElev)));
                                      const maxOff = Math.sqrt(Math.max(0, totalLen * totalLen - vSpan * vSpan));
                                      setTensionsStr((maxOff * 0.95).toFixed(1));
                                  } else {
                                      setTensionsStr(FLEET_PRESETS[activePresetKey]?.tensionsStr || "5, 20, 40");
                                  }
                              }}
                              projectName={projectName} setProjectName={setProjectName}
                              patternType={patternType} setPatternType={setPatternType}
                              designFactor={designFactor} setDesignFactor={setDesignFactor}
                              minClearance={minClearance} setMinClearance={setMinClearance}
                              anchorBearings={anchorBearings} setAnchorBearings={setAnchorBearings}
                              activePresetKey={activePresetKey}
                              bulkUpdateConfig={bulkUpdateConfig}
                              pushToast={pushToast}
                              openConfirm={openConfirm}
                              openPrompt={openPrompt}
                          />
                      </div>
                  </div>

                  <div className={`flex-1 min-w-0 flex flex-col p-5 h-full overflow-hidden relative ${theme === 'dark' ? 'bg-gray-950' : 'bg-gray-50'}`}>
                      <div className="absolute inset-0 opacity-[0.03] pointer-events-none" style={{backgroundImage: 'linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px)', backgroundSize: '40px 40px'}}></div>
                      <div className="relative z-10 h-full flex flex-col gap-3 min-h-0">
                          <div className="flex gap-2 border-b border-gray-200 dark:border-gray-800 pb-0 items-end">
                              <button onClick={() => setSidebarOpen(true)} aria-label="Open configuration panel" title="Configuration" className="lg:hidden px-3 py-2 mb-1 text-gray-500 hover:text-accent-500 transition-colors">
