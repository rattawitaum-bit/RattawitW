                                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
                              </button>
                              {configs.map(c => (
                                  <div key={c.id} onClick={() => { setActiveTabId(c.id); /* v8: no auto-calc on tab switch - existing results shown as-is, empty tabs stay empty until user clicks Calculate */ }} className={`cursor-pointer px-4 py-2 rounded-t-lg text-sm font-bold transition-colors ${activeTabId === c.id ? (theme === 'dark' ? 'bg-gray-950 text-accent-400 border-t-2 border-l border-r border-gray-800 border-t-accent-500 relative top-[1px]' : 'bg-white text-accent-600 border-t-2 border-l border-r border-gray-200 border-t-accent-600 relative top-[1px] shadow-sm') : (theme === 'dark' ? 'bg-gray-900/50 text-gray-500 hover:bg-gray-800 hover:text-gray-300' : 'bg-gray-200/50 text-gray-500 hover:bg-white hover:text-gray-700')}`}>
                                      {c.projectName}
                                      {configs.length > 1 && (
                                          <button onClick={(e) => { e.stopPropagation(); setConfigs(configs.filter(config => config.id !== c.id)); if (activeTabId === c.id) { setActiveTabId(configs.find(config => config.id !== c.id).id); } }} className="ml-2 text-gray-400 hover:text-red-500 rounded-full hover:bg-white/20 p-0.5" title="Close Tab">✕</button>
                                      )}
                                  </div>
                              ))}
                              <button onClick={() => { const newId = Math.max(0, ...configs.map(c => c.id)) + 1; setConfigs([...configs, createDefaultConfig(newId)]); setActiveTabId(newId); }} className="px-3 py-2 text-gray-500 hover:text-accent-500 transition-colors self-end mb-1" title="New Tab"><IconPlus size={18} /></button>
                          </div>
                      
                          {/* v10 M1: structured error banner with Retry button */}
                          {calcError && <ErrorBanner error={calcError} onClose={() => setCalcError(null)} onRetry={() => { setCalcError(null); handleCalculate(true); }} />}
                          {isStale && (
                              <div role="status" className="flex items-center gap-3 px-3 py-2 rounded-lg border border-warn-600/40 dark:border-warn-400/40 bg-warn-600/10 dark:bg-warn-400/10 text-warn-600 dark:text-warn-400 text-xs">
                                  <IconWarning size={14} aria-hidden="true"/>
                                  <span className="flex-1"><b>Inputs changed</b> - chart and table show the previous calculation.</span>
                                  <button onClick={() => handleCalculate(false, true)} disabled={loading} className="px-2 py-1 rounded bg-warn-600 dark:bg-warn-400 text-white dark:text-gray-950 font-bold disabled:opacity-50">Recalculate</button>
                              </div>
                          )}
                          {/* NEW v6: View switcher (Profile <-> Top View) */}
                          <div className="flex gap-1 mb-1">
                              <button onClick={() => setActiveView('profile')} className={`text-[11px] font-bold uppercase tracking-wider px-3 py-1.5 rounded transition-colors ${activeView === 'profile' ? (theme === 'dark' ? 'bg-accent-600 text-white' : 'bg-accent-600 text-white') : (theme === 'dark' ? 'bg-gray-800 text-gray-400 hover:bg-gray-700' : 'bg-gray-200 text-gray-500 hover:bg-gray-300')}`}>
                                  Catenary Profile
                              </button>
                              <button onClick={() => setActiveView('topview')} className={`text-[11px] font-bold uppercase tracking-wider px-3 py-1.5 rounded transition-colors ${activeView === 'topview' ? (theme === 'dark' ? 'bg-accent-600 text-white' : 'bg-accent-600 text-white') : (theme === 'dark' ? 'bg-gray-800 text-gray-400 hover:bg-gray-700' : 'bg-gray-200 text-gray-500 hover:bg-gray-300')}`}>
                                  Top View (Plan)
                              </button>
                          </div>
                          {activeView === 'profile'
                              ? <ChartPanel configs={configs} activeConfigId={activeTabId} structures={structures} theme={theme} statusCtx={statusCtx} />
                              : <TopViewPanel configs={configs} activeConfigId={activeTabId} theme={theme} patternType={patternType} anchorBearings={anchorBearings} setAnchorBearings={setAnchorBearings} setPattern={(t) => updateConfig({ patternType: t, anchorBearings: (PATTERN_TEMPLATES[t] || []).map(a => ({ ...a })) })} statusCtx={statusCtx} />
                          }
                          <ResultsTable results={results} buoys={buoys} segments={segments} theme={theme} statusCtx={statusCtx} isStale={isStale} />
                      </div>
                  </div>
              </div>
          );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
    <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "03caaaf2ed8a44f1ab64db56724afd7a"}'></script><!-- End Cloudflare Web Analytics -->
  </body>
</html>
