                              <button onClick={() => setShowAll(true)} aria-pressed={showAll} className={`px-2 py-0.5 ${showAll ? 'bg-accent-600 text-white' : 'text-gray-600 dark:text-gray-300'}`}>All {results.length}</button>
                          </div>
                      )}
                      <button onClick={() => setZoomNear(z => !z)} className={`text-[11px] font-semibold px-2 py-0.5 rounded border ${zoomNear ? 'bg-accent-600 text-white border-accent-600' : 'border-gray-300 dark:border-gray-700 text-gray-600 dark:text-gray-300'}`} title="Zoom to the near field (structures / rig area)">
                          {zoomNear ? 'Near field' : 'Full extent'}
                      </button>
                  </div>

                  <div className="flex-1 min-h-0 grid gap-3 lg:grid-cols-[minmax(0,1fr)_minmax(380px,470px)] overflow-y-auto lg:overflow-hidden">
                      <div className="min-h-[260px] lg:min-h-0 flex flex-col">
                  <div className="flex-1 min-h-[200px] flex items-center justify-center overflow-hidden">
                      <svg viewBox={`0 0 ${chartSize} ${chartSize}`} className="w-full h-full" preserveAspectRatio="xMidYMid meet" style={{ overflow: 'hidden' }}>
                          {rings.map((r, i) => (
                              <g key={i}>
                                  <circle cx={cx} cy={cy} r={r * scale} fill="none"
                                          stroke={isDark ? "#26344A" : "#E6EBF1"} strokeWidth={1}
                                          strokeDasharray="3 4" strokeOpacity={0.6}/>
                                  {(() => { const lp = toXY(22.5, r); return (
                                  <text x={lp.x + 3} y={lp.y - 3} fontSize={11}
                                        fill={isDark ? "#94A4B8" : "#55687F"} style={{ paintOrder: 'stroke', stroke: isDark ? '#1C2839' : '#FFFFFF', strokeWidth: 3 }}>{r}m</text>); })()}
                              </g>
                          ))}
                          <line x1={cx} y1={padding/2} x2={cx} y2={chartSize - padding/2}
                                stroke={isDark ? "#3C4C60" : "#BCC8D8"} strokeOpacity={0.5}/>
                          <line x1={padding/2} y1={cy} x2={chartSize - padding/2} y2={cy}
                                stroke={isDark ? "#3C4C60" : "#BCC8D8"} strokeOpacity={0.5}/>
                          <text x={cx} y={padding/2 - 4} textAnchor="middle" fontSize={10}
                                fill={isDark ? "#94A4B8" : "#55687F"} fontWeight="bold">N</text>
                          <text x={chartSize - padding/2 + 8} y={cy + 4} textAnchor="middle" fontSize={10}
                                fill={isDark ? "#94A4B8" : "#55687F"} fontWeight="bold">E</text>
                          <text x={cx} y={chartSize - padding/2 + 12} textAnchor="middle" fontSize={10}
                                fill={isDark ? "#94A4B8" : "#55687F"} fontWeight="bold">S</text>
                          <text x={padding/2 - 8} y={cy + 4} textAnchor="middle" fontSize={10}
                                fill={isDark ? "#94A4B8" : "#55687F"} fontWeight="bold">W</text>

                          {structures.map((st, i) => {
                              const col = isDark ? "#FF5C5C" : "#C42B2B";

                              const p1 = toXY(st.bearing - st.half, st.dist);

                              return (
                                  <g key={`str-${i}`}>
                                      <path d={`M ${p1.x} ${p1.y} A ${rr} ${rr} 0 ${largeArc} 1 ${p2.x} ${p2.y}`}

                          {casesToRender.map(({r: res, i: resIdx}) => {

                              const fairleadX = getFX(res);
                              const groundedLen = getGL(res);
                              // B1/B2: touchdown = where line leaves the seabed (near anchor side)

                              const touchdownDist = Math.max(0, fairleadX - groundedLen);

                              return bearings.map((b, li) => {

                                  const anchorClipped = fairleadX > maxFairleadX + 1e-6;

                                  const touch = toXY(b.bearing, capD(touchdownDist));
                                  // v11: TWO distinct checks. The old test only asked whether the ANCHOR was within
                                  // 150 m of the pipeline radius, so a line whose anchor sits at 900 m with a pipeline
                                  // at 400 m physically CROSSES it and was never flagged at all.
                                  const onThisLine = structures.filter(st => bearingInSector(b.bearing, st));
                                  const crossesPipeline = onThisLine.some(st => st.dist > 0 && st.dist < fairleadX);
                                  const anchorTooClose = onThisLine.some(st => Math.abs(fairleadX - st.dist) < GMI_MIN_HORIZONTAL);
                                  const crossingPoints = onThisLine.filter(st => st.dist > 0 && st.dist < fairleadX).map(st => ({ ...toXY(b.bearing, st.dist), sector: st.bearing !== null, grounded: (st.dist >= touchdownDist && groundedLen > 0.5) || contactsOf(res).some(cc => st.dist >= cc.near && st.dist <= cc.far) }));

                                  return (
                                      <g key={`ln-${resIdx}-${li}`}>
                                          {/* B1: Suspended = center to touchdown (solid) */}
                                          <line x1={cx} y1={cy} x2={touch.x} y2={touch.y}
                                                stroke={color} strokeWidth={1.8} strokeOpacity={0.9}/>
                                          {/* B1: Grounded = touchdown to anchor (dashed thick, near anchor) */}
                                          {groundedLen > 0.5 && (
                                              <line x1={touch.x} y1={touch.y} x2={anchor.x} y2={anchor.y}
                                                    stroke={color} strokeWidth={3.2} strokeDasharray="6 4"
                                                    strokeOpacity={0.8}/>
                                          )}
                                          {groundedLen > 0.5 && (
                                              <circle cx={touch.x} cy={touch.y} r={2.5} fill={color} opacity={0.9}/>
                                          )}
                                          {contactsOf(res).map((cc, ci) => {
                                              const a = toXY(b.bearing, Math.max(0, cc.far));
                                              const c = toXY(b.bearing, Math.max(0, cc.near));
                                              return <line key={`ct-${ci}`} x1={a.x} y1={a.y} x2={c.x} y2={c.y} stroke={color} strokeWidth={3.2} strokeDasharray="6 4" strokeOpacity={0.8}/>;
                                          })}
                                          {/* v11: was a linear arc-length ratio - wrong for a catenary. Read the buoy's
                                              actual profile point and use its real horizontal position instead. */}
                                          {isLabelCase && buoysInput.map((bo, bIdx) => {
                                              const distAnchor = safeFloat(bo.distanceFromAnchor, 0);
                                              const totLen = getTL(res);
                                              if (totLen <= 0) return null;
                                              const buoyPts = (res.points || []).filter(pp => pp.isBuoy);
                                              let bp = buoyPts.find(pp => pp.buoyIndex === bIdx)
                                                    || buoyPts.find(pp => Math.abs(safeFloat(pp.s, NaN) - distAnchor) < Math.max(1, distAnchor * 0.02));
                                              if (!bp) bp = buoyPts[bIdx];
                                              const buoyHoriz = bp ? Math.max(0, fairleadX - safeFloat(bp.x, 0))
                                                                   : fairleadX * ((totLen - distAnchor) / totLen);
                                              if (!isFinite(buoyHoriz)) return null;
                                              const bxy = toXY(b.bearing, capD(buoyHoriz));
                                              return (
                                                  <circle key={`by-${bIdx}`} cx={bxy.x} cy={bxy.y}
                                                          r={5} fill={bp ? BUOY_FILL[isDark ? 'dark' : 'light'][buoyLevel(bp.buoyUtilization || 0, bp.isSlack)] : '#F5A524'} stroke={isDark ? '#EAEFF4' : '#26344A'}
                                                          strokeWidth={1.2} opacity={0.9}/>
                                              );
                                          })}
                                          {anchorClipped
                                              ? <g><path d="M-7,-6 L7,0 L-7,6 Z" transform={`translate(${anchor.x},${anchor.y}) rotate(${b.bearing - 90})`} fill={color} stroke={isDark ? '#EAEFF4' : '#26344A'} strokeWidth={1}/>
                                                  {isLabelCase && <text x={anchor.x} y={anchor.y + 18} textAnchor="middle" fontSize={10} fill={color} style={{ paintOrder: 'stroke', stroke: isDark ? '#1C2839' : '#FFFFFF', strokeWidth: 3 }}>{fairleadX.toFixed(0)} m ▸</text>}</g>
                                              : <rect x={anchor.x - 6} y={anchor.y - 6} width={12} height={12}
                                                fill={color} stroke={isDark ? '#EAEFF4' : '#26344A'} strokeWidth={1}/>}
                                          {isLabelCase && (
                                              <text x={anchor.x} y={anchor.y - 10} textAnchor="middle"
                                                    fontSize={11} fill={color} fontWeight="bold" style={{ paintOrder: 'stroke', stroke: isDark ? '#1C2839' : '#FFFFFF', strokeWidth: 3 }}>
                                                  {b.name}
                                              </text>
                                          )}
                                          {isLabelCase && anchorTooClose && (
                                              <>
                                                  <circle cx={anchor.x} cy={anchor.y} r={12} fill="none" stroke="#FF5C5C" strokeWidth={2} strokeDasharray="3 2"/>
                                                  <circle cx={anchor.x} cy={anchor.y} r={16} fill="none" stroke="#FF5C5C" strokeWidth={1} strokeOpacity={0.5}/>
                                              </>
                                          )}
                                          {isLabelCase && crossingPoints.map((pt, ci) => (
                                              <g key={`cross-${resIdx}-${li}-${ci}`}>
                                                  <circle cx={pt.x} cy={pt.y} r={4} fill="#FF5C5C" stroke={isDark ? '#EAEFF4' : '#26344A'} strokeWidth={1.5}/>
                                                  {pt.sector && <text x={pt.x} y={pt.y - 9} textAnchor="middle" fontSize={10} fill="#FF5C5C" fontWeight="bold">{pt.grounded ? 'ON SEABED' : 'CROSSES'}</text>}
                                                  {pt.grounded && <rect x={pt.x - 6} y={pt.y - 6} width={12} height={12} fill="none" stroke="#FF5C5C" strokeWidth={2}/>}
                                              </g>
                                          ))}
                                      </g>
                                  );
                              });
                          }).flat()}

                          <rect x={cx - 20} y={cy - 12} width={40} height={24} rx={2}
                                fill="#F5A524" stroke="#3C2500" strokeWidth={2}/>
                          <text x={cx} y={cy + 4} textAnchor="middle" fontSize={10}
                                fill="#3C2500" fontWeight="900">RIG</text>
                      </svg>
                  </div>

                  <div className="flex gap-3 text-[11px] flex-wrap border-t border-gray-200 dark:border-gray-700 pt-2 mt-2">
                      <div className="flex items-center gap-1"><div className="w-3 h-3 bg-amber-500 border border-amber-900"></div><span className="text-gray-600 dark:text-gray-400">Rig</span></div>
                      <div className="flex items-center gap-1"><div className="w-6 h-0.5 bg-gray-500"></div><span className="text-gray-600 dark:text-gray-400">Suspended</span></div>
                      <div className="flex items-center gap-1"><div className="w-6 h-1 border-b-2 border-dashed border-gray-500"></div><span className="text-gray-600 dark:text-gray-400">Grounded (near anchor)</span></div>
                      <div className="flex items-center gap-1"><div className="w-3 h-3 rounded-full bg-ok-600 dark:bg-ok-400"></div><span className="text-gray-600 dark:text-gray-400">MLB (colour = util)</span></div>
                      <div className="flex items-center gap-1"><div className="w-3 h-3 rounded-full border-2 border-dashed border-red-500"></div><span className="text-red-600 dark:text-red-400 font-bold">Anchor &lt; {GMI_MIN_HORIZONTAL} m from struct</span></div>
                  </div>
                      </div>
                      <div className="min-h-0 lg:overflow-y-auto pr-1">
                  {results.length > 0 && structures.length > 0 && (() => {
                      // v13.9 M3: check EVERY case and report the worst per line/structure. Minimum clearance usually
                      // occurs at LOW tension (sagging line / mid-line seabed contact), not in the Max case.
                      const minC = statusCtx?.minClearance ?? DEFAULT_MIN_CLEARANCE;
                      const caseName = (r) => `${getHT(r).toFixed(1)} t${caseTag(r)}`;
                      const rows = [];
                      bearings.forEach(b => structures.filter(st => bearingInSector(b.bearing, st)).forEach(st => {
                          let worst = null;
                          results.forEach(res => {
                              const fx = getFX(res);
                              const crosses = st.dist < fx;
                              const clr = crosses ? clearanceAt(res, st.dist, statusCtx?.waterDepth ?? 0) : null;
                              const tooClose = Math.abs(fx - st.dist) < GMI_MIN_HORIZONTAL;
                              const grounded = crosses && clr !== null && clr <= 0.05;
                              const low = crosses && clr !== null && clr < minC;
                              const sev = grounded ? 4 : low ? 3 : tooClose ? 2 : crosses ? 1 : 0;
                              const cand = { line: b.name, dist: st.dist, crosses, clr, tooClose, sev, anchorGap: Math.abs(fx - st.dist), caseLabel: caseName(res),
                                             level: sev >= 2 ? 'bad' : sev === 1 ? 'warn' : 'ok',
                                             label: grounded ? 'ON STRUCTURE' : low ? 'LOW CLEARANCE' : tooClose ? 'ANCHOR < MIN' : crosses ? 'CROSSING' : 'OK',
                                             tip: grounded ? 'Line lies on the seabed at the structure distance - direct contact' : low ? 'Line is above the seabed by less than the minimum clearance' : tooClose ? 'Anchor closer to the structure than the minimum anchor-structure distance' : crosses ? 'Line passes over the structure with enough clearance' : 'Anchor and line stay clear of the structure' };
                              if (!worst || cand.sev > worst.sev || (cand.sev === worst.sev && (cand.clr ?? Infinity) < (worst.clr ?? Infinity))) worst = cand;
                          });
                          if (worst) rows.push(worst);
                      }));
                      if (!rows.length) return null;
                      return (
                          <div className="border-t border-gray-200 dark:border-gray-700 pt-2 mt-2">
                              <div className="text-[11px] font-bold uppercase text-gray-500 dark:text-gray-400 tracking-wider mb-1">

                              </div>
                              <div className="overflow-x-auto"><table className="w-full text-[11px] tabular-nums whitespace-nowrap">

                                  <tbody>{rows.map((r, i) => (
                                      <tr key={i} className="border-t border-gray-100 dark:border-gray-800">
                                          <td className="py-0.5 pr-3 font-bold">{r.line}</td><td className="pr-3">{r.dist} m</td><td className="pr-3 font-mono">{r.caseLabel}</td>
                                          <td className="pr-3">{r.clr === null ? '-' : `${Math.max(0, r.clr).toFixed(1)} m`}</td>
                                          <td className="pr-3">{r.anchorGap.toFixed(0)} m</td>
                                          <td><span title={r.tip} className={`px-1.5 rounded-full font-bold ${PILL_CLS[r.level]}`}>{r.label}</span></td>
                                      </tr>))}</tbody>
                              </table></div>
                          </div>
                      );
                  })()}

                  {/* B7: Tension legend with actual COLORS palette */}
                  {results.length > 0 && (

                              <span className="text-[11px] font-bold uppercase text-gray-500 dark:text-gray-400 tracking-wider">Cases:</span>
                              {results.map((r, i) => {
                                  const color = caseColorOf(r, i, isDark);
                                  const active = caseFocus === 'all' || caseFocus === String(i);
                                  return (
                                      <button key={i} onClick={() => { setSelIdx(i); setShowAll(false); }} className={`flex items-center gap-1.5 text-[11px] rounded px-1 hover:bg-gray-100 dark:hover:bg-gray-800 ${active ? '' : 'opacity-40'} ${i === selIdx ? 'ring-1 ring-accent-500' : ''}`} title="Select this case">
                                          <div className="w-6 h-0.5" style={{backgroundColor: color}}></div>
                                          <span className="font-mono" style={{color}}>
                                              {getHT(r).toFixed(1)}t{caseTag(r)}
                                          </span>
                                      </button>
                                  );
                              })}
                          </div>
                      </div>
                  )}

                  <div className="border-t border-gray-200 dark:border-gray-700 pt-2 mt-2">
                      <div className="flex justify-between items-center mb-1.5">
                          <span className="text-[11px] font-bold uppercase text-gray-500 dark:text-gray-400 tracking-wider">
                              Anchor Bearings ({nLines} lines)
                          </span>
                          <button onClick={() => setAnchorBearings(template.map(t => ({...t})))}
                                  className="text-[11px] font-bold text-accent-600 dark:text-accent-400 hover:underline">
                              Reset to default
                          </button>
                      </div>
                      <div className="grid grid-cols-4 gap-1.5 text-[11px]">
                          {bearings.map((b, i) => (
                              <div key={i} className="flex items-center gap-1 bg-gray-100 dark:bg-gray-800 rounded px-1.5 py-1">
                                  <span className="font-bold text-accent-600 dark:text-accent-400 w-8">{b.name}</span>
                                  <input type="number" value={b.bearing}
                                         onChange={e => updateBearing(i, e.target.value)}
                                         min="0" max="359" step="5"
                                         className="w-14 bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded px-1 py-0.5 text-[11px] font-mono focus:outline-none focus:border-accent-500"/>
                                  <span className="text-gray-500">°</span>
                              </div>
                          ))}
                      </div>
                  </div>

                      </div>
                  </div>
              </div>
          );
      };

      // v13.13 ResultsTable: compact one-line rows, click = select case (shared with chart / top view),
      // hover = highlight on the chart, chevron = expand the full list of warnings with explanations.
      const ResultsTable = ({ results, buoys, segments, theme, statusCtx, isStale, selIdx, setSelIdx, setHoverIdx, collapsed, setCollapsed }) => {
          const isDarkTbl = theme === 'dark';
          const { minMBL, minIdx, hasMBL, missing, df } = statusCtx;
          const swl = hasMBL ? minMBL / df : NaN;
          const totalLen = results[0]?.totalLength;
          const cols = 11;
          const [open, setOpen] = useState({});
          const flagsAll = useMemo(() => results.map(r => getStatusFlags(r, statusCtx)), [results, statusCtx]);
          const worstUtil = hasMBL && results.length ? Math.max(...results.map(r => (r.fairleadTension / swl) * 100)) : null;
          const nWarn = flagsAll.filter(f => f.some(x => x.level !== 'info')).length;
          const TH = "px-2 py-2 whitespace-nowrap";
          const TONE = { ok: 'text-ok-600 dark:text-ok-400', warn: 'text-warn-600 dark:text-warn-400', bad: 'text-bad-600 dark:text-bad-400', sub: 'text-bad-600 dark:text-bad-400 font-extrabold', slack: 'text-gray-500 dark:text-gray-400' };
          return (
              <div className={`h-full min-h-0 bg-white dark:bg-gray-850 border border-gray-200 dark:border-gray-800 rounded-xl overflow-hidden flex flex-col shadow-card transition-opacity ${isStale ? 'opacity-60' : ''}`}>
                  <div className="px-3 py-1.5 border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900/60 flex flex-wrap gap-x-4 gap-y-0.5 justify-between items-center shrink-0">
                      <button onClick={() => setCollapsed(c => !c)} aria-expanded={!collapsed} aria-label="Toggle results table" className="font-semibold text-gray-700 dark:text-gray-200 text-sm flex items-center gap-1.5 hover:text-accent-600">
                          <IconChevronDown size={14} className={`transition-transform ${collapsed ? '-rotate-90' : ''}`} /> Calculation Results
                          {collapsed && results.length > 0 && <span className="font-normal text-[11px] text-gray-500 dark:text-gray-400 font-mono">· {results.length} cases{worstUtil !== null ? ` · worst SWL util ${worstUtil.toFixed(0)}%` : ''}{nWarn ? ` · ${nWarn} with warnings` : ''}</span>}
                      </button>
                      <div className="text-[11px] text-gray-600 dark:text-gray-400 flex flex-wrap gap-x-3">
                          {totalLen !== undefined && <span>Payout <b className="font-mono">{totalLen.toFixed(1)} m</b></span>}
                          {hasMBL && <span>SWL <b className="font-mono">{swl.toFixed(1)} t</b> (seg #{minIdx + 1} MBL {minMBL} t / DF {df})</span>}
                          {missing.length > 0 && <span className="text-warn-600 dark:text-warn-400 font-semibold">No MBL on seg #{missing.join(', #')} - not checked</span>}
                          {isStale && <span className="text-warn-600 dark:text-warn-400 font-semibold">Inputs changed - results outdated</span>}
                          {!collapsed && results.length > 0 && <span className="text-gray-400">click a row = select · chevron = details</span>}
                      </div>
                  </div>
                  {!collapsed && (
                  <div className="overflow-auto flex-1 min-h-0">
                      <table className="w-full min-w-[960px] text-left text-[13px] text-gray-700 dark:text-gray-300 tabular-nums">
                          <thead className="bg-gray-100 dark:bg-gray-900 text-[11px] uppercase font-semibold text-gray-600 dark:text-gray-400 tracking-[0.05em] sticky top-0 z-10">
                              <tr>
                                  <th className={TH + " pl-3"} title="Horizontal tension at the fairlead (t)">Case t</th>
                                  <th className={TH} title="Horizontal distance fairlead → anchor (m)">Offset m</th>

                                  <th className={TH} title="Anchor horizontal load (t)">Anch H</th>
                                  <th className={TH} title="Anchor uplift (t)">Anch V</th>
                                  <th className={TH} title="Resultant anchor tension sqrt(H^2+V^2) (t)">Anch Res</th>
                                  <th className={TH} title="Fairlead tension sqrt(H^2+V^2) (t)">FL Ten</th>

                          </thead>
                          <tbody className="divide-y divide-gray-200 dark:divide-gray-800">
                              {results.map((res, idx) => {
                                  const flags = flagsAll[idx] || [];
                                  const invalid = isInvalidCase(flags);
                                  const sorted = [...flags].sort((a, b) => ({ bad: 0, warn: 1, info: 2 }[a.level] - { bad: 0, warn: 1, info: 2 }[b.level]));

                                          <td className="px-2 py-1.5 whitespace-nowrap">
                                              {buoyPoints(res).length > 0 ? (
                                                  <span className="inline-flex gap-2 font-mono text-[12px] font-semibold">
                                                      {buoyPoints(res)
                                                          .map((b, i) => ({ b, no: getBuoyDisplayNumber(b, buoys || [], i) }))
                                                          .sort((x, y) => x.no - y.no)
                                                          .map(({ b, no }) => {
                                                              const u = (b.buoyUtilization || 0) * 100;
                                                              const lvl = buoyLevel(b.buoyUtilization || 0, b.isSlack);
                                                              return <span key={no} className={TONE[lvl]} title={b.inGroundedZone ? 'On grounded zone' : `Buoy ${no}: ${lvl === 'slack' ? 'slack - no lift' : lvl === 'sub' ? 'fully submerged' : u.toFixed(0) + '% submerged'}`}>
                                                                  B{no} {lvl === 'slack' ? 'SLACK' : lvl === 'sub' ? 'SUB' : `${u.toFixed(0)}%`}{b.inGroundedZone ? ' ⚠' : ''}
                                                              </span>;
                                                          })}
                                                  </span>
                                              ) : <span className="text-gray-400">-</span>}
                                          </td>
                                          <td className="px-2 py-1.5 text-xs whitespace-nowrap">
                                              {sorted.length === 0

                                                  : <span className="inline-flex items-center gap-1">
                                                      <span title={sorted[0].tip} className={`px-2 py-0.5 rounded-full text-[11px] font-bold ${PILL_CLS[sorted[0].level]}`}>{sorted[0].text}</span>
                                                      {sorted.length > 1 && <button onClick={(e) => { e.stopPropagation(); setOpen(o => ({ ...o, [idx]: true })); }} title={sorted.slice(1).map(x => x.text).join('\n') + '\n(click to expand)'} className="px-1.5 py-0.5 rounded-full text-[11px] font-bold bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-300">+{sorted.length - 1}</button>}
                                                    </span>}

                                          <tr className="bg-gray-50/80 dark:bg-white/[0.03]">
                                              <td colSpan={cols} className="pl-9 pr-4 py-2">
                                                  {sorted.length === 0

                                                      : <ul className="space-y-1">{sorted.map((f, k) => (

                              })}
                              {results.length === 0 && (<tr><td colSpan={cols} className="px-4 py-8 text-center text-gray-500 dark:text-gray-400">No results yet - set targets and press Calculate (Ctrl+Enter).</td></tr>)}
                          </tbody>
                      </table>
                  </div>
                  )}
              </div>
          );
      };

      // v13.13 Tension-Offset view: how far the fairlead offset moves per tonne - shows where offset stops being a usable
      // proxy for tension, and where the SWL limit lies.
      const CurvePanel = ({ configs, activeConfigId, theme, statusCtx, selIdx, setSelIdx }) => {
          const cfg = configs.find(c => c.id === activeConfigId) || configs[0];
          const results = cfg?.results || [];
          const isDark = theme === 'dark';
          const swl = statusCtx.hasMBL ? statusCtx.minMBL / statusCtx.df : NaN;
          const pts = results.map((r, i) => ({ i, x: r.fairleadX, y: r.fairleadTension, h: r.horizontalTension, tag: caseTag(r), color: caseColorOf(r, i, isDark), invalid: isInvalidCase(getStatusFlags(r, statusCtx)) }))
              .filter(p => isFinite(p.x) && isFinite(p.y));
          const byH = [...pts].filter(p => !p.invalid).sort((a, b) => a.h - b.h);
          const steps = byH.slice(1).map((p, k) => { const q = byH[k]; const dT = p.h - q.h, dX = p.x - q.x; return { from: q, to: p, dT, dX, rate: dT > 0 ? dX / dT : 0 }; });
          const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
          const xMin = xs.length ? Math.floor((Math.min(...xs) - 10) / 10) * 10 : 0, xMax = xs.length ? Math.ceil((Math.max(...xs) + 10) / 10) * 10 : 100;
          const yMax = Math.ceil(Math.max(1, ...ys, isFinite(swl) ? swl : 0) * 1.1 / 10) * 10;
          const grid = isDark ? '#26344A' : '#E6EBF1', ax = isDark ? '#94A4B8' : '#55687F';
          const dot = (props) => {
              const { cx, cy, payload } = props; const sel = payload.i === selIdx;
              return (
                  <g onClick={() => setSelIdx(payload.i)} style={{ cursor: 'pointer' }}>
                      <circle cx={cx} cy={cy} r={sel ? 8 : 6} fill={payload.color} stroke={isDark ? '#EAEFF4' : '#26344A'} strokeWidth={sel ? 2.5 : 1.2} fillOpacity={payload.invalid ? 0.4 : 1} />
                      <text x={cx + 10} y={cy - 8} fontSize={11} fontWeight="600" fill={isDark ? '#BCC8D8' : '#3C4C60'} style={{ paintOrder: 'stroke', stroke: isDark ? '#1C2839' : '#FFFFFF', strokeWidth: 3 }}>{payload.h.toFixed(payload.h >= 100 ? 0 : 1)} t{payload.tag}</text>
                  </g>
              );
          };
          return (
              <div className="flex-1 min-h-0 bg-white dark:bg-gray-850 border border-gray-200 dark:border-gray-800 rounded-xl p-3 flex flex-col shadow-card overflow-hidden">
                  <div className="flex flex-wrap items-center gap-3 pb-1">
                      <h3 className="text-gray-700 dark:text-gray-200 text-xs font-semibold flex items-center gap-2"><IconSettings2 size={14} className="text-accent-600 dark:text-accent-500"/> Tension – Offset <span className="font-normal text-gray-500 dark:text-gray-400">· fairlead tension vs horizontal offset · click a point to select the case</span></h3>
                  </div>
                  <div className="flex-1 min-h-0 grid gap-3 lg:grid-cols-[minmax(0,1fr)_300px]">
                      <div className="min-h-[200px] min-w-0">
                          {pts.length === 0 ? <div className="h-full flex items-center justify-center text-sm text-gray-500 dark:text-gray-400">No results yet.</div> : (
                          <ResponsiveContainer width="100%" height="100%">
                              <ScatterChart margin={{ top: 16, right: 40, bottom: 34, left: 20 }}>
                                  <CartesianGrid strokeDasharray="3 3" stroke={grid} />
                                  <XAxis dataKey="x" type="number" unit="m" domain={[xMin, xMax]} allowDataOverflow stroke={ax} tick={{ fontSize: 11, fill: ax }} label={{ value: 'Offset: fairlead → anchor (m)', position: 'insideBottomRight', offset: -8, fill: ax, fontSize: 12 }} />
                                  <YAxis dataKey="y" type="number" unit="t" domain={[0, yMax]} allowDataOverflow stroke={ax} tick={{ fontSize: 11, fill: ax }} label={{ value: 'Fairlead tension (t)', angle: -90, position: 'insideLeft', fill: ax, fontSize: 12 }} />
                                  <Tooltip content={({ active, payload }) => {
                                      if (!(active && payload && payload.length)) return null; const p = payload[0].payload; if (p.h === undefined) return null;
                                      return <div className={`p-2 rounded shadow-lg text-xs border ${isDark ? 'bg-gray-900 border-gray-700 text-gray-200' : 'bg-white border-gray-200 text-gray-800'}`}><div className="font-bold">H {p.h.toFixed(1)} t{p.tag}</div><div>Offset {p.x.toFixed(1)} m</div><div>FL tension {p.y.toFixed(1)} t</div></div>;
                                  }} />
                                  {isFinite(swl) && <ReferenceLine y={swl} stroke={isDark ? '#FF5C5C' : '#C42B2B'} strokeDasharray="6 4" strokeWidth={1.5} ifOverflow="extendDomain" label={{ value: `SWL ${swl.toFixed(0)} t`, position: 'insideTopLeft', fill: isDark ? '#FF5C5C' : '#C42B2B', fontSize: 11, fontWeight: 'bold' }} />}
                                  <Scatter data={[...pts].sort((a, b) => a.x - b.x)} line={{ stroke: isDark ? '#5CBDFF' : '#1A79C8', strokeWidth: 1.5, strokeOpacity: 0.7 }} shape={dot} legendType="none" isAnimationActive={false} />
                              </ScatterChart>
                          </ResponsiveContainer>)}
                      </div>
                      <div className="min-h-0 overflow-y-auto text-[12px]">
                          <div className="text-[11px] font-bold uppercase text-gray-500 dark:text-gray-400 tracking-wider mb-1">Offset sensitivity</div>
                          {steps.length === 0 ? <div className="text-gray-500 dark:text-gray-400">Need at least two valid cases.</div> : (
                              <table className="w-full tabular-nums"><thead className="text-gray-500 dark:text-gray-400"><tr><th className="text-left font-semibold">Step (t)</th><th className="text-right font-semibold">ΔX (m)</th><th className="text-right font-semibold">m per t</th></tr></thead>
                                  <tbody>{steps.map((s, k) => (
                                      <tr key={k} className="border-t border-gray-100 dark:border-gray-800"><td className="py-0.5 font-mono">{s.from.h.toFixed(s.from.h >= 100 ? 0 : 1)} → {s.to.h.toFixed(s.to.h >= 100 ? 0 : 1)}</td><td className="text-right font-mono">{s.dX >= 0 ? '+' : ''}{s.dX.toFixed(1)}</td><td className={`text-right font-mono ${s.rate < 0.1 ? 'text-warn-600 dark:text-warn-400 font-bold' : ''}`}>{s.rate.toFixed(2)}</td></tr>))}
                                  </tbody></table>)}
                          {steps.some(s => s.rate < 0.1) && <p className="mt-2 text-warn-600 dark:text-warn-400 leading-snug">Below 0.1 m per tonne the offset barely changes with tension (line is almost straight). Use the winch tension, not the offset, to judge load in that range. Offset there is dominated by the EA value - enter certificate EA.</p>}
                          <p className="mt-2 text-gray-500 dark:text-gray-400 leading-snug">Dimmed points are invalid cases. The SWL line is the fairlead tension limit (MBL / DF).</p>
                      </div>
                  </div>
              </div>
          );
      };

      const createDefaultConfig = (id) => ({
          id: id,
          projectName: `Mooring_Line_${id}`,
          waterDepth: 73,
          fairleadElev: "3",
          subseaStructuresStr: "",
          segments: [
              makeSegment(SegmentType.WIRE, 38, 700, { id: `seg-wire-${id}-1` }),
              makeSegment(SegmentType.CHAIN, 38, 55, { id: `seg-chain-${id}-2` })
          ],
          buoys: [
              { id: `buoy-${id}-1`, distanceFromAnchor: 500, netBuoyancy: 5, pennantLength: 30, pennantDiameter: DEFAULT_PENNANT_DIA,
                pennantWeight: pennantWeightT(30, DEFAULT_PENNANT_DIA), height: 2.0, pennantLoad: 0.05, isPennantWeightManual: false }
          ],
          tensionsStr: "5, 20, 40",
          calcMode: 'tension',
          showMaxTension: false,
          patternType: 'tender_8pt',
          anchorBearings: PATTERN_TEMPLATES.tender_8pt.map(a => ({...a})),
          designFactor: DEFAULT_DF,
          minClearance: DEFAULT_MIN_CLEARANCE,
          gmiMin: DEFAULT_GMI_MIN,
          presetKey: '',
          results: [],
          resultsSig: null,
          calcWaterDepth: null
      });

      // v13.12: open the connection to the engine while the user is still filling in inputs, so the first Calculate does not
      // pay DNS + TLS + proxy set-up. v13.15: plain GET (engine v4.12 answers 204 - no solve, no CORS preflight = ONE call;
      // v13.14's OPTIONS made the browser send a second, preflight request). no-cors: the reply is never read.
      let engineWarmed = false;
      // v13.14: per-case result cache. A case is reused when the PHYSICAL inputs (WD, FL, segments, buoys) and its own target
      // are unchanged - e.g. adding one target to "5, 10, 20" sends 1 request instead of 4 (+ Find Max + SWL).
      // Shift+Click / Ctrl+Shift+Enter bypasses it. Kept in memory for this page only (max 300 cases).
      const caseCache = new Map();
      const cacheGet = (k) => caseCache.get(k);
      const cachePut = (k, v) => { if (caseCache.size >= 300) caseCache.delete(caseCache.keys().next().value); caseCache.set(k, v); };
      const warmEngine = () => {
          if (engineWarmed) return; engineWarmed = true;
          try { fetch(WORKER_URL, { method: 'GET', mode: 'no-cors' }).catch(() => { engineWarmed = false; }); } catch (e) { engineWarmed = false; }
      };

      const App = () => {
          const [theme, setTheme] = useState(() => {
              try { const t = localStorage.getItem('slack_theme'); if (t) return t; } catch(e) {}
              return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          });
          const [showGuide, setShowGuide] = useState(false);
          const [sidebarOpen, setSidebarOpen] = useState(false);
          const [configs, setConfigs] = useState([createDefaultConfig(1)]);
          const [activeTabId, setActiveTabId] = useState(1);
          const [calcError, setCalcError] = useState(null);
          const [loading, setLoadingState] = useState(false);
          const loadingRef = useRef(false);
          const setLoading = (v) => { loadingRef.current = v; setLoadingState(v); };


          // v10 M5: toast notification queue
          const [toasts, setToasts] = useState([]);
          const pushToast = (type, message, duration = 3000) => {
              const id = Date.now() + Math.random();
              setToasts(prev => [...prev, { id, type, message }]);
              if (duration > 0) setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), duration);
          };
          const removeToast = (id) => setToasts(prev => prev.filter(t => t.id !== id));

          // v10 M7: confirm dialog state
          const [confirmState, setConfirmState] = useState({ open: false });
          const openConfirm = (opts) => setConfirmState({ open: true, ...opts });
          const closeConfirm = () => setConfirmState({ open: false });

          // v10 M5: prompt dialog state
          const [promptState, setPromptState] = useState({ open: false });
          const openPrompt = (opts) => setPromptState({ open: true, ...opts });
          const closePrompt = () => setPromptState({ open: false });

          const activeConfig = configs.find(c => c.id === activeTabId) || configs[0];

          const updateConfig = (updates) => {
              setConfigs(prev => prev.map(c => c.id === activeTabId ? { ...c, ...updates } : c));
          };
          // Async results must land on the tab that STARTED the calc, not whichever is active now.
          const updateConfigById = (id, updates) => setConfigs(prev => prev.map(c => c.id === id ? { ...c, ...updates } : c));

          // v10 M6: batched update alias (semantic name for preset load / bulk changes)
          const bulkUpdateConfig = (updates) => {
              setConfigs(prev => prev.map(c => c.id === activeTabId ? { ...c, ...updates } : c));
          };

          const projectName = activeConfig.projectName;
          const waterDepth = activeConfig.waterDepth;
          const fairleadElev = activeConfig.fairleadElev;
          const subseaStructuresStr = activeConfig.subseaStructuresStr;
          const segments = activeConfig.segments;
          const buoys = activeConfig.buoys;
          const tensionsStr = activeConfig.tensionsStr;
          const calcMode = activeConfig.calcMode;
          const showMaxTension = activeConfig.showMaxTension;
          const results = activeConfig.results;

          const setProjectName = (val) => updateConfig({ projectName: val });
          const setWaterDepth = (val) => updateConfig({ waterDepth: val });
          const setFairleadElev = (val) => updateConfig({ fairleadElev: val });
          const setSubseaStructuresStr = (val) => updateConfig({ subseaStructuresStr: val });
          const setSegments = (val) => updateConfig({ segments: val });
          const setBuoys = (val) => updateConfig({ buoys: val });
          const setTensionsStr = (val) => updateConfig({ tensionsStr: val });
          const setCalcMode = (val) => updateConfig({ calcMode: val });
          const setShowMaxTension = (val) => updateConfig({ showMaxTension: val });
          const patternType = activeConfig.patternType || 'tender_8pt';
          const setPatternType = (val) => updateConfig({ patternType: val });
          const designFactor = activeConfig.designFactor ?? DEFAULT_DF;
          const minClearance = activeConfig.minClearance ?? DEFAULT_MIN_CLEARANCE;
          const gmiMin = activeConfig.gmiMin ?? DEFAULT_GMI_MIN;
          const setGmiMin = (val) => updateConfig({ gmiMin: val });
          const setMinClearance = (val) => updateConfig({ minClearance: val });
          const activePresetKey = activeConfig.presetKey || '';
          const setDesignFactor = (val) => updateConfig({ designFactor: val });
          const anchorBearings = activeConfig.anchorBearings || PATTERN_TEMPLATES.tender_8pt.map(a => ({...a}));
          const setAnchorBearings = (val) => updateConfig({ anchorBearings: val });
          const [activeView, setActiveView] = useState('profile');
          // v13.13: one SELECTED case shared by chart, top view, tension-offset view and table (click a row / chip / point).
          const [selIdxRaw, setSelIdxRaw] = useState(null);
          const [hoverIdx, setHoverIdx] = useState(null);
          const autoIdx = (() => { let best = -1; results.forEach((r, i) => { if (!r.isMaxTensionCase && !r.isSwlCase && (best < 0 || r.horizontalTension > results[best].horizontalTension)) best = i; }); return best >= 0 ? best : Math.max(0, results.length - 1); })();
          const selIdx = (selIdxRaw !== null && selIdxRaw < results.length) ? selIdxRaw : autoIdx;
          useEffect(() => { setSelIdxRaw(null); setHoverIdx(null); }, [activeTabId, results]);
          // resizable results table (height remembered); the chart takes the rest and never overlaps it
          const [tableH, setTableH] = useState(() => { try { return parseInt(localStorage.getItem('slack_tableH')) || 280; } catch (e) { return 280; } });
          const [tableManual, setTableManual] = useState(() => { try { return localStorage.getItem('slack_tableManual') === '1'; } catch (e) { return false; } });
          const [tableCollapsed, setTableCollapsed] = useState(() => { try { return localStorage.getItem('slack_tableCollapsed') === '1'; } catch (e) { return false; } });
          const splitRef = useRef(null);
          const [splitH, setSplitH] = useState(0);
          useEffect(() => {
              const el = splitRef.current; if (!el || typeof ResizeObserver === 'undefined') return;
              const ro = new ResizeObserver(es => setSplitH(Math.round(es[0].contentRect.height)));
              ro.observe(el); return () => ro.disconnect();
          }, []);
          useEffect(() => { try { localStorage.setItem('slack_tableH', String(tableH)); localStorage.setItem('slack_tableCollapsed', tableCollapsed ? '1' : '0'); localStorage.setItem('slack_tableManual', tableManual ? '1' : '0'); } catch (e) {} }, [tableH, tableCollapsed, tableManual]);
          const clampH = (h) => Math.max(120, Math.min(h, splitH > 0 ? splitH - 260 - 12 : 600));
          // automatic height = every row visible (capped at ~half of the space); once the user drags the bar the chosen height is kept
          const wantH = 38 + 34 + results.length * 33 + 6;
          const tblH = tableCollapsed ? 40 : tableManual ? clampH(tableH) : clampH(Math.min(wantH, splitH > 0 ? Math.round(splitH * 0.52) : wantH));
          const startDrag = (e) => {
              e.preventDefault(); const y0 = e.clientY, h0 = tblH; setTableManual(true); setTableCollapsed(false);
              const mv = (ev) => setTableH(clampH(h0 + (y0 - ev.clientY)));
              const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };

          const handleCalculate = async (isRetry = false, force = false, overrides = {}) => {
              if (loadingRef.current) return;   // v13.17 F1

              const tabId = activeConfig.id;

              const rawTargets = tensionsStr.split(',').map(s => s.trim()).filter(Boolean);

              if (ignored.length) pushToast('warning', `Ignored target(s): ${ignored.join(', ')} - ${calcMode === 'offset' ? 'offsets must be >= 0' : 'tensions must be > 0'}.`, 6000);
              const inputs = rawTargets.map(s => parseFloat(s)).filter(n => !isNaN(n) && (n > 0 || (calcMode === 'offset' && n === 0))).sort((a, b) => a - b);
              // v10: de-duplicate targets (B3 fix from deep review)
              const dedupInputs = inputs.filter((v, i, arr) => arr.indexOf(v) === i);
              if (dedupInputs.length === 0 && !showMaxTension) return;

              const payload = {
                  waterDepth: parseFloat(waterDepth),

                  segments: processedSegments,
                  buoys: buoys.map((b, buoyIndex) => ({
                      ...b,
                      buoyId: String(b.id),

                  targets: dedupInputs,

              // Cloudflare Workers Free = 10 ms CPU per request. A batched request (4-6 targets + Find Max) measured
              // 21-32 ms CPU on the dashboard; per-target requests are 1-10x smaller. Results are identical (tension mode:
              // every target is solved independently - verified 6,300/6,300 identical vs the batched v4.8 response).
              // No automatic retry: a CPU-killed request comes back as "Failed to fetch" and retrying re-burns the CPU.
              // v13.12: a timeout is NOT a CPU kill (that returns at once as "Failed to fetch"). Dashboard showed 0 errors
              // and ~20 ms wall time while the first click timed out at 20 s -> the delay is on the network path
              // (proxy / first TLS connection). So: 12 s per attempt and ONE automatic retry for timeouts only.
              const EXPECTED_ENGINE = 'v4.14';
              const TIMEOUT_MS = [12000, 15000];
              const jobs = dedupInputs.map(t => ({ ...payload, targets: [t], calculateMax: false }));
              if (showMaxTension) jobs.push({ ...payload, targets: [], calculateMax: true });
              // v13.18: key on the fields the engine actually uses (id / MBL / diameter / manual flags do not change the solution),
              // so editing MBL or the Design factor re-solves only the (SWL) case.
              const nz = (v) => (v === '' || v === undefined || v === null) ? '' : Number(v);
              const physKey = JSON.stringify([payload.waterDepth, payload.targetZ,
                  payload.segments.map(sg => [sg.type, nz(sg.length), nz(sg.w), nz(sg.w_wet), nz(sg.EA), nz(sg.frictionCoeff)]),
                  payload.buoys.map(b => [b.distanceFromAnchor, b.netBuoyancy, b.pennantLength, b.pennantWeight, b.pennantLoad, b.height])]);
              const jobKey = (b) => physKey + '|' + b.calcMode + '|' + (b.calculateMax ? 'MAX' : b.targets.join(','));

              const runJob = async (body) => {
                  const key = jobKey(body);
                  if (!force) { const hit = cacheGet(key); if (hit) { nCached++; return hit; } }

                  const controller = new AbortController();

                          headers: { "Content-Type": "text/plain;charset=UTF-8" },   // simple request: no CORS preflight
                          body: JSON.stringify(body),

                          e.partial = Array.isArray(errData.partialResults) ? errData.partialResults : null;

              });

                  pushToast('warning', `Engine ${engineSeen} - this page expects ${EXPECTED_ENGINE}. Reload the page or redeploy the Worker.`, 8000);
              if (failed.length === jobs.length) {

              // v13.13: extra case AT SWL (tension solved so that the fairlead tension equals SWL = MBL/DF) - the real operating

              // 1-5 small extra requests; silently skipped if anything fails or SWL is outside the calculated range.
              if (calcMode === 'tension' && merged.length) {

                      const mb = mblSummary(segments), dfv = parseFloat(cfg.designFactor) > 0 ? parseFloat(cfg.designFactor) : DEFAULT_DF;

                          let lo = null, hi = null;
                          [...reg, ...(mx ? [mx] : [])].sort((a, b) => a.horizontalTension - b.horizontalTension).forEach(r => { if (r.fairleadTension <= goal) lo = r; else if (!hi) hi = r; });
                          const already = merged.some(r => !r.isMaxTensionCase && Math.abs(r.fairleadTension - swl) < 0.01 * swl);
                          if (lo && hi && !already) {
                              let found = null;
                              // v13.14: ONE request - engine v4.11 solves H for a target fairlead tension, seeded with the
                              // bracket the page already has (flHint). Older engines answer 400 -> secant below (1-5 requests).
                              try {
                                  const r = (await runJob({ ...payload, calcMode: 'fltension', targets: [Math.round(goal * 1000) / 1000], calculateMax: false,
                                                            flHint: [[lo.horizontalTension, lo.fairleadTension], [hi.horizontalTension, hi.fairleadTension]] }))[0];
                                  if (r && r.fairleadTension > 0.99 * swl && r.fairleadTension <= swl) found = r;
                              } catch (e) { /* old engine - fall back */ }
                              for (let it = 0; it < 5 && !found; it++) {
                                  const hG = Math.round((lo.horizontalTension + (goal - lo.fairleadTension) * (hi.horizontalTension - lo.horizontalTension) / (hi.fairleadTension - lo.fairleadTension)) * 1000) / 1000;
                                  if (!(hG > lo.horizontalTension + 1e-3 && hG < hi.horizontalTension - 1e-3)) break;
                                  const r = (await runJob({ ...payload, targets: [hG], calculateMax: false }))[0];
                                  if (!r) break;
                                  if (r.fairleadTension > 0.99 * swl && r.fairleadTension <= swl) found = r;
                                  else if (r.fairleadTension <= goal) lo = r; else hi = r;
                              }
                              if (found) merged.push({ ...found, isSwlCase: true });
                          }
                      }
                  } catch (e) { /* SWL case is optional */ }
                  merged.sort((a, b) => (a.isMaxTensionCase ? 1 : 0) - (b.isMaxTensionCase ? 1 : 0) || a.horizontalTension - b.horizontalTension);
              }
              // complete result -> cached signature; partial -> no signature (shows "outdated", Recalculate re-runs)
              updateConfigById(tabId, { results: merged, resultsSig: failed.length ? null : sig, calcWaterDepth: parseFloat(waterDepth), engineVersion: engineSeen || cfg.engineVersion || '' });
              setLoading(false);
              if (nCached && !failed.length) pushToast('info', `${nSent} case${nSent === 1 ? '' : 's'} sent to the engine, ${nCached} reused (inputs unchanged). Shift+Click to recompute all.`, 6000);
              if (failed.length) {
                  const cls = classifyError(failed[0].err);
                  pushToast('warning', `${failed.length} of ${jobs.length} cases failed (${failed.map(f => f.label).join(', ')}): ${cls.title}. Press Recalculate to retry.`, 9000);
              } else if (isRetry) pushToast('success', 'Calculation succeeded on retry');
          };

          // v13 C7: no auto-calc on load / new tab - the engine is only called on explicit Calculate.
          const isStale = (results || []).length > 0 && activeConfig.resultsSig !== solverSig(activeConfig) && activeConfig.resultsSig !== '__imported__';

          // Ctrl/Cmd+Enter = Calculate (U8)
          const calcRef = useRef(null);
          const flushRef = useRef(null);
          calcRef.current = handleCalculate;
          useEffect(() => {
              const onKey = (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); calcRef.current(false, e.shiftKey, flushRef.current ? flushRef.current() : {}); } };
              window.addEventListener('keydown', onKey);
              return () => window.removeEventListener('keydown', onKey);
          }, []);

          const structures = useMemo(() => {
              if (!subseaStructuresStr) return [];
              return parseStructDists(subseaStructuresStr);
          }, [subseaStructuresStr]);

          const statusCtx = useMemo(() => {
              const dfv = parseFloat(designFactor) > 0 ? parseFloat(designFactor) : DEFAULT_DF;
              const mc = parseFloat(minClearance);
              return { ...mblSummary(segments), df: dfv, structures, minClearance: isNaN(mc) ? DEFAULT_MIN_CLEARANCE : mc,
                       gmi: (gmiMin !== '' && Number(gmiMin) >= 0) ? Number(gmiMin) : DEFAULT_GMI_MIN,
                       waterDepth: parseFloat(activeConfig.calcWaterDepth ?? waterDepth) || 0 };
          }, [segments, designFactor, minClearance, gmiMin, structures, activeConfig.calcWaterDepth, waterDepth]);

          const bgClass = theme === 'dark' ? 'bg-gray-950 text-gray-100' : 'bg-gray-50 text-gray-800';
          const sidebarBorder = theme === 'dark' ? 'border-gray-800' : 'border-gray-200';
          const sidebarBg = theme === 'dark' ? 'bg-gray-900' : 'bg-white';

          return (
              /* ROOT CONTAINER USING DVH - OPTION 2 */
              <div className={`flex h-[100dvh] w-screen overflow-hidden font-sans selection:bg-accent-500/30 ${bgClass}`}>
                  {showGuide && <UserGuideModal onClose={() => setShowGuide(false)} />}
                  {/* v10 M5+M7: Toast + Confirm + Prompt dialogs */}
                  <Toast toasts={toasts} removeToast={removeToast} />
                  <ConfirmDialog {...confirmState} onCancel={() => { if (confirmState.onCancel) confirmState.onCancel(); closeConfirm(); }} onConfirm={() => { if (confirmState.onConfirm) confirmState.onConfirm(); closeConfirm(); }} />
                  <PromptDialog {...promptState} onCancel={() => { if (promptState.onCancel) promptState.onCancel(); closePrompt(); }} onConfirm={(v) => { if (promptState.onConfirm) promptState.onConfirm(v); closePrompt(); }} />
                  
                  {sidebarOpen && (<div className="fixed inset-0 bg-black/60 z-20 lg:hidden" onClick={() => setSidebarOpen(false)} aria-hidden="true"/>)}
                  <div className={`fixed lg:relative inset-y-0 left-0 w-[360px] max-w-[100vw] flex-shrink-0 border-r ${sidebarBorder} h-full ${sidebarBg} flex flex-col transition-transform duration-300 z-30 lg:z-20 lg:translate-x-0 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                      <div className={`px-3 pt-3 pb-2 border-b ${sidebarBorder}`}>
                          {/* v13.11: brand row + separate labelled toolbar (the old single row overlapped the title) */}
                          <div className="flex items-center gap-2.5">
                              <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-accent-400 to-accent-600 flex items-center justify-center shadow-soft shrink-0">
                                  <IconAnchor size={17} className="text-white dark:text-gray-950" strokeWidth={2.4}/>
                              </div>
                              <h1 className="flex-1 min-w-0 leading-tight">
                                  <span className="block text-lg font-bold tracking-[0.14em] text-gray-800 dark:text-gray-100">SLACK</span>
                                  <span className="block text-[11px] text-gray-500 dark:text-gray-400 truncate">Catenary Analysis · {APP_VERSION}</span>
                              </h1>
                              <button onClick={() => setShowGuide(true)} aria-label="Open user guide" className="p-1.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500" title="Guide"><IconHelp size={16} aria-hidden="true"/></button>
                              <button onClick={toggleTheme} aria-label={`Switch to ${theme === 'dark' ? 'light' : 'dark'} theme`} className="p-1.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500" title="Theme">{theme === 'dark' ? <IconSun size={16} aria-hidden="true"/> : <IconMoon size={16} aria-hidden="true"/>}</button>
                          </div>
                          <div className="mt-2 flex items-center gap-1 text-[11px] font-semibold">
                              {(() => { const tb = "flex items-center gap-1 px-1.5 py-1 rounded border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-accent-600"; return (<>
                                  <button onClick={() => fileInputRef.current.click()} aria-label="Import JSON configuration" className={tb} title="Open a saved .json setup"><IconImport size={12} aria-hidden="true"/>Open</button>
                                  <button onClick={exportToJson} aria-label="Export current configuration as JSON" className={tb} title="Save setup + results as .json"><IconExport size={12} aria-hidden="true"/>JSON</button>
                                  <span className="mx-0.5 h-4 border-l border-gray-200 dark:border-gray-700" aria-hidden="true"></span>
                                  <span className="text-[10px] uppercase text-gray-400 tracking-wider">Export</span>
                                  <button onClick={exportToCsv} aria-label="Export results as CSV" className={tb} title="Results table as CSV">CSV</button>
                                  <button onClick={exportPng} aria-label="Export current view as PNG" className={tb} title="Current view (profile or top view) as PNG">PNG</button>
                                  <button onClick={exportPdf} aria-label="Create PDF report" className={tb} title="Report (chart + results + inputs) - print dialog, choose Save as PDF">PDF</button>
                              </>); })()}
                              <input type="file" ref={fileInputRef} onChange={handleImport} className="hidden" accept=".json" aria-label="JSON file input"/>
                          </div>
                      </div>
                      <div className="flex-1 overflow-hidden px-3 pt-2 pb-3">
                          <InputPanel
                              key={activeTabId}
                              flushRef={flushRef}
                              waterDepth={waterDepth} setWaterDepth={setWaterDepth}
                              fairleadElev={fairleadElev} setFairleadElev={setFairleadElev}
                              segments={segments} setSegments={setSegments}
                              buoys={buoys} setBuoys={setBuoys}
                              tensions={tensionsStr} setTensions={setTensionsStr}
                              calculate={(e, ov) => handleCalculate(false, !!(e && e.shiftKey), ov || {})} loading={loading}
                              isUpToDate={(results || []).length > 0 && !isStale}
                              showMaxTension={showMaxTension} setShowMaxTension={setShowMaxTension}
                              subseaStructures={subseaStructuresStr} setSubseaStructures={setSubseaStructuresStr}
                              calcMode={calcMode} setCalcMode={(m) => {
                                  if (m === calcMode) return;
                                  // v13.1 B20: keep each mode's own target list
                                  const saved = activeConfig[`targets_${m}`];
                                  updateConfig({ calcMode: m, [`targets_${calcMode}`]: tensionsStr });
                                  if (saved) { setTensionsStr(saved); return; }
                                  if (m === 'offset') {
                                      // v11: pre-fill 95% of the PHYSICAL max sqrt(L^2 - vSpan^2). Pre-filling the
                                      // full payout always exceeded the worker limit -> guaranteed 400 on first click.
                                      const totalLen = segments.reduce((acc, s) => acc + (typeof s.length === 'string' ? parseFloat(s.length) : s.length), 0);
                                      const vSpan = Math.abs(safeFloat(waterDepth) - (-1 * safeFloat(fairleadElev)));
                                      const maxOff = Math.sqrt(Math.max(0, totalLen * totalLen - vSpan * vSpan));
                                      setTensionsStr((maxOff * 0.95).toFixed(1));
                                  } else {
                                      setTensionsStr(FLEET_PRESETS[activePresetKey]?.tensionsStr || "5, 20, 40");
                                  }
                              }}
                              projectName={projectName} setProjectName={setProjectName}
                              patternType={patternType} setPatternType={setPatternType}
                              designFactor={designFactor} setDesignFactor={setDesignFactor}
                              minClearance={minClearance} setMinClearance={setMinClearance}
                              gmiMin={gmiMin} setGmiMin={setGmiMin}
                              anchorBearings={anchorBearings} setAnchorBearings={setAnchorBearings}
                              activePresetKey={activePresetKey} presetSig={activeConfig.presetSig}
                              bulkUpdateConfig={bulkUpdateConfig}
                              pushToast={pushToast}
                              openConfirm={openConfirm}
                              openPrompt={openPrompt}
                          />
                      </div>
                  </div>

                  <div className={`flex-1 min-w-0 flex flex-col p-4 h-full overflow-hidden relative ${theme === 'dark' ? 'bg-gray-950' : 'bg-gray-50'}`}>
                      <div className="absolute inset-0 opacity-[0.03] pointer-events-none" style={{backgroundImage: 'linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px)', backgroundSize: '40px 40px'}}></div>
                      <div className="relative z-10 h-full flex flex-col gap-2 min-h-0">
                          <div className="flex gap-2 border-b border-gray-200 dark:border-gray-800 pb-0 items-end">
                              <button onClick={() => setSidebarOpen(true)} aria-label="Open configuration panel" title="Configuration" className="lg:hidden px-3 py-2 mb-1 text-gray-500 hover:text-accent-500 transition-colors">
                                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
                              </button>
                              {configs.map(c => (
                                  <div key={c.id} onClick={() => { setActiveTabId(c.id); /* v8: no auto-calc on tab switch - existing results shown as-is, empty tabs stay empty until user clicks Calculate */ }} className={`cursor-pointer px-4 py-2 rounded-t-lg text-sm font-bold transition-colors ${activeTabId === c.id ? (theme === 'dark' ? 'bg-gray-950 text-accent-400 border-t-2 border-l border-r border-gray-800 border-t-accent-500 relative top-[1px]' : 'bg-white text-accent-600 border-t-2 border-l border-r border-gray-200 border-t-accent-600 relative top-[1px] shadow-sm') : (theme === 'dark' ? 'bg-gray-900/50 text-gray-500 hover:bg-gray-800 hover:text-gray-300' : 'bg-gray-200/50 text-gray-500 hover:bg-white hover:text-gray-700')}`}>
                                      {c.projectName}
                                      {configs.length > 1 && (
                                          <button onClick={(e) => { e.stopPropagation(); setConfigs(configs.filter(config => config.id !== c.id)); if (activeTabId === c.id) { setActiveTabId(configs.find(config => config.id !== c.id).id); } }} className="ml-2 text-gray-400 hover:text-red-500 rounded-full hover:bg-white/20 p-0.5" title="Close Tab">✕</button>
                                      )}
                                  </div>
                              ))}
                              <button onClick={() => { const newId = Math.max(0, ...configs.map(c => c.id)) + 1; setConfigs([...configs, createDefaultConfig(newId)]); setActiveTabId(newId); }} className="px-3 py-2 text-gray-500 hover:text-accent-500 transition-colors self-end mb-1" title="New Tab"><IconPlus size={18} /></button>
                          </div>
                      
                          {/* v10 M1: structured error banner with Retry button */}
                          {calcError && <ErrorBanner error={calcError} onClose={() => setCalcError(null)} onRetry={() => { setCalcError(null); handleCalculate(true, false, flushRef.current ? flushRef.current() : {}); }} />}
                          {isStale && (
                              <div role="status" className="flex items-center gap-3 px-3 py-2 rounded-lg border border-warn-600/40 dark:border-warn-400/40 bg-warn-600/10 dark:bg-warn-400/10 text-warn-600 dark:text-warn-400 text-xs">
                                  <IconWarning size={14} aria-hidden="true"/>
                                  <span className="flex-1"><b>Inputs changed</b> - chart and table show the previous calculation.</span>
                                  <button onClick={() => handleCalculate(false, false, flushRef.current ? flushRef.current() : {})} disabled={loading} className="px-2 py-1 rounded bg-warn-600 dark:bg-warn-400 text-white dark:text-gray-950 font-bold disabled:opacity-50">Recalculate</button>
                              </div>
                          )}
                          {/* v13.13: three views; chart area and results table share the height without overlapping */}
                          <div className="flex gap-1 mb-0.5" role="tablist" aria-label="View">
                              {[['profile', 'Catenary Profile'], ['topview', 'Top View (Plan)'], ['curve', 'Tension – Offset']].map(([k, l]) => (
                                  <button key={k} role="tab" aria-selected={activeView === k} onClick={() => setActiveView(k)} className={`text-[11px] font-bold uppercase tracking-wider px-3 py-1.5 rounded transition-colors ${activeView === k ? 'bg-accent-600 text-white' : (theme === 'dark' ? 'bg-gray-800 text-gray-400 hover:bg-gray-700' : 'bg-gray-200 text-gray-500 hover:bg-gray-300')}`}>{l}</button>
                              ))}
                          </div>
                          <div ref={splitRef} className="flex-1 min-h-0 flex flex-col">
                              <div ref={viewRef} className="flex-1 min-h-[240px] flex flex-col">
                              {activeView === 'profile'
                                  ? <ChartPanel configs={configs} activeConfigId={activeTabId} structures={structures} theme={theme} statusCtx={statusCtx} selIdx={selIdx} hoverIdx={hoverIdx} />
                                  : activeView === 'topview'
                                  ? <TopViewPanel configs={configs} activeConfigId={activeTabId} theme={theme} patternType={patternType} anchorBearings={anchorBearings} setAnchorBearings={setAnchorBearings} setPattern={(t) => updateConfig({ patternType: t, anchorBearings: (PATTERN_TEMPLATES[t] || []).map(a => ({ ...a })) })} statusCtx={statusCtx} selIdx={selIdx} setSelIdx={setSelIdxRaw} />
                                  : <CurvePanel configs={configs} activeConfigId={activeTabId} theme={theme} statusCtx={statusCtx} selIdx={selIdx} setSelIdx={setSelIdxRaw} />}
                              </div>
                              <div role="separator" aria-orientation="horizontal" aria-label="Resize results table (drag, arrow keys, double-click to collapse)" tabIndex={0}
                                   onPointerDown={startDrag} onDoubleClick={() => setTableCollapsed(c => !c)}
                                   onKeyDown={(e) => { if (e.key === 'ArrowUp') { e.preventDefault(); setTableManual(true); setTableCollapsed(false); setTableH(clampH(tblH + 24)); } if (e.key === 'ArrowDown') { e.preventDefault(); setTableManual(true); setTableH(clampH(tblH - 24)); } }}
                                   className="h-3 shrink-0 cursor-row-resize group flex items-center justify-center touch-none">
                                  <span className="w-14 h-1 rounded bg-gray-300 dark:bg-gray-700 group-hover:bg-accent-500 group-focus-visible:bg-accent-500"></span>
                              </div>
                              <div style={{ height: tblH }} className="shrink-0 min-h-0">
                                  <ResultsTable results={results} buoys={buoys} segments={segments} theme={theme} statusCtx={statusCtx} isStale={isStale} selIdx={selIdx} setSelIdx={setSelIdxRaw} setHoverIdx={setHoverIdx} collapsed={tableCollapsed} setCollapsed={setTableCollapsed} />
                              </div>
                          </div>
                      </div>
                  </div>
              </div>
          );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
    <!-- Cloudflare Web Analytics (v13.14: skipped when opened from file://, origin null is rejected by the beacon) --><script>if (location.protocol !== 'file:') { const s = document.createElement('script'); s.type = 'module'; s.src = 'https://static.cloudflareinsights.com/beacon.min.js'; s.setAttribute('data-cf-beacon', '{"token": "03caaaf2ed8a44f1ab64db56724afd7a"}'); document.body.appendChild(s); }</script><!-- End Cloudflare Web Analytics -->
  </body>
</html>
