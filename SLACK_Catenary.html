  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;
      
      const { 
        ScatterChart, Scatter, XAxis, YAxis, CartesianGrid, 
        Tooltip, ResponsiveContainer, ReferenceLine 
      } = window.Recharts;

      // v13: CHAIN kept as the studlink key for back-compat with saved/imported setups.
      const SegmentType = { WIRE: 'WIRE', CHAIN: 'CHAIN', CHAIN_STUDLESS: 'CHAIN_STUDLESS', FIBER: 'FIBER' };
      const isChainType = (t) => t === SegmentType.CHAIN || t === SegmentType.CHAIN_STUDLESS;

      const SEAWATER_DENSITY = 1025;
      const MATERIAL_DENSITIES = {
          [SegmentType.WIRE]: 7850, [SegmentType.CHAIN]: 7850,
          [SegmentType.CHAIN_STUDLESS]: 7850, [SegmentType.FIBER]: 1380
      };

      // ============================================================
      // v13 GENERIC MATERIAL MODEL (no vendor certificates available).
      // d = nominal diameter in mm. Coefficients converted from the Orcina OrcaFlex
      // line-type wizard catalogue fits (d in m there):
      //   Wire 6-strand IWRC : m = 3.9897 d^2 te/m, EA = 4.04e7 d^2 kN, MBL = 633358 d^2 kN
      //   Chain studlink     : m = 21.9 d^2 te/m,   EA = 1.01e8 d^2 kN
      //   Chain studless     : m = 19.9 d^2 te/m,   EA = 0.854e8 d^2 kN
      //   Chain MBL (R3)     : 1.96e4 d^2 (44 - 80 d) kN  (studlink = studless)
      //   Polyester          : m = 0.7978 d^2 te/m, EA = 1.09e6 d^2 kN (linear), MBL = 170466 d^2 kN
      // Friction (static, commonly cited API RP 2SK values for soft clay seabeds such as the
      // Gulf of Thailand): wire 0.6, chain 1.0. Fiber 0.6 assumed. First estimates only -
      // override with supplier data when available.
      // ============================================================
      const KN_PER_T = 9.80665;
      const MATERIAL = {
          [SegmentType.WIRE]:           { label: 'Wire (6-strand IWRC)', mass: 0.0039897, ea: 40.4, mu: 0.6,
                                          mbl: d => 0.633358 * d * d / KN_PER_T },
          [SegmentType.CHAIN]:          { label: 'Chain (Studlink, R3)', mass: 0.0219,    ea: 101,  mu: 1.0,
                                          mbl: d => 0.0196 * d * d * (44 - 0.08 * d) / KN_PER_T },
          [SegmentType.CHAIN_STUDLESS]: { label: 'Chain (Studless, R3)', mass: 0.0199,    ea: 85.4, mu: 1.0,
                                          mbl: d => 0.0196 * d * d * (44 - 0.08 * d) / KN_PER_T },
          [SegmentType.FIBER]:          { label: 'Fiber (Polyester, linear EA)', mass: 0.0007978, ea: 1.09, mu: 0.6,
                                          mbl: d => 0.170466 * d * d / KN_PER_T }
      };
      const matOf = (t) => MATERIAL[t] || MATERIAL[SegmentType.WIRE];
      const DEFAULT_DIA = { [SegmentType.WIRE]: 64, [SegmentType.CHAIN]: 76, [SegmentType.CHAIN_STUDLESS]: 76, [SegmentType.FIBER]: 100 };
      const autoW   = (t, d) => d > 0 ? parseFloat((matOf(t).mass * d * d).toFixed(2)) : '';
      const autoEA  = (t, d) => d > 0 ? Math.round(matOf(t).ea * d * d) : '';
      const autoMBL = (t, d) => d > 0 ? Math.round(matOf(t).mbl(d)) : '';
      const wetFactor = (t) => { const rho = MATERIAL_DENSITIES[t] || 7850; return (rho - SEAWATER_DENSITY) / rho; };

      // Non-manual properties are always derived from (type, diameter).
      const deriveSegment = (seg) => {
          const d = parseFloat(seg.diameter) || 0;
          const out = { ...seg };
          if (!out.isWeightManual) out.w = autoW(out.type, d);
          if (!out.isEAManual)     out.EA = autoEA(out.type, d);
          if (!out.isMBLManual)    out.mbl = autoMBL(out.type, d);
          if (out.frictionCoeff === undefined || out.frictionCoeff === '') out.frictionCoeff = matOf(out.type).mu;
          return out;
      };
      const makeSegment = (type, diameter, length, extra = {}) => deriveSegment({
          id: makeClientId('seg'), type, diameter, length, w_wet: '', frictionCoeff: matOf(type).mu,
          isWeightManual: false, isEAManual: false, isMBLManual: false, ...extra
      });

      // Standard sizes generated from the same formulas, so the table always equals auto-fill (B4).
      const SIZE_STANDARDS = {
          [SegmentType.WIRE]:           [[38, 'Jackup'], [44, 'Pennant'], [52, 'NVT/KMT'], [64, 'ED / Vantris / EWB400'], [76, '']],
          [SegmentType.CHAIN]:          [[38, ''], [52, 'KMT ext'], [64, ''], [76, 'ED/Vantris insert']],
          [SegmentType.CHAIN_STUDLESS]: [[38, ''], [51, 'EWB300 ground'], [64, ''], [76, '']],
          [SegmentType.FIBER]:          [[80, ''], [100, ''], [120, '']]
      };
      const sizeLabel = (t, d, note) => `${d} mm${note ? ' - ' + note : ''} · ${autoW(t, d)} kg/m · MBL ~${autoMBL(t, d)} t`;

      // Pennant: submerged weight from pennant wire diameter x length (6-strand IWRC generic).
      const DEFAULT_PENNANT_DIA = 44;
      const pennantWeightT = (lenM, diaMm) => {
          const L = parseFloat(lenM) || 0, d = parseFloat(diaMm) || 0;
          if (L <= 0 || d <= 0) return 0;
          return parseFloat((L * autoW(SegmentType.WIRE, d) * wetFactor(SegmentType.WIRE) / 1000).toFixed(3));
      };

      // Defaults: API RP 2SK intact quasi-static safety factor = 2.0 (editable per tab).
      const DEFAULT_DF = 2.0;
      const DEFAULT_MIN_CLEARANCE = 20;   // m, minimum line height above a subsea structure (editable)

      // Smart tension suggestions per fleet class
      const TENSION_PROFILES = {
          JACKUP: '5, 10, 15',
          TENDER_LARGE: '5, 10, 20, 40',
          AWB_SMALL: '3, 5, 20, 35'
      };

      // NEW v6: Default anchor bearings per pattern type
      const PATTERN_TEMPLATES = {
          tender_8pt: [
              { name: 'P1', bearing: 315 }, { name: 'P2', bearing: 285 },
              { name: 'P3', bearing: 255 }, { name: 'P4', bearing: 225 },
              { name: 'S4', bearing: 135 }, { name: 'S3', bearing: 105 },
              { name: 'S2', bearing: 75  }, { name: 'S1', bearing: 45  }
          ],
          jackup_4pt: [
              { name: 'A1', bearing: 45  }, { name: 'A2', bearing: 135 },
              { name: 'A3', bearing: 225 }, { name: 'A4', bearing: 315 }
          ]
      };

      // One-click fleet presets. v13: geometry only - line/pennant properties come from the generic material model.
      const FLEET_PRESETS = {
          'ED_TENDER': {
              short: 'ED Tender', label: 'ED1/ED2 EDrill/Vantris Tender - 64mm wire + 76mm chain + MLB',
              category: 'TENDER',
              projectName: 'ED_AWP', waterDepth: 77.8, fairleadElev: '3', subseaStructuresStr: '150',
              tensionsStr: TENSION_PROFILES.TENDER_LARGE, calcMode: 'tension', showMaxTension: true,
              patternType: 'tender_8pt',
              segments: [
                  { type: SegmentType.WIRE, length: 1445, diameter: 64 },
                  { type: SegmentType.CHAIN, length: 55, diameter: 76 }
              ],
              buoys: [ { distanceFromAnchor: 900, netBuoyancy: 10, pennantLength: 25, pennantDiameter: 44, pennantLoad: 0.05, height: 2.5 } ]
          },
          'NVT': {
              short: 'NVT AWB', label: 'NVT (Nava Thanee) AWB - 52mm/7t Anchor',
              category: 'AWB',
              projectName: 'NVT_WP', waterDepth: 76.1, fairleadElev: '3', subseaStructuresStr: '',
              tensionsStr: TENSION_PROFILES.AWB_SMALL, calcMode: 'tension', showMaxTension: true,
              patternType: 'tender_8pt',
              segments: [
                  { type: SegmentType.WIRE, length: 1280, diameter: 52 }
              ],
              buoys: [ { distanceFromAnchor: 850, netBuoyancy: 10, pennantLength: 40, pennantDiameter: 44, pennantLoad: 0.05, height: 2.5 } ]
          },
          'KMT': {
              short: 'KMT AWB', label: 'KMT (Kamala Thanee) AWB - 52mm + Ext + DP Buoy',
              category: 'AWB',
              projectName: 'KMT_WP', waterDepth: 78.7, fairleadElev: '3', subseaStructuresStr: '',
              tensionsStr: TENSION_PROFILES.AWB_SMALL, calcMode: 'tension', showMaxTension: true,
              patternType: 'tender_8pt',
              segments: [
                  { type: SegmentType.WIRE, length: 1200, diameter: 52 },
                  { type: SegmentType.CHAIN, length: 50, diameter: 52 }
              ],
              buoys: [ { distanceFromAnchor: 551, netBuoyancy: 6, pennantLength: 35, pennantDiameter: 44, pennantLoad: 0.05, height: 2.0 } ]
          },
          'EWB400': {
              short: 'EWB400 AWB', label: 'EWB400 AWB 120m - 64mm + Piggyback + MLB',
              category: 'AWB',
              projectName: 'EWB400_WP01', waterDepth: 78.7, fairleadElev: '3', subseaStructuresStr: '150',
              tensionsStr: TENSION_PROFILES.TENDER_LARGE, calcMode: 'tension', showMaxTension: true,
              patternType: 'tender_8pt',
              segments: [
                  { type: SegmentType.WIRE, length: 1080, diameter: 64 },
                  { type: SegmentType.WIRE, length: 120, diameter: 64 }
              ],
              buoys: [ { distanceFromAnchor: 850, netBuoyancy: 10, pennantLength: 35, pennantDiameter: 44, pennantLoad: 0.05, height: 2.5 } ]
          },
          'JACKUP': {
              short: 'Jackup 4-pt', label: 'Jackup AHT positioning - 1.5" (38mm) wire, 4-point',
              category: 'JACKUP',
              projectName: 'Jackup', waterDepth: 75.0, fairleadElev: '3', subseaStructuresStr: '',
              tensionsStr: TENSION_PROFILES.JACKUP, calcMode: 'tension', showMaxTension: true,
              patternType: 'jackup_4pt',
              segments: [
                  { type: SegmentType.WIRE, length: 700, diameter: 38 }
              ],
              buoys: []
          }
      };

      // v12: theme-AWARE series palette. A single shared palette cannot serve both grounds -
      // forcing one set to clear 4.5:1 on #1C2839 and 3:1 on #FFFFFF drives every hue toward
      // mud. Two tuned sets instead: vivid on dark, deep on light. Measured minimum contrast
      // is 5.36:1 (dark) and 5.27:1 (light) across all seven series including Find Max.
      const SERIES = {
          dark:  ['#38A9F5', '#3DD68C', '#F5A524', '#FF6B6B', '#B68CFF', '#FF79C6'],
          light: ['#0F6FB8', '#0A7A47', '#B02626', '#0E7490', '#B32473', '#4D5B0E']   // v13: no amber/brown - reserved for pennant, rig, MLB
      };
      const MAX_CASE_COLOR = { dark: '#C77DFF', light: '#7C3AED' };
      const seriesColor = (i, isDark) => {
          const p = isDark ? SERIES.dark : SERIES.light;
          return p[i % p.length];
      };
      const maxCaseColor = (isDark) => isDark ? MAX_CASE_COLOR.dark : MAX_CASE_COLOR.light;
      // Back-compat alias for any remaining reference.
      const COLORS = SERIES.dark;

      const safeFloat = (val, defaultVal = 0) => {
          if (typeof val === 'number') return val;
          if (val === undefined || val === null) return defaultVal;
          const num = parseFloat(val);
          return isNaN(num) ? defaultVal : num;
      };
      // Stable client IDs prevent collisions when Add/Duplicate is clicked rapidly.
      const makeClientId = (prefix) => {
          if (globalThis.crypto?.randomUUID) return `${prefix}-${globalThis.crypto.randomUUID()}`;
          return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      };
      // Resolve a result buoy back to the configured buoy order. The result-point array
      // is geometric order and must not be used as the displayed buoy ID.
      const getBuoyDisplayNumber = (point, configuredBuoys, fallbackIndex) => {
          const rawIndex = point?.buoyIndex ?? point?.sourceBuoyIndex;
          if (Number.isInteger(Number(rawIndex))) return Number(rawIndex) + 1;
          const rawId = point?.buoyId ?? point?.sourceBuoyId ?? point?.inputBuoyId;
          if (rawId !== undefined && rawId !== null) {
              const configuredIndex = configuredBuoys.findIndex(b => String(b.id) === String(rawId));
              if (configuredIndex >= 0) return configuredIndex + 1;
              const numericId = Number(rawId);
              if (Number.isInteger(numericId) && numericId >= 1) return numericId;
          }
          const resultDist = safeFloat(point?.distanceFromAnchor, NaN);
          if (Number.isFinite(resultDist)) {
              const configuredIndex = configuredBuoys.findIndex(b =>
                  Math.abs(safeFloat(b.distanceFromAnchor, NaN) - resultDist) < 1e-6
              );
              if (configuredIndex >= 0) return configuredIndex + 1;
          }
          return fallbackIndex + 1;
      };

      // ============================================================
      // v13 shared result helpers - ONE source of truth for table, chart, top view and CSV.
      // ============================================================
      // Buoy level: same thresholds everywhere (A9).
      const buoyLevel = (u, isSlack) => isSlack ? 'slack' : u >= 0.999 ? 'sub' : u >= 0.85 ? 'bad' : u >= 0.5 ? 'warn' : 'ok';
      const BUOY_FILL = {
          dark:  { ok: '#3DD68C', warn: '#F5A524', bad: '#FF5C5C', sub: '#FF5C5C', slack: '#7286A0' },
          light: { ok: '#0D884F', warn: '#A85D00', bad: '#C42B2B', sub: '#C42B2B', slack: '#7286A0' }
      };
      const buoyPoints = (res) => (res?.points || []).filter(p => p.isBuoy);

      // Weakest-link MBL over segments that HAVE an MBL; also report unchecked segments (A15).
      const mblSummary = (segments) => {
          let min = Infinity, minIdx = -1; const missing = [];
          (segments || []).forEach((s, i) => {
              const m = parseFloat(s.mbl);
              if (m > 0) { if (m < min) { min = m; minIdx = i; } } else missing.push(i + 1);
          });
          return { minMBL: min, minIdx, hasMBL: isFinite(min), missing };
      };

      // Height of the line above the seabed at a horizontal distance from the fairlead (A14).
      const clearanceAt = (res, distFromFL, wd) => {
          const pts = res?.points || [];
          if (!pts.length || !(res.fairleadX > 0)) return null;
          const xa = res.fairleadX - distFromFL;              // worker x is measured from the anchor
          if (xa < 0 || xa > res.fairleadX) return null;
          let lo = 0, hi = pts.length - 1;
          while (hi - lo > 1) { const m = (lo + hi) >> 1; if (pts[m].x <= xa) lo = m; else hi = m; }
          const a = pts[lo], b = pts[hi];
          const t = (b.x - a.x) ? (xa - a.x) / (b.x - a.x) : 0;
          return wd - (a.z + (b.z - a.z) * t);
      };

      // All status conditions for one result (A8). level: bad | warn | info
      const getStatusFlags = (res, ctx) => {
          const f = [];
          const { minMBL, hasMBL, df, structures, minClearance, waterDepth } = ctx;
          if (res.offsetReached === false) f.push({ level: 'bad', code: 'OFFSET_NOT_REACHED', text: `Offset not reached (${res.offsetError > 0 ? '+' : ''}${res.offsetError?.toFixed(1)} m)`, tip: `Target ${res.targetOffset} m is outside the reachable range for this payout. Solved X = ${res.fairleadX?.toFixed(1)} m.` });
          if (res.converged === false) f.push({ level: 'bad', code: 'NOT_CONVERGED', text: 'Not converged', tip: res.solverNote || `residual ${res.residual?.toFixed(3)} m` });
          if (res.fairleadSubmerged) f.push({ level: 'bad', code: 'FL_BELOW_SURFACE', text: 'FL below surface', tip: 'Solved fairlead lies below the sea surface' });
          if (res.maxNA) f.push({ level: 'warn', code: 'MAX_NA', text: 'Find Max N/A', tip: 'The anchor is lifted at every tension (e.g. large buoy near the anchor), so a 0 m-grounded lift-off point does not exist. This row is the 0.1 t probe, not a maximum.' });
          if (res.maxIncomplete) f.push({ level: 'bad', code: 'MAX_INCOMPLETE', text: 'Find Max incomplete', tip: 'The Worker CPU budget ran out before the lift-off tension was bracketed. This row is NOT a maximum - use fewer targets or run Find Max on its own.' });
          if (String(res.solver || '').startsWith('collocation')) f.push({ level: 'info', code: 'MULTI_BUOY_SOLVER', text: res.solver === 'collocation-retry' ? 'Multi-buoy solver (retry)' : 'Multi-buoy solver', tip: 'Solved by the span-decoupled nodal collocation solver (Worker v4.6): used only when the standard shooting solver cannot handle several buoys floating partially submerged. Result passed internal checks (force residual < 1 N, no seabed penetration, span/node depth gap <= 0.01 m, force continuity at every buoy, fairlead within 0.01 m). "Retry" = robust second pass (Worker v4.7) used only when the first pass is rejected.' });
          if (res.multiTouchdown) { const cl = contactsOf(res); f.push({ level: 'info', code: 'MULTI_TOUCHDOWN_SOLVED', text: cl.length > 1 ? `${cl.length} mid-line seabed contacts (${res.contact2Length?.toFixed(1)} m)` : `2nd seabed contact ${res.contact2Length?.toFixed(1)} m`, tip: `Solved: line touches the seabed tangentially between buoy(s) - ${cl.map(c => `${c.length.toFixed(1)} m at ${c.near.toFixed(0)}-${c.far.toFixed(0)} m from the fairlead`).join('; ')}${res.anchorUpliftForce > 0 ? `; anchor uplifted ${res.anchorUpliftForce.toFixed(2)} t` : ''}. Contact stretches modelled frictionless; buoys may float partially submerged.` }); }
          else if (res.seabedContactSuspended) f.push({ level: 'bad', code: 'MULTI_TOUCHDOWN', text: 'Invalid: multi-touchdown', tip: (res.multiTouchdownNote ? res.multiTouchdownNote + '. ' : '') + 'Suspended line re-contacts the seabed and no validated solution was found (e.g. several buoys at the surface). Tensions/offset for this case are not valid.' });

          }
          if (msg.includes('exceeded CPU') || msg.includes('CPU')) {
              return { title: 'Worker CPU Limit Exceeded', hint: 'Reduce the number of tension targets, or disable Find Max. Free tier = 10ms CPU per request.', canRetry: true, category: 'cpu' };

      const InputPanel = ({
          waterDepth, setWaterDepth,
          fairleadElev, setFairleadElev,

          buoys, setBuoys,
          tensions, setTensions,
          calculate, loading, isUpToDate, flushRef,
          showMaxTension, setShowMaxTension,
          subseaStructures, setSubseaStructures,
          calcMode, setCalcMode,
          projectName, setProjectName,
          patternType, setPatternType,
          anchorBearings, setAnchorBearings,
          designFactor, setDesignFactor,
          minClearance, setMinClearance,
          // v10 NEW: injected from App
          activePresetKey, setActivePresetKey,   // M2: remember selection
          bulkUpdateConfig,                       // M6: batch state updates
          pushToast,                              // M5: non-blocking notifications
          openConfirm,                            // M7: overwrite dialog
          openPrompt                              // M5: save name dialog
      }) => {

          const validatePositive = (val, allowZero = true) => {
              if (val === '' || val === null || val === undefined || isNaN(val)) return false;
              return allowZero ? val >= 0 : val > 0;
          };

          const handleTypeChange = (index, newType) => {
              const newSegs = [...segments];
              const cur = newSegs[index];
              const d = parseFloat(cur.diameter) || DEFAULT_DIA[newType];
              newSegs[index] = deriveSegment({ ...cur, type: newType, diameter: d, w_wet: '', frictionCoeff: matOf(newType).mu,
                                               isWeightManual: false, isEAManual: false, isMBLManual: false });
              setSegments(newSegs);
          };

          const handleSizeChange = (index, dStr) => {
              if (!dStr) return;
              const newSegs = [...segments];
              newSegs[index] = deriveSegment({ ...newSegs[index], diameter: parseFloat(dStr), w_wet: '',
                                               isWeightManual: false, isEAManual: false, isMBLManual: false });
              setSegments(newSegs);
          };

          // v13: one manual flag per derived field; clearing the field restores the auto value.
          // Editing dry weight no longer wipes a manual wet weight (B6).
          const MANUAL_FLAG = { w: 'isWeightManual', EA: 'isEAManual', mbl: 'isMBLManual' };
          const updateSegment = (index, field, value) => {
              const newSegs = [...segments];
              let seg = { ...newSegs[index], [field]: value };
              const flag = MANUAL_FLAG[field];
              if (flag) {
                  const v = parseFloat(value);
                  seg[flag] = value !== '' && !isNaN(v) && v > 0;
              }
              if (flag || field === 'diameter') seg = deriveSegment(seg);
              newSegs[index] = seg;
              setSegments(newSegs);
          };

          const addSegment = () => {
              setSegments([...segments, makeSegment(SegmentType.WIRE, DEFAULT_DIA[SegmentType.WIRE], 100)]);
          };

          const removeSegment = (index) => {
              if (segments.length <= 1) return;
              setSegments(segments.filter((_, i) => i !== index));
          };

          // v13: pennant weight = submerged weight from pennant diameter x length (B12).
          // A manual entry (including 0) is kept; clearing it restores the auto value (B14).
          const updateBuoy = (index, field, value) => {
              const newBuoys = [...buoys];
              const b = { ...newBuoys[index], [field]: value };
              if (field === 'pennantWeight') b.isPennantWeightManual = value !== '' && !isNaN(parseFloat(value));
              if (!b.isPennantWeightManual) b.pennantWeight = pennantWeightT(b.pennantLength, b.pennantDiameter ?? DEFAULT_PENNANT_DIA);
              newBuoys[index] = b;
              setBuoys(newBuoys);
          };

          const addBuoy = () => {
              setBuoys([...buoys, { id: makeClientId('buoy'), distanceFromAnchor: 100, netBuoyancy: 5, pennantLength: 30, pennantDiameter: DEFAULT_PENNANT_DIA, pennantWeight: pennantWeightT(30, DEFAULT_PENNANT_DIA), pennantLoad: 0.05, height: 2.0, isPennantWeightManual: false }]);
          };

          const removeBuoy = (index) => {
              setBuoys(buoys.filter((_, i) => i !== index));
          };

          const duplicateSegment = (index) => {
              const src = segments[index];
              const copy = { ...src, id: makeClientId('seg') };
              const newSegs = [...segments];
              newSegs.splice(index + 1, 0, copy);
              setSegments(newSegs);
          };
          const duplicateBuoy = (index) => {
              const src = buoys[index];
              const copy = { ...src, id: makeClientId('buoy'), distanceFromAnchor: (parseFloat(src.distanceFromAnchor) || 0) + 50 };
              const newBuoys = [...buoys];
              newBuoys.splice(index + 1, 0, copy);
              setBuoys(newBuoys);
          };

          // v10 M6: consolidate 11 setState calls into ONE bulkUpdateConfig call
          //         M2: remember which preset was loaded
          const applyFleetPreset = (key) => {
              if (!key || !FLEET_PRESETS[key]) return;
              const p = FLEET_PRESETS[key];
              const stamp = Date.now();
              const pType = p.patternType || 'tender_8pt';
              const updates = {
                  projectName: p.projectName,
                  waterDepth: p.waterDepth,
                  fairleadElev: p.fairleadElev,
                  subseaStructuresStr: p.subseaStructuresStr || '',
                  segments: p.segments.map((sg, i) => makeSegment(sg.type, sg.diameter, sg.length, { id: `seg-${stamp}-${i}` })),
                  buoys: p.buoys.map((b, i) => ({ ...b, id: `buoy-${stamp}-${i}`, isPennantWeightManual: false,
                                                  pennantWeight: pennantWeightT(b.pennantLength, b.pennantDiameter) })),
                  designFactor: DEFAULT_DF,
                  presetKey: key,
                  calcMode: p.calcMode || 'tension',
                  showMaxTension: !!p.showMaxTension,
                  tensionsStr: p.tensionsStr || '5, 20, 40',
                  patternType: pType,
                  anchorBearings: (PATTERN_TEMPLATES[pType] || []).map(a => ({ ...a }))
              };
              if (bulkUpdateConfig) {
                  bulkUpdateConfig(updates);
              } else {
                  // Fallback for compatibility - shouldn't happen in v10
                  setProjectName(updates.projectName);
                  setWaterDepth(updates.waterDepth);
                  setFairleadElev(updates.fairleadElev);
                  setSubseaStructures(updates.subseaStructuresStr);
                  setSegments(updates.segments);
                  setBuoys(updates.buoys);
                  setCalcMode(updates.calcMode);
                  setShowMaxTension(updates.showMaxTension);
                  setTensions(updates.tensionsStr);
                  setPatternType(updates.patternType);
                  setAnchorBearings(updates.anchorBearings);
              }
              // v13 D1: preset key is stored per tab (updates.presetKey), not globally.
              if (pushToast) pushToast('success', `Loaded: ${p.label}`);
          };

          const suggestTension = () => {
              const s0 = segments[0]; if (!s0) return;
              const d = parseFloat(s0.diameter) || 0;
              let profile;
              if (d <= 40) profile = TENSION_PROFILES.JACKUP;
              else if (d >= 60) profile = TENSION_PROFILES.TENDER_LARGE;
              else profile = TENSION_PROFILES.AWB_SMALL;
              setTensions(profile);
              setShowMaxTension(true);
          };

          // v10 M5+M7: prompt via non-blocking dialog, confirm overwrite, toast on success/error
          const persistSetup = (name) => {
              const setup = { projectName, waterDepth, fairleadElev,
                  subseaStructuresStr: subseaStructures, segments, buoys,
                  tensionsStr: tensions, calcMode, showMaxTension,
                  patternType, anchorBearings, designFactor, minClearance,
                  savedAt: new Date().toISOString() };
              try {
                  const all = JSON.parse(localStorage.getItem('slack_my_setups') || '{}');
                  all[name] = setup;
                  localStorage.setItem('slack_my_setups', JSON.stringify(all));
                  setMySetupNames(Object.keys(all));
                  if (pushToast) pushToast('success', `Saved "${name}"`);
              } catch(e) {
                  if (pushToast) pushToast('error', 'Save failed: ' + e.message);
                  else alert('Save failed: ' + e.message);
              }
          };
          const saveMySetup = () => {
              const doSave = (name) => {
                  if (!name || !name.trim()) return;
                  name = name.trim();
                  try {
                      const all = JSON.parse(localStorage.getItem('slack_my_setups') || '{}');
                      if (all[name] && openConfirm) {
                          // M7: confirm overwrite via non-blocking dialog
                          openConfirm({
                              title: 'Overwrite Existing Setup?',
                              message: `A setup named "${name}" already exists (saved ${new Date(all[name].savedAt).toLocaleString()}). Overwrite it?`,
                              confirmLabel: 'Overwrite',
                              cancelLabel: 'Cancel',
                              onConfirm: () => persistSetup(name)
                          });
                      } else {
                          persistSetup(name);
                      }
                  } catch(e) { persistSetup(name); }
              };
              if (openPrompt) {
                  openPrompt({
                      title: 'Save Current Setup',
                      message: 'Setups are stored in your browser (localStorage) for quick recall.',
                      defaultValue: projectName,
                      onConfirm: doSave
                  });
              } else {
                  const name = window.prompt('Save current setup as:', projectName);
                  if (name) doSave(name);
              }
          };
          const loadMySetup = (name) => {
              if (!name) return;
              try {
                  const all = JSON.parse(localStorage.getItem('slack_my_setups') || '{}');
                  const p = all[name]; if (!p) return;
                  const stamp = Date.now();
                  const pType = p.patternType || 'tender_8pt';
                  const updates = {
                      projectName: p.projectName || name,
                      waterDepth: p.waterDepth,
                      fairleadElev: p.fairleadElev,
                      subseaStructuresStr: p.subseaStructuresStr || '',
                      segments: (p.segments || []).map((sg, i) => ({ ...sg, id: `seg-${stamp}-${i}` })),
                      buoys: (p.buoys || []).map((b, i) => ({ ...b, id: `buoy-${stamp}-${i}` })),
                      calcMode: p.calcMode || 'tension',
                      showMaxTension: !!p.showMaxTension,
                      tensionsStr: p.tensionsStr || '5, 20, 40',
                      patternType: pType,
                      anchorBearings: p.anchorBearings || (PATTERN_TEMPLATES[pType] || []).map(a => ({...a})),
                      designFactor: p.designFactor ?? DEFAULT_DF,
                      minClearance: p.minClearance ?? DEFAULT_MIN_CLEARANCE,
                      presetKey: ''
                  };
                  if (bulkUpdateConfig) bulkUpdateConfig(updates);
                  else {
                      // Fallback
                      setProjectName(updates.projectName); setWaterDepth(updates.waterDepth);
                      setFairleadElev(updates.fairleadElev); setSubseaStructures(updates.subseaStructuresStr);
                      setSegments(updates.segments); setBuoys(updates.buoys);
                      setCalcMode(updates.calcMode); setShowMaxTension(updates.showMaxTension);
                      setTensions(updates.tensionsStr); setPatternType(updates.patternType);
                      setAnchorBearings(updates.anchorBearings);
                  }
                  if (pushToast) pushToast('success', `Loaded "${name}"`);
              } catch(e) {
                  if (pushToast) pushToast('error', 'Load failed: ' + e.message);
                  else alert('Load failed: ' + e.message);
              }
          };
          const deleteMySetup = (name) => {
              if (!name) return;
              openConfirm({
                  title: 'Delete Saved Setup?', message: `Delete "${name}" from this browser?`,
                  confirmLabel: 'Delete', cancelLabel: 'Cancel',
                  onConfirm: () => {
                      try {
                          const all = JSON.parse(localStorage.getItem('slack_my_setups') || '{}');
                          delete all[name];
                          localStorage.setItem('slack_my_setups', JSON.stringify(all));
                          setMySetupNames(Object.keys(all));
                          pushToast('success', `Deleted "${name}"`);
                      } catch(e) { pushToast('error', 'Delete failed: ' + e.message); }
                  }
              });
          };
          const [mySetupNames, setMySetupNames] = useState([]);
          useEffect(() => {
              try { setMySetupNames(Object.keys(JSON.parse(localStorage.getItem('slack_my_setups') || '{}'))); }
              catch(e) { setMySetupNames([]); }
          }, []);

          // v10 S2: debounced buffers for text-heavy inputs (300ms flush)
          // UI stays snappy while typing; global config updates only after user pauses
          const [wdBuf, setWdBuf] = useState(String(waterDepth));
          const [flBuf, setFlBuf] = useState(String(fairleadElev));
          const [tensBuf, setTensBuf] = useState(tensions);
          const [subseaBuf, setSubseaBuf] = useState(subseaStructures);
          // Sync buffers when external state changes (e.g. preset load, import)
          useEffect(() => { setWdBuf(String(waterDepth)); }, [waterDepth]);
          useEffect(() => { setFlBuf(String(fairleadElev)); }, [fairleadElev]);
          useEffect(() => { setTensBuf(tensions); }, [tensions]);
          useEffect(() => { setSubseaBuf(subseaStructures); }, [subseaStructures]);
          const isFairleadInvalid = !validatePositive(parseFloat(fairleadElev), true);

          // v11: the per-field error props were cosmetic only - invalid configs still fired requests.
          const configErrors = useMemo(() => {
              const e = [];
              const wd = parseFloat(waterDepth);
              if (!validatePositive(wd, false) || isNaN(parseFloat(wdBuf))) e.push('Water depth must be greater than 0');
              if ((tensBuf || '').split(',').filter(x => parseFloat(x) > 0).length > 12) e.push('Max 12 targets per calculation');
              if (segments.length > 20) e.push('Max 20 segments');
              if (buoys.length > 10) e.push('Max 10 buoys');
              if (!(parseFloat(designFactor) > 0) || isNaN(Number(designFactor))) e.push('Design factor must be greater than 0');
              if (minClearance === '' || isNaN(Number(minClearance)) || Number(minClearance) < 0) e.push('Min clearance must be 0 or greater');
              (subseaBuf || '').split(',').map(x => x.trim()).filter(Boolean).forEach(x => {
                  const d = parseFloat(x.split('@')[0]);
                  if (isNaN(d) || d <= 0) e.push(`Structure "${x}": distance must be greater than 0`);
              });
              if (isFairleadInvalid) e.push('Fairlead elevation must be 0 or greater');
              const totalLen = segments.reduce((acc, s) => acc + (parseFloat(s.length) || 0), 0);
              segments.forEach((s, i) => {
                  if (!validatePositive(s.length, false)) e.push(`Segment ${i + 1}: length must be greater than 0`);
                  if (!validatePositive(s.w, false)) e.push(`Segment ${i + 1}: weight must be greater than 0`);
                  if (s.EA !== '' && s.EA !== undefined && !validatePositive(parseFloat(s.EA), false)) e.push(`Segment ${i + 1}: EA must be greater than 0 (leave blank for rigid)`);
                  if (!validatePositive(s.frictionCoeff, true)) e.push(`Segment ${i + 1}: friction must be 0 or greater`);
              });
              if (!isNaN(wd) && totalLen > 0 && totalLen <= wd + (parseFloat(fairleadElev) || 0)) {
                  e.push(`Payout ${totalLen.toFixed(0)} m is shorter than the vertical span`);
              }
              const dists = buoys.map(b => parseFloat(b.distanceFromAnchor));
              buoys.forEach((b, i) => {
                  if (dists[i] > totalLen) e.push(`Buoy ${i + 1} sits beyond the end of the line`);
                  const dup = dists.findIndex((x, j) => j !== i && Math.abs(x - dists[i]) < 1);
                  if (dup >= 0 && dup < i) e.push(`Buoy ${i + 1}: same position as Buoy ${dup + 1} (engine applies only one)`);
                  if (!(parseFloat(b.height) > 0)) e.push(`Buoy ${i + 1}: height must be greater than 0`);
              });
              return e;
          }, [waterDepth, fairleadElev, segments, buoys, isFairleadInvalid, wdBuf, designFactor, minClearance, subseaBuf, tensBuf]);
          // A16: reachable offset range shown to the user (rigid-line estimate)
          const offsetRange = (() => {
              const L = segments.reduce((a, s) => a + (parseFloat(s.length) || 0), 0);
              const dz = (parseFloat(waterDepth) || 0) + (parseFloat(fairleadElev) || 0);
              return { min: Math.max(0, L - dz), max: Math.sqrt(Math.max(0, L * L - dz * dz)) };
          })();

          const dbWd = useDebounce(wdBuf, 300);
          const dbFl = useDebounce(flBuf, 300);
          const dbTens = useDebounce(tensBuf, 300);
          const dbSubsea = useDebounce(subseaBuf, 300);
          useEffect(() => {
              // v13.1 B18: an empty box stays empty (validation shows the error) instead of snapping back.
              const v = parseFloat(dbWd);
              if (!isNaN(v) && v !== waterDepth) setWaterDepth(Math.max(0, v));
          }, [dbWd]);
          // v13.1 B18: Calculate / Ctrl+Enter use the CURRENT buffers, not the 300 ms-old committed state.
          const pendingOverrides = () => {
              const o = {}; const v = parseFloat(wdBuf);
              if (!isNaN(v) && v !== waterDepth) o.waterDepth = Math.max(0, v);
              if (flBuf !== String(fairleadElev)) o.fairleadElev = flBuf;
              if (tensBuf !== tensions) o.tensionsStr = tensBuf;
              if (subseaBuf !== subseaStructures) o.subseaStructuresStr = subseaBuf;
              return o;
          };
          if (flushRef) flushRef.current = pendingOverrides;
          useEffect(() => { if (dbFl !== String(fairleadElev)) setFairleadElev(dbFl); }, [dbFl]);
          useEffect(() => { if (dbTens !== tensions) setTensions(dbTens); }, [dbTens]);
          useEffect(() => { if (dbSubsea !== subseaStructures) setSubseaStructures(dbSubsea); }, [dbSubsea]);

          return (
              <div className="flex flex-col h-full relative">
                  {/* SCROLLABLE CONTENT */}
                  <div className="flex-1 overflow-y-auto pr-2 pb-4 space-y-6">
                      <section>
                          <SectionHeader title="Environment" icon={IconWaves} />
                          <div className="space-y-3 p-3 bg-white/50 dark:bg-gray-800/50 backdrop-blur-sm border border-gray-200 dark:border-gray-700 rounded-lg">
                              <div className="p-2 bg-accent-50 dark:bg-accent-600/10 border-2 border-accent-300 dark:border-accent-600/50 rounded-lg">
                                  <label className="block text-[11px] font-bold text-accent-700 dark:text-accent-400 mb-1.5 flex items-center gap-1 uppercase tracking-wider">
                                      <IconAnchor size={11} /> Quick Fill: Fleet Vessel
                                  </label>
                                  <div className="relative">
                                      {/* v10 M2: dropdown remembers active preset (via activePresetKey), no auto-reset */}
                                      <select value={activePresetKey || ''} onChange={e => { if (e.target.value) applyFleetPreset(e.target.value); }} className="w-full bg-white dark:bg-gray-900 border border-accent-400 dark:border-accent-500 rounded px-2 py-2 text-xs font-medium text-accent-700 dark:text-accent-300 focus:border-accent-500 focus:ring-1 focus:ring-accent-500 outline-none appearance-none transition-all shadow-sm cursor-pointer" aria-label="Fleet preset selector">
                                          <option value="">-- Select vessel: auto-loads all fields --</option>
                                          <optgroup label="TENDER (Large wire)">
                                              {Object.keys(FLEET_PRESETS).filter(k => FLEET_PRESETS[k].category==='TENDER').map(k => (<option key={k} value={k}>{FLEET_PRESETS[k].short}</option>))}
                                          </optgroup>
                                          <optgroup label="AWB (Accommodation)">
                                              {Object.keys(FLEET_PRESETS).filter(k => FLEET_PRESETS[k].category==='AWB').map(k => (<option key={k} value={k}>{FLEET_PRESETS[k].short}</option>))}
                                          </optgroup>
                                          <optgroup label="JACKUP (4-point AHT positioning)">
                                              {Object.keys(FLEET_PRESETS).filter(k => FLEET_PRESETS[k].category==='JACKUP').map(k => (<option key={k} value={k}>{FLEET_PRESETS[k].short}</option>))}
                                          </optgroup>
                                      </select>
                                      <IconChevronDown size={12} className="absolute right-2 top-2.5 text-accent-500 pointer-events-none" />
                                  </div>
                                  <div className="flex gap-2 mt-2">
                                      <button onClick={saveMySetup} aria-label="Save current setup to browser storage" className="flex-1 text-[11px] font-bold bg-emerald-100 dark:bg-emerald-900/30 hover:bg-emerald-200 dark:hover:bg-emerald-800/40 text-emerald-700 dark:text-emerald-300 px-2 py-1 rounded border border-emerald-300 dark:border-emerald-700 transition-colors uppercase tracking-wider">
                                          Save Setup
                                      </button>
                                      {mySetupNames.length > 0 && (
                                          <div className="flex-1 relative">
                                              <select defaultValue="" aria-label="Load saved setup" onChange={e => { loadMySetup(e.target.value); e.target.value=''; }} className="w-full text-[11px] font-bold bg-purple-100 dark:bg-purple-900/30 hover:bg-purple-200 text-purple-700 dark:text-purple-300 px-2 py-1 rounded border border-purple-300 dark:border-purple-700 uppercase tracking-wider cursor-pointer appearance-none">
                                                  <option value="">Load ({mySetupNames.length})</option>
                                                  {mySetupNames.map(n => <option key={n} value={n}>{n}</option>)}
                                              </select>
                                          </div>
                                      )}
                                      {mySetupNames.length > 0 && (
                                          <select defaultValue="" aria-label="Delete saved setup" title="Delete a saved setup" onChange={e => { deleteMySetup(e.target.value); e.target.value=''; }} className="w-8 text-[11px] font-bold bg-white dark:bg-gray-900 text-bad-600 dark:text-bad-400 px-1 py-1 rounded border border-gray-300 dark:border-gray-700 cursor-pointer appearance-none text-center">
                                              <option value="">✕</option>
                                              {mySetupNames.map(n => <option key={n} value={n}>Delete: {n}</option>)}
                                          </select>
                                      )}
                                  </div>
                                  <p className="text-[11px] text-gray-500 dark:text-gray-400 mt-1.5 leading-tight">
                                      {activePresetKey && FLEET_PRESETS[activePresetKey] ? FLEET_PRESETS[activePresetKey].label : 'Loads WD, segments, buoys, tension profile and anchor pattern. Line properties use the generic material model.'}
                                  </p>
                              </div>
                              <InputField label="Project Name" value={projectName} onChange={e => setProjectName(e.target.value)} type="text" placeholder="e.g. Mooring_Line_A" className="col-span-2" />
                              <div className="grid grid-cols-2 gap-3">
                                  {/* v10 S2: debounced local buffer for smoother typing */}
                                  <InputField label="Water Depth" value={wdBuf} onChange={e => setWdBuf(e.target.value)} unit="m" min={0} error={waterDepth <= 0 ? "Depth > 0" : undefined} />
                                  <InputField label="Fairlead Elev." title="Height of the fairlead above mean sea level" value={flBuf} onChange={e => setFlBuf(e.target.value)} unit="m" error={isFairleadInvalid ? "Z ≥ 0" : undefined} />
                              </div>
                              <InputField label="Design Factor (SWL = MBL / DF)" title="Default 2.0 = API RP 2SK intact, quasi-static" value={designFactor} onChange={e => setDesignFactor(e.target.value)} error={!(parseFloat(designFactor) > 0) ? 'DF > 0' : undefined} unit="x" placeholder={`Default ${DEFAULT_DF}`} />
                              <div className="border-t border-gray-200 dark:border-gray-700/50 mt-1 pt-2">
                                  <InputField label="Subsea Structures (Dist from FL)" title="Comma list. 400 = all bearings, 400@270 = ±45°, 400@270:30 = ±30°" value={subseaBuf} onChange={e => setSubseaBuf(e.target.value)} type="text" placeholder="e.g. 150, 400@270" />
                                  <InputField className="mt-3" label="Min Clearance over Structure" title="Minimum line height above the seabed at each structure distance" value={minClearance} onChange={e => setMinClearance(e.target.value)} error={minClearance === '' || Number(minClearance) < 0 ? '≥ 0' : undefined} unit="m" placeholder={`Default ${DEFAULT_MIN_CLEARANCE}`} />
                              </div>
                          </div>
                      </section>

                      <section>
                          <div className="flex justify-between items-center mb-2">
                              <SectionHeader title="Line Segments (Fairlead → Anchor)" icon={IconAnchor} />
                              <button onClick={addSegment} aria-label="Add new segment" className="flex items-center gap-1 text-[11px] font-medium bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 px-2 py-1 rounded border border-gray-300 dark:border-gray-700 transition-colors">
                                  <IconPlus size={12} /> Add
                              </button>
                          </div>
                          <div className="space-y-3">
                              {segments.map((seg, idx) => {
                                  const density = MATERIAL_DENSITIES[seg.type] || 7850;
                                  const factor = (density - SEAWATER_DENSITY) / density;
                                  const dryVal = typeof seg.w === 'string' ? parseFloat(seg.w) : seg.w;
                                  const autoWet = (isNaN(dryVal) ? 0 : dryVal) * factor;
                                  const hasManualWet = seg.w_wet !== undefined && seg.w_wet !== null && seg.w_wet !== '' && !isNaN(parseFloat(seg.w_wet)) && parseFloat(seg.w_wet) !== 0;
                                  
                                  const isLenInvalid = !validatePositive(seg.length, false);
                                  const isWeightInvalid = !validatePositive(seg.w, false);
                                  const isEAInvalid = seg.EA !== '' && seg.EA !== undefined && !validatePositive(parseFloat(seg.EA), false);
                                  const isFrictionInvalid = !validatePositive(seg.frictionCoeff, true);

                                  return (
                                      <div key={seg.id} className="bg-white dark:bg-gray-850 border border-gray-200 dark:border-gray-800 p-3 rounded-lg group relative transition-colors hover:border-gray-300 dark:hover:border-gray-700 shadow-soft">
                                          <div className="flex justify-between items-start mb-2">
                                              <span className="text-xs font-bold text-gray-700 dark:text-gray-300 flex items-center gap-2"><span className="bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-400 text-[11px] px-1.5 rounded">#{idx + 1}</span>{matOf(seg.type).label}<span className="text-gray-500 dark:text-gray-400 font-normal">· {seg.diameter || '?'} mm × {seg.length || 0} m</span></span>
                                              <div className="flex items-center gap-1">
                                                  <button onClick={() => duplicateSegment(idx)} aria-label="Duplicate this segment" className="text-gray-400 hover:text-accent-500 transition-colors p-1" title="Duplicate this segment">
                                                      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                                  </button>
                                                  <button onClick={() => removeSegment(idx)} aria-label="Remove this segment" className="text-gray-400 hover:text-red-500 transition-colors p-1"><IconX size={14} aria-hidden="true"/></button>
                                              </div>
                                          </div>
                                          <div className="grid grid-cols-2 gap-3">
                                              <div className="col-span-2">
                                                  <SelectField label="Type" value={seg.type} onChange={e => handleTypeChange(idx, e.target.value)}>
                                                      {Object.keys(MATERIAL).map(t => <option key={t} value={t}>{MATERIAL[t].label}</option>)}
                                                  </SelectField>
                                              </div>
                                              {SIZE_STANDARDS[seg.type] && SIZE_STANDARDS[seg.type].length > 0 && (
                                                  <div className="col-span-2">
                                                      <SelectField label="Standard Size (generic auto-fill)" value={SIZE_STANDARDS[seg.type].some(([d]) => d === parseFloat(seg.diameter)) ? String(parseFloat(seg.diameter)) : ''} onChange={e => handleSizeChange(idx, e.target.value)}>
                                                          <option value="">-- Custom diameter --</option>
                                                          {SIZE_STANDARDS[seg.type].map(([d, note]) => (<option key={d} value={String(d)}>{sizeLabel(seg.type, d, note)}</option>))}
                                                      </SelectField>
                                                  </div>
                                              )}
                                                                                            <InputField label="Diameter" value={seg.diameter || ''} onChange={e => { const val = parseFloat(e.target.value); if (!isNaN(val) && val >= 0) updateSegment(idx, 'diameter', e.target.value); else if (e.target.value === '') updateSegment(idx, 'diameter', ''); }} unit="mm" placeholder="e.g. 76" />
                                              <InputField label="Length" value={seg.length} onChange={e => { const val = parseFloat(e.target.value); if (!isNaN(val) && val >= 0) { updateSegment(idx, 'length', e.target.value) } else if (e.target.value === '') { updateSegment(idx, 'length', '') } }} min="0" unit="m" error={isLenInvalid ? "Len > 0" : undefined} />
                                              <div className="col-span-2 border-t border-gray-200 dark:border-gray-700/50 my-1"></div>
                                              <InputField label="Weight (Dry)" value={seg.w} onChange={e => { updateSegment(idx, 'w', e.target.value); }} unit="kg/m" error={isWeightInvalid ? "W > 0" : undefined} highlight={seg.isWeightManual} placeholder={`Auto: ${autoW(seg.type, parseFloat(seg.diameter) || 0)}`}>
                                                  {seg.isWeightManual && (
                                                      <button onClick={() => updateSegment(idx, 'w', '')} className="absolute right-9 top-1.5 text-[11px] text-warn-600 dark:text-warn-400 hover:text-bad-600 font-bold px-1 rounded" title="Restore auto value">↺</button>
                                                  )}
                                              </InputField>
                                              <InputField label="Weight (Wet)" value={seg.w_wet || ''} onChange={e => updateSegment(idx, 'w_wet', e.target.value)} unit="kg/m" placeholder={`Auto: ${autoWet.toFixed(2)}`} highlight={hasManualWet}>
                                                  {hasManualWet && (
                                                      <button onClick={() => updateSegment(idx, 'w_wet', '')} className="absolute right-9 top-1.5 text-[11px] text-amber-600 dark:text-amber-500 hover:text-red-500 font-bold px-1 rounded hover:bg-white/50" title="Clear Manual Override">✕</button>
                                                  )}
                                              </InputField>
                                              <InputField label="Stiffness (EA)" value={seg.EA} onChange={e => { const val = parseFloat(e.target.value); if(!isNaN(val) && val >= 0) updateSegment(idx, 'EA', e.target.value); else if(e.target.value==='') updateSegment(idx, 'EA', ''); }} unit="kN" placeholder={(() => { const a = autoEA(seg.type, parseFloat(seg.diameter) || 0); return a ? `Auto: ${a}` : 'Blank = rigid'; })()} error={isEAInvalid ? "EA > 0" : undefined} highlight={seg.isEAManual}>
                    {seg.isEAManual && (
                      <button onClick={() => updateSegment(idx, 'EA', '')} className="absolute right-9 top-1.5 text-[11px] text-amber-600 dark:text-amber-500 hover:text-red-500 font-bold px-1 rounded hover:bg-white/50" title="Clear Manual Override">✕</button>
                    )}
                    {!seg.isEAManual && parseFloat(seg.diameter) > 0 && (
                      <span className="absolute right-9 top-1.5 text-[11px] text-accent-600 dark:text-accent-400 font-bold pointer-events-none" title={seg.type === SegmentType.FIBER ? 'Linear EA (slow-varying). Fiber is non-linear in reality.' : 'Generic EA from diameter'}>{seg.type === SegmentType.FIBER ? 'Lin.' : 'Auto'}</span>
                    )}
                    </InputField>
                                              <InputField label="Friction Coeff" value={seg.frictionCoeff} onChange={e => { const val = parseFloat(e.target.value); if(!isNaN(val) && val >= 0) updateSegment(idx, 'frictionCoeff', e.target.value); else if(e.target.value==='') updateSegment(idx, 'frictionCoeff', ''); }} unit="" error={isFrictionInvalid ? "µ ≥ 0" : undefined} />
                                              {/* v11: MBL drives the utilisation column and the Exceeds-SWL flag. */}
                                              <InputField label="MBL" value={seg.mbl || ''} onChange={e => { const val = parseFloat(e.target.value); if(!isNaN(val) && val >= 0) updateSegment(idx, 'mbl', e.target.value); else if(e.target.value==='') updateSegment(idx, 'mbl', ''); }} unit="t" placeholder="Est. from dia." highlight={seg.isMBLManual}>
                                                  {seg.isMBLManual && (
                                                      <button onClick={() => updateSegment(idx, 'mbl', '')} className="absolute right-9 top-1.5 text-[11px] text-amber-600 dark:text-amber-500 hover:text-red-500 font-bold px-1 rounded" title="Clear manual override">✕</button>
                                                  )}
                                                  {!seg.isMBLManual && seg.mbl && (
                                                      <span className="absolute right-9 top-1.5 text-[11px] text-warn-600 dark:text-warn-400 font-bold pointer-events-none" title={isChainType(seg.type) ? 'Generic R3 grade estimate - verify against certificate' : 'Generic catalogue estimate - verify against certificate'}>Est.</span>
                                                  )}
                                              </InputField>
                                          </div>
                                      </div>
                                  );
                              })}
                          </div>
                      </section>

                      <section>
                          <div className="flex justify-between items-center mb-2">
                              <SectionHeader title="Buoys" icon={IconLifeBuoy} />
                              <button onClick={addBuoy} aria-label="Add new buoy" className="flex items-center gap-1 text-[11px] font-medium bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 px-2 py-1 rounded border border-gray-300 dark:border-gray-700 transition-colors">
                                  <IconPlus size={12} /> Add
                              </button>
                          </div>
                          {buoys.map((b, idx) => {
                              const totalLength = segments.reduce((acc, s) => acc + (typeof s.length === 'string' ? parseFloat(s.length) : s.length), 0);
                              const isOutOfBounds = b.distanceFromAnchor > totalLength;
                              const isDistInvalid = !validatePositive(b.distanceFromAnchor, true);
                              const isBuoyancyInvalid = !validatePositive(b.netBuoyancy, true);
                              const isPennantWInvalid = !validatePositive(b.pennantWeight, true);
                              const isPennantLoadInvalid = !validatePositive(b.pennantLoad || 0, true);
                              const isPennantLInvalid = !validatePositive(b.pennantLength, true);
                              const isHeightInvalid = !(parseFloat(b.height) > 0);
                              const distFromFL = totalLength - (parseFloat(b.distanceFromAnchor) || 0);

                              return (
                                  <div key={b.id} className="bg-white/50 dark:bg-gray-800/50 backdrop-blur-sm border border-gray-200 dark:border-gray-700 p-3 rounded-lg relative mb-2 border-l-2 border-l-yellow-500/50">
                                      <div className="flex justify-between items-start mb-2">
                                          <span className="text-xs font-bold text-yellow-600 dark:text-yellow-500">Buoy #{idx + 1}</span>
                                          <div className="flex items-center gap-1">
                                              <button onClick={() => duplicateBuoy(idx)} aria-label="Duplicate this buoy" className="text-gray-400 hover:text-accent-500 transition-colors p-1" title="Duplicate this buoy">
                                                  <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                              </button>
                                              <button onClick={() => removeBuoy(idx)} aria-label="Remove this buoy" className="text-gray-400 hover:text-red-500 transition-colors p-1"><IconTrash2 size={12} aria-hidden="true"/></button>
                                          </div>
                                      </div>
                                      <div className="space-y-3">
                                          <InputField label={`Dist from Anchor (≈ ${isFinite(distFromFL) ? distFromFL.toFixed(0) : '-'} m from FL along line)`} value={b.distanceFromAnchor} onChange={e => { const val = parseFloat(e.target.value); if(!isNaN(val) && val >= 0) updateBuoy(idx, 'distanceFromAnchor', e.target.value); else if(e.target.value === '') updateBuoy(idx, 'distanceFromAnchor', ''); }} unit="m" error={isDistInvalid ? "Dist ≥ 0" : undefined} />
                                          {isOutOfBounds && <div className="text-[11px] text-red-500 font-bold mt-1 -mb-1">⚠ Warning: Buoy beyond line length ({totalLength.toFixed(1)}m)</div>}
                                          <div className="grid grid-cols-2 gap-3">
                                              <InputField label="Buoyancy (excl. pennant)" title="Gross buoyancy minus buoy self-weight. Pennant weight and misc load are deducted separately." value={b.netBuoyancy} onChange={e => { const val = parseFloat(e.target.value); if(!isNaN(val) && val >= 0) updateBuoy(idx, 'netBuoyancy', e.target.value); else if(e.target.value === '') updateBuoy(idx, 'netBuoyancy', ''); }} unit="ton" error={isBuoyancyInvalid ? "Buoyancy ≥ 0" : undefined} />
                                              <InputField label="Pennant Length" value={b.pennantLength} onChange={e => { const val = parseFloat(e.target.value); if(!isNaN(val) && val >= 0) updateBuoy(idx, 'pennantLength', e.target.value); else if(e.target.value === '') updateBuoy(idx, 'pennantLength', ''); }} unit="m" error={isPennantLInvalid ? "Len ≥ 0" : undefined} />
                                              <InputField label="Pennant Ø" title="Pennant wire diameter - drives the auto pennant weight" value={b.pennantDiameter ?? DEFAULT_PENNANT_DIA} onChange={e => { const val = parseFloat(e.target.value); if(!isNaN(val) && val >= 0) updateBuoy(idx, 'pennantDiameter', e.target.value); else if(e.target.value === '') updateBuoy(idx, 'pennantDiameter', ''); }} unit="mm" />
                                              <InputField label="Pennant Wt (sub.)" title="Submerged weight = generic wire kg/m(Ø) × length × wet factor" value={b.pennantWeight} onChange={e => { const val = parseFloat(e.target.value); if(!isNaN(val) && val >= 0) updateBuoy(idx, 'pennantWeight', e.target.value); else if(e.target.value === '') updateBuoy(idx, 'pennantWeight', ''); }} unit="ton" error={isPennantWInvalid ? "Wt ≥ 0" : undefined} highlight={b.isPennantWeightManual} placeholder={`Auto: ${pennantWeightT(b.pennantLength, b.pennantDiameter ?? DEFAULT_PENNANT_DIA)}`}>
                    {b.isPennantWeightManual && (
                      <button onClick={() => updateBuoy(idx, 'pennantWeight', '')} className="absolute right-9 top-1.5 text-[11px] text-warn-600 dark:text-warn-400 hover:text-bad-600 font-bold px-1 rounded" title="Restore auto value">↺</button>
                    )}
                    </InputField>
                                              <InputField label="Misc Load (t)" value={b.pennantLoad ?? 0} onChange={e => { const val = parseFloat(e.target.value); if(!isNaN(val) && val >= 0) updateBuoy(idx, 'pennantLoad', e.target.value); else if(e.target.value === '') updateBuoy(idx, 'pennantLoad', ''); }} unit="ton" error={isPennantLoadInvalid ? "Load ≥ 0" : undefined} />
                                              <InputField label="Buoy Height" value={b.height} onChange={e => { const val = parseFloat(e.target.value); if(!isNaN(val) && val >= 0) updateBuoy(idx, 'height', e.target.value); else if(e.target.value === '') updateBuoy(idx, 'height', ''); }} unit="m" error={isHeightInvalid ? "H > 0" : undefined} />
                                          </div>
                                      </div>
                                  </div>
                              );
                          })}
                      </section>
                  </div>

                  {/* STICKY BOTTOM ACTION PANEL - OPTION 2 */}
                  <div className="pt-4 px-1 pb-1 border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shrink-0 shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.05)] z-20 transition-colors duration-300">
                      {calcMode === 'offset' && (
                          <div className="mb-2 p-2 bg-amber-50 dark:bg-amber-900/20 border border-amber-100 dark:border-amber-800 rounded flex gap-2 items-start">
                              <IconWarning size={14} className="text-amber-500 shrink-0 mt-0.5" />
                              <p className="text-[11px] text-amber-700 dark:text-amber-200 leading-tight">
                                  <strong>Check Payout:</strong> Ensure 'Segment Length' matches the actual paid-out length. Reachable offset ≈ <b>{offsetRange.min.toFixed(0)}–{offsetRange.max.toFixed(0)} m</b> (rigid-line estimate); targets outside are flagged.
                              </p>
                          </div>
                      )}
                      <div className="flex justify-between items-center mb-2 px-1">
                          <div className="flex items-center gap-2 bg-gray-100 dark:bg-gray-800 rounded p-0.5">
                              <button onClick={() => setCalcMode('tension')} className={`text-[11px] px-2 py-1 rounded font-bold transition-all ${calcMode === 'tension' ? 'bg-white dark:bg-gray-700 text-accent-600 dark:text-white shadow-sm' : 'text-gray-500 dark:text-gray-400'}`}>TENSION</button>
                              <button onClick={() => setCalcMode('offset')} className={`text-[11px] px-2 py-1 rounded font-bold transition-all ${calcMode === 'offset' ? 'bg-white dark:bg-gray-700 text-accent-600 dark:text-white shadow-sm' : 'text-gray-500 dark:text-gray-400'}`}>OFFSET</button>
                          </div>
                          <label className="flex items-center gap-2 cursor-pointer group">
                              <input type="checkbox" checked={showMaxTension} onChange={e => setShowMaxTension(e.target.checked)} disabled={loading} className="rounded bg-white dark:bg-gray-800 border-gray-400 dark:border-gray-600 text-accent-600 focus:ring-0 w-3.5 h-3.5 cursor-pointer disabled:opacity-50" />
                              <span className="text-[11px] text-maxc-600 dark:text-maxc-400 font-medium transition-colors">Find Max (0m Grd)</span>
                          </label>
                      </div>

                      <div className="relative">
                          <label className="absolute -top-2 left-2 px-1 bg-white dark:bg-gray-900 text-[11px] font-bold text-accent-600 dark:text-accent-500 uppercase tracking-wider z-10">
                              {calcMode === 'tension' ? 'Target Tensions (t)' : 'Target Offsets (m)'}
                          </label>
                          {calcMode === 'tension' && (
                              <button onClick={suggestTension} aria-label="Auto-suggest tension based on wire diameter" className="absolute -top-2 right-2 z-10 px-1.5 py-0.5 bg-white dark:bg-gray-900 text-[11px] font-bold text-maxc-600 dark:text-maxc-400 uppercase tracking-wider border border-maxc-600/40 dark:border-maxc-400/40 rounded hover:bg-maxc-600/10 transition-colors" title="Auto-suggest tension: JU=5,10,15 | Tender(>=60mm)=5,10,20,40 | AWB(<60mm)=3,5,20,35">
                                  Auto
                              </button>
                          )}
                          <input
                              type="text"
                              value={tensBuf}
                              onChange={e => setTensBuf(e.target.value)}
                              disabled={loading}
                              aria-label={calcMode === 'tension' ? 'Target tensions (tonnes, comma-separated)' : 'Target offsets (meters, comma-separated)'}
                              className={`w-full bg-white dark:bg-gray-900 border-2 rounded px-3 py-2 text-sm font-mono mb-3 focus:outline-none transition-colors placeholder-gray-500 dark:placeholder-gray-500 text-gray-800 dark:text-gray-200 disabled:opacity-50 ${calcMode === 'tension' ? 'border-gray-300 dark:border-gray-700 focus:border-accent-500' : 'border-emerald-200 dark:border-emerald-900/50 focus:border-emerald-500'}`}
                              placeholder={calcMode === 'tension' ? "e.g. 10, 50, 100" : `reachable ≈ ${offsetRange.min.toFixed(0)} - ${offsetRange.max.toFixed(0)} m`}
                          />
                      </div>

                      {configErrors.length > 0 && (
                          <div className="mb-2.5 px-3 py-2 bg-bad-600/8 dark:bg-bad-400/10 border border-bad-600/30 dark:border-bad-400/30 rounded-md text-[11px] text-bad-600 dark:text-bad-400 leading-relaxed" role="alert">
                              {configErrors.slice(0, 3).map((msg, i) => <div key={i}>{msg}</div>)}
                              {configErrors.length > 3 && <div className="opacity-70">and {configErrors.length - 3} more</div>}
                          </div>
                      )}
                      <button onClick={(e) => calculate(e, pendingOverrides())} aria-label="Run calculation" className={`w-full bg-accent-600 hover:bg-accent-700 dark:bg-accent-500 dark:hover:bg-accent-400 text-white dark:text-gray-950 font-semibold text-sm py-3 rounded-lg shadow-card active:scale-[0.99] transition-all flex justify-center items-center gap-2 ${(loading || configErrors.length > 0) ? 'opacity-50 cursor-not-allowed' : ''}`} disabled={loading || configErrors.length > 0} title={configErrors.length > 0 ? configErrors[0] : undefined}>
                          {loading ? <span>Processing Engine...</span> : isUpToDate ? <span title="Inputs unchanged since last calculation. Shift+Click or Ctrl+Shift+Enter to force.">✓ Up to date</span> : <>{calcMode === 'tension' ? <IconPlay size={16} fill="currentColor" /> : <IconRefresh size={16} />} {calcMode === 'tension' ? 'Calculate Profile' : 'Find Tensions'}</>}
                      </button>
                  </div>
              </div>
          );
      };

      const cfgWD = (c) => parseFloat(c.calcWaterDepth ?? c.waterDepth) || 0;   // A11/A12: WD used for THAT tab's calc

      const ChartPanel = ({ configs, activeConfigId, theme, structures, statusCtx }) => {
          const [hoverCaseId, setHoverCaseId] = useState(null);

          const chartData = useMemo(() => {
              let allData = [];

              configs.forEach((config) => {
                  const isConfigActive = config.id === activeConfigId;
                  const configData = config.results.map((res, resIdx) => {
                      const baseColor = res.isMaxTensionCase ? maxCaseColor(theme === 'dark') : seriesColor(resIdx, theme === 'dark'); 
                      const color = isConfigActive ? baseColor : (theme === 'dark' ? '#3C4C60' : '#BCC8D8');
                      const xOffset = res.fairleadX;

                      const transformedPoints = res.points.map(p => ({
                          ...p,
                          x: xOffset - p.x,
                          z: Math.min(p.z, cfgWD(config) + 2),
                          caseTension: res.horizontalTension,
                          isMax: res.isMaxTensionCase
                      })).sort((a, b) => a.x - b.x);

                      const segments = {};
                      const buoys = [];

                      const transformedAnchor = transformedPoints.find(p => p.isAnchor);

                      transformedPoints.forEach((p0) => { let p = p0;
                          if (p.segmentId) {
                              if (!segments[p.segmentId]) segments[p.segmentId] = [];
                              segments[p.segmentId].push(p);
                          }
                          if (p.isBuoy) {
                              // v13.1 A18: Worker defines buoy BOTTOM depth = wire depth - pennant. Top = bottom - height.
                              const pennantLen = p.pennantLength || 0;
                              const bottomZ = Math.max(0, p.z - pennantLen);
                              const bh = p.buoyHeight || (config.buoys || [])[p.buoyIndex]?.height || 2;
                              const topZ = Math.max(0, bottomZ - bh);
                              let visualZ = bottomZ; p = { ...p, buoyTopZ: topZ, buoyBottomZ: bottomZ };
                              const sag = p.pennantSag || 0;
                              buoys.push({ ...p, pennantBaseZ: p.z, pennantTopZ: visualZ, pennantSag: sag });
                          }
                      });

                      const invalid = isConfigActive && statusCtx ? isInvalidCase(getStatusFlags(res, statusCtx)) : false;
                      const labelBuoys = isConfigActive && (res.isMaxTensionCase || (!config.results.some(r => r.isMaxTensionCase) && resIdx === config.results.length - 1));
                      return {
                          id: `${config.id}-${resIdx}`,
                          tabName: config.projectName,
                          isActiveTab: isConfigActive,
                          invalid,
                          labelBuoys,
                          waterDepth: cfgWD(config),
                          horizontalTension: res.horizontalTension,
                          segments: Object.values(segments),
                          buoys,
                          buoysData: buoys.map(b => ({ x: b.x, z: b.pennantTopZ, utilization: b.buoyUtilization, isSlack: b.isSlack, pennantTopZ: b.pennantTopZ, buoyTopZ: b.buoyTopZ, buoyBottomZ: b.buoyBottomZ, caseId: `${config.id}-${resIdx}`, showLabel: labelBuoys, buoyNo: getBuoyDisplayNumber(b, config.buoys || [], 0) })),
                          anchor: transformedAnchor,
                          color,
                          isMax: res.isMaxTensionCase
                      };
                  });
                  allData.push(...configData);
              });
              return allData.sort((a, b) => (a.isActiveTab === b.isActiveTab ? 0 : a.isActiveTab ? 1 : -1));
          }, [configs, activeConfigId, theme, statusCtx]);

          // v11: the tooltip used to flatten+sort every case on EVERY mouse-move. Do it once.
          const flatSortedByCase = useMemo(() => {
              const m = new Map();
              chartData.forEach(d => m.set(d.id, d.segments.flat().sort((a, b) => a.x - b.x)));
              return m;
          }, [chartData]);

          const activeCfg = configs.find(c => c.id === activeConfigId) || configs[0];
          const activeWD = activeCfg ? cfgWD(activeCfg) : 73;
          const maxWaterDepth = configs.length > 0 ? Math.max(...configs.map(cfgWD)) : 73;   // y-domain only
          const structurePoints = useMemo(() => structures.map((x, idx) => ({ x: x, z: activeWD, id: `struct-${idx}` })), [structures, activeWD]);

          const allZ = chartData.flatMap(d => d.segments.flat().map(p => p.z));
          const maxDepthRaw = allZ.length > 0 ? Math.max(maxWaterDepth + 10, ...allZ) : maxWaterDepth + 10;
          // v11: was hard-coded -15, clipping any fairlead above 15 m out of the Y domain.
          const minDepthRaw = Math.min(-5, (allZ.length > 0 ? Math.min(...allZ) : 0) - 5);   // U12
          let yInterval = 10;
          const depthRange = maxDepthRaw - minDepthRaw;
          if (depthRange > 750) yInterval = 50;
          else if (depthRange > 250) yInterval = 25;
          const minDepth = Math.floor(minDepthRaw / yInterval) * yInterval;
          const maxDepth = Math.ceil(maxDepthRaw / yInterval) * yInterval;
          const yTicks = []; for (let z = minDepth; z <= maxDepth + 0.1; z += yInterval) yTicks.push(Number(z.toFixed(1)));

          const allX = chartData.flatMap(d => d.segments.flat().map(p => p.x));
          const anchorsX = chartData.map(d => d.anchor?.x || 0);
          const maxXRaw = allX.length > 0 ? Math.max(100, ...allX, ...anchorsX, ...structures) : 100;
          let xInterval = 100;
          if (maxXRaw / xInterval > 20) xInterval = 200;
          if (maxXRaw / xInterval > 20) xInterval = 500;
          const maxX = Math.ceil(maxXRaw / xInterval) * xInterval;
          const xTicks = []; for (let x = 0; x <= maxX + 0.1; x += xInterval) xTicks.push(Number(x.toFixed(1)));

          const isDark = theme === 'dark';
          const buoyStroke = isDark ? '#EAEFF4' : '#26344A';

          const renderBuoyShape = (props) => {
              const { cx, cy, payload } = props;
              const isSlack = payload.isSlack;
              const lvl = buoyLevel(payload.utilization || 0, isSlack);
              const fillColor = BUOY_FILL[isDark ? 'dark' : 'light'][lvl];
              const showLabel = payload.showLabel || payload.caseId === hoverCaseId;
              return (
                  <g transform={`translate(${cx},${cy})`}>
                      <path d="M0,10 L-8,-4 L8,-4 Z" fill={fillColor} stroke={buoyStroke} strokeWidth={1.5} strokeDasharray={isSlack ? '2 2' : undefined} />
                      {showLabel && (
                          <text x={11} y={-5} fontSize={10} fill={isDark ? "#BCC8D8" : "#3C4C60"} fontWeight="600" style={{ paintOrder: 'stroke', stroke: isDark ? '#1C2839' : '#FFFFFF', strokeWidth: 3 }}>
                              B{payload.buoyNo} · {isSlack ? 'SLACK' : `${((payload.utilization || 0) * 100).toFixed(0)}% sub.`} · top {(payload.buoyTopZ ?? 0).toFixed(1)} / bot {(payload.buoyBottomZ ?? payload.pennantTopZ).toFixed(1)} m
                          </text>
                      )}
                  </g>
              );
          };

          const renderAnchorShape = (props) => {
              const { cx, cy, fill } = props;
              return <rect x={cx-5} y={cy-5} width={10} height={10} fill={fill} stroke={buoyStroke} strokeWidth={1} />;
          };

          const renderStructureShape = (props) => {
              const { cx, cy, payload } = props;
              return (
                  <g transform={`translate(${cx},${cy})`} style={{ pointerEvents: 'none' }}>
                      <rect x={-14} y={-20} width={28} height={20} fill={isDark ? "rgba(239, 68, 68, 0.15)" : "rgba(239, 68, 68, 0.1)"} stroke={isDark ? "#FF5C5C" : "#C42B2B"} strokeWidth={1} strokeDasharray="2 2" rx={3} />
                      <rect x={-8} y={-10} width={16} height={10} fill={isDark ? "#FF5C5C" : "#C42B2B"} rx={1} stroke="none" />
                      <path d="M-14 -20 L-6 -20" stroke={isDark ? "#FF5C5C" : "#C42B2B"} strokeWidth={1} />
                      <path d="M6 -20 L14 -20" stroke={isDark ? "#FF5C5C" : "#C42B2B"} strokeWidth={1} />
                      <text x={0} y={-24} textAnchor="middle" fill={isDark ? "#FF5C5C" : "#C42B2B"} fontSize={9} fontWeight="700" style={{textShadow: isDark ? '0 1px 2px rgba(0,0,0,0.8)' : 'none'}}>STRUCT</text>
                  </g>
              );
          };

          return (
              <div className="flex-1 bg-white dark:bg-gray-850 border border-gray-200 dark:border-gray-800 rounded-xl p-1 relative min-h-[400px] flex flex-col shadow-card">
                  <div className="flex flex-wrap items-center justify-between gap-2 px-3 pt-2 pb-1">
                      <h3 className="text-gray-700 dark:text-gray-200 text-xs font-semibold flex items-center gap-2">
                          <IconSettings2 size={14} className="text-accent-600 dark:text-accent-500"/> Catenary Profile
                          <span className="font-normal text-gray-500 dark:text-gray-400">· {activeCfg?.projectName} · WD {activeWD} m</span>
                      </h3>
                      <div className="flex flex-wrap gap-x-4 gap-y-1 text-[11px] text-gray-600 dark:text-gray-400 select-none">
                          <span className="flex items-center gap-1.5"><svg width="24" height="6"><line x1="0" y1="3" x2="24" y2="3" stroke="currentColor" strokeWidth="2"/></svg>Wire / Fiber</span>
                          <span className="flex items-center gap-1.5"><svg width="24" height="6"><line x1="0" y1="3" x2="24" y2="3" stroke="currentColor" strokeWidth="3.5" strokeDasharray="7 3"/></svg>Chain</span>
                          <span className="flex items-center gap-1.5"><svg width="24" height="6"><line x1="0" y1="3" x2="24" y2="3" stroke={isDark ? '#F5A524' : '#A85D00'} strokeWidth="2" strokeDasharray="2 2"/></svg>Pennant</span>
                          <span className="flex items-center gap-1.5"><svg width="24" height="6"><line x1="0" y1="3" x2="24" y2="3" stroke="currentColor" strokeWidth="2" strokeDasharray="2 4" strokeOpacity="0.55"/></svg>Invalid case</span>
                          {['ok', 'warn', 'bad'].map(l => (
