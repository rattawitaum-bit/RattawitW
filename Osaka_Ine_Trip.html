<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F5">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Osaka – Ine 2026 • v4.5</title>
<style>
:root{
  --bg:#FAF7F5;--surface:#FFFFFF;--surface2:#F5F1EE;--ink:#1C1917;--ink2:#44403C;--sub:#78716C;--line:#EDE7E2;
  --accent:#E8577A;--accent-soft:#FDE8EE;
  --ok:#047857;--ok-soft:#E7F6EF;--warn:#B45309;--warn-soft:#FEF6E7;--bad:#C2410C;--bad-soft:#FDEEE6;--info-soft:#EAF0FD;
  --note:#FFFBEB;--note-line:#F5E6B8;
  --r-lg:22px;--r:16px;
  --sh:0 1px 2px rgba(28,25,23,.04),0 4px 16px rgba(28,25,23,.05);
  --nav-h:66px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai","Leelawadee UI","Sukhumvit Set",Thonburi,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 20px)}
a{color:inherit}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}input,textarea{font:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:rgba(250,247,245,.88);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);padding-top:var(--safe-t)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px;flex:0 0 auto;transition:background .3s}
.brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.brand .s{font-size:12px;color:var(--sub)}
.clk{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:12px;color:var(--sub)}
.clk b{font-size:15px;color:var(--ink);font-weight:800}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;margin:0 -16px;padding:0 16px 10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:center;width:54px;height:62px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1;transition:all .2s;position:relative}
.chip .w{font-size:11px;color:var(--sub);font-weight:600}
.chip b{font-size:18px;font-weight:800}
.chip .i{font-size:13px}
.chip .nd{position:absolute;top:5px;right:6px;font-size:9px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px -6px var(--accent)}
.chip.on .w{color:rgba(255,255,255,.85)}
.chip.today{border:2px solid var(--accent)}
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin:14px 0;box-shadow:var(--sh)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.sec h3{font-size:15px;margin:0;font-weight:800;letter-spacing:-.1px}
.muted{color:var(--sub);font-size:13px}
.hero{border-radius:var(--r-lg);padding:18px;margin:6px 0 14px;color:#fff;position:relative;overflow:hidden;box-shadow:0 10px 28px -14px rgba(0,0,0,.35)}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .date{font-size:12.5px;font-weight:700;opacity:.9;letter-spacing:.2px}
.hero h2{font-size:21px;line-height:1.3;margin:4px 0;font-weight:800;letter-spacing:-.3px;position:relative;z-index:1}
.hero .s{font-size:13px;opacity:.92;position:relative;z-index:1}
.wx{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;position:relative;z-index:1}
.wx .t{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.5px}
.wx .t small{font-size:14px;font-weight:700;opacity:.85}
.pill{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}
.wxtxt{font-size:12.5px;opacity:.92;margin-top:6px;position:relative;z-index:1}
.note{border-radius:var(--r);padding:12px 14px;font-size:13.5px;margin:12px 0;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.note .ni{font-size:18px;line-height:1.2}
.note.warn{background:var(--warn-soft);color:#78350F}
.note.ok{background:var(--ok-soft);color:#064E3B}
.note.info{background:var(--info-soft);color:#1E3A8A}
.tl{position:relative;padding-left:4px}
.tl::before{content:'';position:absolute;left:61px;top:18px;bottom:18px;width:2px;background:var(--line);border-radius:2px}
.ev{display:grid;grid-template-columns:48px 20px 1fr;gap:0 8px;padding:10px 0;position:relative}
.ev .tm{font-weight:800;font-size:14.5px;padding-top:1px;text-align:right}
.ev .dot{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid #D6CFC9;margin:5px auto 0;position:relative;z-index:1}
.ev.key .dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.ev.opt .dot{border-style:dashed}
.ev .tt{font-weight:700;font-size:15px;line-height:1.4}
.ev .dt{font-size:13.5px;color:var(--ink2);margin-top:3px}
.ev.done{opacity:.42}
.ev.now{background:var(--accent-soft);border-radius:14px;margin:0 -8px;padding:10px 8px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;vertical-align:2px;margin-left:4px;background:var(--surface2);color:var(--sub)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:12px;font-size:13.5px;font-weight:700;background:var(--surface2);text-decoration:none;color:var(--ink);transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.p{background:var(--accent);color:#fff}
.btn.full{width:100%}
.btn.lg{min-height:48px;font-size:15px;border-radius:14px}
.btn.sm{min-height:34px;padding:6px 12px;font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.wait{background:var(--warn-soft);color:var(--warn)}.tag.no{background:var(--bad-soft);color:var(--bad)}.tag.g{background:var(--surface2);color:var(--ink2)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--surface2);padding:3px 8px;border-radius:8px;word-break:break-all}
.bkrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin-top:8px;background:var(--surface2);border-radius:12px;padding:10px 12px}
.kv span:nth-child(odd){color:var(--sub);white-space:nowrap}
.kv span:nth-child(even){font-weight:600;word-break:break-word}
.nn .lab{font-size:11.5px;font-weight:800;letter-spacing:.6px;opacity:.85;text-transform:uppercase}
.nn .big{font-size:20px;font-weight:800;line-height:1.3;letter-spacing:-.2px}
.nn > div + div{margin-top:12px}
.tone{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700}
.sw{display:inline-block;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12);flex:0 0 auto}
.sws{display:flex}.sws .sw+.sw{margin-left:-6px}
.od{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.op{border-radius:var(--r);padding:12px;background:var(--surface2);font-size:13.5px;line-height:1.5}
.op b{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.ly{border:1px solid var(--line);border-radius:12px;padding:8px;font-size:12.5px;text-align:center;line-height:1.35}
.ly i{display:block;font-style:normal;font-size:10.5px;color:var(--sub);font-weight:700;margin-bottom:2px}
.ly.off{color:var(--sub);background:var(--surface2);border-color:transparent}
.tips{margin-top:10px;display:grid;gap:6px}
.tip{display:flex;gap:8px;font-size:13px;color:var(--ink2)}
.tip span:first-child{flex:0 0 18px}
.row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.row:last-child{border-bottom:0}
.row .ic{width:38px;height:38px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.row .bd{flex:1;min-width:0}
.row .ti{font-weight:700;font-size:14.5px;line-height:1.35}
.row input{width:100%;margin-top:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);font-size:16px;background:var(--bg)}
.row input:focus{outline:2px solid var(--accent);outline-offset:-1px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:10px 4px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{font-size:12px;color:var(--sub);font-weight:700}
tr:last-child td{border-bottom:0}
.click{cursor:pointer}
.prog{margin:10px 0}
.prog .l{display:flex;justify-content:space-between;font-size:14px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qc{background:var(--surface2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px}
.qc .th{aspect-ratio:1;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;font-size:12px;color:var(--sub);text-align:center;padding:6px;border:1.5px dashed #D6CFC9}
.qc .th.has{border:0;padding:4px}
.qc .th img{width:100%;height:100%;object-fit:contain}
.qc .t{font-size:13px;font-weight:800;line-height:1.3}
.qc .s{font-size:11.5px;color:var(--sub)}
.qc .mini{display:flex;gap:6px}
.qc .mini .btn{min-height:34px;font-size:12px;padding:6px 10px;flex:1;background:#fff}
.ck{display:flex;align-items:center;gap:12px;min-height:46px;padding:4px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.ck:last-child{border-bottom:0}
.ck input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid #D6CFC9;flex:0 0 auto;display:grid;place-items:center;transition:all .15s;margin:0}
.ck input:checked{background:var(--accent);border-color:var(--accent)}
.ck input:checked::after{content:'✓';color:#fff;font-size:13px;font-weight:900}
.ck.done span{color:var(--sub);text-decoration:line-through}
.grp{font-size:12px;font-weight:800;color:var(--sub);margin:14px 0 2px;letter-spacing:.3px}
/* Notes */
.ncard{background:var(--note);border:1px solid var(--note-line)}
.ncard textarea{width:100%;min-height:110px;resize:vertical;border:0;border-radius:12px;padding:12px;font-size:16px;line-height:1.6;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--note-line)}
.ncard textarea:focus{outline:2px solid #E5B94A;outline-offset:0}
.nstat{font-size:12px;color:var(--sub);display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.nstat .saved{color:var(--ok);font-weight:700}
.nprev{white-space:pre-wrap;font-size:13.5px;color:var(--ink2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qadd{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.qadd .btn{background:#fff;box-shadow:inset 0 0 0 1px var(--note-line)}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.bn .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--nav-h);padding:6px 4px}
nav.bn button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--sub);border-radius:14px;position:relative;transition:all .2s}
nav.bn button .e{font-size:20px;line-height:1;filter:grayscale(.6);opacity:.75;transition:all .2s}
nav.bn button.on{color:var(--accent);background:var(--accent-soft)}
nav.bn button.on .e{filter:none;opacity:1;transform:translateY(-1px)}
nav.bn .dot{position:absolute;top:8px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid #fff}
.modal{position:fixed;inset:0;z-index:50;background:#fff;display:none;flex-direction:column;padding:calc(var(--safe-t) + 12px) 18px calc(var(--safe-b) + 16px)}
.modal.open{display:flex;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
.modal .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.modal .qbig{flex:1;display:flex;align-items:center;justify-content:center;margin:12px 0;min-height:0}
.modal .qbig img{max-width:100%;max-height:100%;object-fit:contain}
.x{width:44px;height:44px;border-radius:50%;background:var(--surface2);font-size:18px;font-weight:800;flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);transform:translateX(-50%) translateY(8px);background:#1C1917;color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:all .2s;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%)}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:.3}to{opacity:1}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:370px){.od{grid-template-columns:1fr}.wrap{padding:0 12px}.hero h2{font-size:19px}nav.bn button{font-size:10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .fcard{border-left:4px solid var(--accent)}
  .fl{display:grid;gap:8px}
  .fi{background:var(--surface2);border-radius:12px;padding:10px 12px;cursor:pointer}
  .fn{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .fn b{font-size:14.5px;line-height:1.35}
  .fp{font-weight:800;font-size:12.5px;color:var(--accent);text-align:right;max-width:46%}
  .fw{font-size:13px;color:var(--ink2);margin-top:2px}
  .opts{display:grid;gap:8px;margin-top:10px}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .opt .sws{padding-top:3px;flex:0 0 auto}
  .scard .tips{margin-top:0}
  nav.bn button{font-size:10.5px}
  nav.bn button .e{font-size:19px}
  </style>
</head>

<header><div class="wrap">
  <div class="hd">
    <div class="brand"><div class="logo" id="logo">🌸</div><div style="min-width:0"><h1>Osaka – Ine 2026</h1><div class="s">12–18 พ.ย. • 2 คู่ 4 คน</div></div></div>

/* ===== TIME ===== */
function jstNow(){const n=new Date();return new Date(n.getTime()+(n.getTimezoneOffset()+540)*60000)}
function hm2min(s){const m=/^(\d{1,2}):(\d{2})/.exec(s||'');return m?(+m[1])*60+(+m[2]):null}
function min2hm(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function flightTime(f){const b=BOOKINGS.find(x=>x.flight===f);return hm2min((S.bk[b.id]||'').trim())}
function resolveT(t){
  if(t==='@XJ612'||t==='@XJ611'){const m=flightTime(t.slice(1));return m==null?{txt:'—',min:null}:{txt:min2hm(m),min:m}}
  if(t==='@LEAVE'){const m=flightTime('XJ611');return m==null?{txt:'≈15:30',min:930}:{txt:min2hm(m-240),min:m-240}}
  return {txt:t||'',min:hm2min(t)}}
function tripDay(){const j=jstNow();return(j.getFullYear()===2026&&j.getMonth()===10&&j.getDate()>=12&&j.getDate()<=18)?j.getDate():null}
const nowMin=()=>{const j=jstNow();return j.getHours()*60+j.getMinutes()};
function stamp(ts){if(!ts)return'';const d=new Date(ts);return d.toLocaleDateString('th-TH',{day:'numeric',month:'short'})+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

function noteBox(id,title,ph,ic){
  const v=S.notes[id]||'';
  return `<div class="card ncard"><div class="sec"><h3>${ic||'📝'} ${esc(title)}</h3>${v.trim()?`<button class="btn sm" style="background:#fff" onclick="shareNote('${id}','${esc(title)}')">💬 ส่ง</button>`:''}</div>
   <div class="qadd">${QUICK.map(s=>`<button class="btn sm" onclick="addLine('${id}','${s}')">${s.trim()||s}</button>`).join('')}<button class="btn sm" onclick="addLine('${id}','⏰ '+min2hm(nowMin())+' ')">🕐 เวลา</button></div>

   <div class="nstat"><span id="ns_${id}">${S.nts[id]?'บันทึกในเครื่องแล้ว • '+stamp(S.nts[id]):'บันทึกอัตโนมัติขณะพิมพ์'}</span>${v.trim()?`<button class="btn sm" style="background:#fff" onclick="clearNote('${id}')">🗑️ ล้าง</button>`:''}</div></div>`}

function noteInput(id,v){S.notes[id]=v;const el=document.getElementById('ns_'+id);if(el)el.textContent='กำลังบันทึก…';clearTimeout(nT[id]);nT[id]=setTimeout(()=>noteFlush(id),500)}
function noteFlush(id){clearTimeout(nT[id]);delete nT[id];S.nts[id]=Date.now();if(save()){const el=document.getElementById('ns_'+id);if(el){el.innerHTML='<span class="saved">✓ บันทึกในเครื่องแล้ว</span> • '+stamp(S.nts[id])}}renderChips();updNoteDot()}
function addLine(id,pre){const ta=document.getElementById('ta_'+id);if(!ta)return;const v=ta.value;ta.value=v+(v&&!v.endsWith('\n')?'\n':'')+pre;ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);noteInput(id,ta.value)}
function clearNote(id){if(!confirm('ล้างโน้ตนี้ทั้งหมด?'))return;S.notes[id]='';S.nts[id]=Date.now();save();render();toast('ล้างโน้ตแล้ว')}

function evHtml(e,isToday,nextMin){const r=resolveT(e.t);let cls='ev'+(e.key?' key':'')+(e.opt?' opt':'');
  if(isToday&&r.min!=null){if(r.min+60<nowMin())cls+=' done';if(r.min===nextMin)cls+=' now'}
  const m=mapLink(e),a=[];
  if(m)a.push(`<a class="btn" href="${m}" target="_blank" rel="noopener">🧭 นำทาง</a>`);
  if(e.tel)a.push(`<a class="btn" href="tel:${e.tel}">📞 โทร</a>`);
  if(e.qr)a.push(`<button class="btn p" onclick="openQr('${e.qr[0]}','${e.qr.join(',')}')">🔳 QR (${e.qr.length})</button>`);
  return `<div class="${cls}"><div class="tm num">${esc(r.txt)||''}</div><div><div class="dot"></div></div><div><div class="tt">${esc(e.title)}${e.opt?'<span class="badge">ทางเลือก</span>':''}</div>${e.dt?`<div class="dt">${esc(e.dt)}</div>`:''}${e.bk?bkTag(e.bk):''}${a.length?`<div class="acts">${a.join('')}</div>`:''}</div></div>`}

function openQr(id,list){qList=list?list.split(','):VOUCHERS.filter(v=>img(v.id)).map(v=>v.id);if(!qList.includes(id))qList.unshift(id);qIdx=qList.indexOf(id);showQr();document.getElementById('qm').classList.add('open');document.body.style.overflow='hidden';lockWake();history.pushState({qr:1},'')}
function showQr(){const v=VOUCHERS.find(x=>x.id===qList[qIdx]),im=img(v.id);
  document.getElementById('qmTag').textContent=v.g+` • ${qIdx+1}/${qList.length}`;document.getElementById('qmTitle').textContent=v.t;const qc=document.getElementById('qmCode');qc.textContent=v.c;qc.style.display=v.c?'inline-block':'none';document.getElementById('qmSub').textContent=v.s;
  document.getElementById('qmBody').innerHTML=im?`<img src="${im}" alt="">`:`<div style="text-align:center"><div style="font-size:44px">⚠️</div><b>ยังไม่ได้แนบรูป QR</b><div class="muted">เปิดจาก PDF / แอป Klook แทน</div><button class="btn p lg" style="margin-top:12px" onclick="pickImg('${v.id}')">📷 แนบรูปตอนนี้</button></div>`}
function stepQr(n){qIdx=(qIdx+n+qList.length)%qList.length;showQr()}
function closeQr(fromPop){document.getElementById('qm').classList.remove('open');document.body.style.overflow='';if(wake){wake.release().catch(()=>{});wake=null}if(!fromPop&&history.state&&history.state.qr)history.back()}
window.addEventListener('popstate',()=>{if(document.getElementById('qm').classList.contains('open'))closeQr(true)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushAll();if(document.visibilityState==='visible'&&document.getElementById('qm').classList.contains('open'))lockWake()});
window.addEventListener('pagehide',flushAll);
(function(){let x0=null;const m=document.getElementById('qm');m.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});m.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>60)stepQr(dx<0?1:-1);x0=null},{passive:true})})();
(function(){let x0=null,y0=null;const v=document.getElementById('v-plan');v.addEventListener('touchstart',e=>{if(e.target.closest('textarea,input')){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});v.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)pickDay(S.day+(dx<0?1:-1));x0=null},{passive:true})})();
function backup(){flushAll();const file=new File([JSON.stringify({bk:S.bk,st:S.st,img:S.img,ck:S.ck,notes:S.notes,nts:S.nts})],'osaka_trip_backup.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:'Osaka trip backup'}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}toast('สร้างไฟล์สำรองแล้ว 💾')}
document.getElementById('fBk').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{try{const d=JSON.parse(x.target.result);
  ['bk','st','img','ck'].forEach(k=>S[k]=Object.assign({},S[k],d[k]||{}));
  /* โน้ต: ถ้าทั้งสองเครื่องมีโน้ตหัวข้อเดียวกัน ให้ต่อท้าย ไม่เขียนทับ */
  const dn=d.notes||{};Object.keys(dn).forEach(id=>{const mine=(S.notes[id]||'').trim(),theirs=(dn[id]||'').trim();if(!theirs||mine===theirs||mine.includes(theirs))return;if(theirs.includes(mine)){S.notes[id]=theirs;S.nts[id]=Date.now();return}S.notes[id]=mine?mine+'\n— จากอีกเครื่อง —\n'+theirs:theirs;S.nts[id]=Date.now()});
  save();render();toast('กู้คืนเรียบร้อย ✓')}catch(err){toast('ไฟล์ไม่ถูกต้อง')}};r.readAsText(f);e.target.value=''});
function tickCountdown(){document.querySelectorAll('.cd[data-to]').forEach(el=>{const d=(+el.dataset.to)-nowMin();el.textContent=d<=0?'• ถึงเวลาแล้ว':d<60?`• อีก ${d} นาที`:`• อีก ${Math.floor(d/60)} ชม. ${d%60} นาที`})}
function tick(){const m=nowMin();document.getElementById('cJ').textContent=min2hm(m);document.getElementById('cT').textContent='🇹🇭 '+min2hm(m-120);tickCountdown()}
let lastMin=-1;setInterval(()=>{tick();const m=jstNow().getMinutes();if(m!==lastMin){lastMin=m;if(S.view==='today'&&!document.querySelector('input:focus,textarea:focus'))renderToday()}},15000);
if(!S.view||tripDay())S.view='today';
tick();render();
</script>
</body>
</html>
