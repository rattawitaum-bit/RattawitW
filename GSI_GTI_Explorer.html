forms","target":"jackup_placement","directed":true,"assertionKind":"stated","note":""},{"id":"e090","source":"q_platform","relation":"needs","target":"positioning","directed":true,"assertionKind":"mapping","note":""},{"id":"e091","source":"q_platform","relation":"needs","target":"mbes","directed":true,"assertionKind":"mapping","note":""},{"id":"e092","source":"q_platform","relation":"needs","target":"sss","directed":true,"assertionKind":"mapping","note":""},{"id":"e093","source":"q_platform","relation":"needs","target":"mag","directed":true,"assertionKind":"mapping","note":""},{"id":"e094","source":"q_platform","relation":"needs","target":"sbp","directed":true,"assertionKind":"mapping","note":""},{"id":"e095","source":"q_platform","relation":"needs","target":"hr2d","directed":true,"assertionKind":"mapping","note":""},{"id":"e096","source":"q_platform","relation":"needs","target":"existing_data","directed":true,"assertionKind":"mapping","note":""},{"id":"e097","source":"q_platform","relation":"needs","target":"borehole","directed":true,"assertionKind":"mapping","note":""},{"id":"e098","source":"q_platform","relation":"needs","target":"cpt","directed":true,"assertionKind":"mapping","note":""},{"id":"e099","source":"q_platform","relation":"needs","target":"lab","directed":true,"assertionKind":"mapping","note":""},{"id":"e100","source":"q_pipeline","relation":"needs","target":"positioning","directed":true,"assertionKind":"mapping","note":""},{"id":"e101","source":"q_pipeline","relation":"needs","target":"mbes","directed":true,"assertionKind":"mapping","note":""},{"id":"e102","source":"q_pipeline","relation":"needs","target":"sss","directed":true,"assertionKind":"mapping","note":""},{"id":"e103","source":"q_pipeline","relation":"needs","target":"mag","directed":true,"assertionKind":"mapping","note":""},{"id":"e104","source":"q_pipeline","relation":"needs","target":"sbp","directed":true,"assertionKind":"mapping","note":""},{"id":"e105","source":"q_pipeline","relation":"needs","target":"existing_data","directed":true,"assertionKind":"mapping","note":""},{"id":"e106","source":"q_pipeline","relation":"needs","target":"cpt","directed":true,"assertionKind":"mapping","note":""},{"id":"e107","source":"q_jackup","relation":"needs","target":"positioning","directed":true,"assertionKind":"mapping","note":""},{"id":"e108","source":"q_jackup","relation":"needs","target":"mbes","directed":true,"assertionKind":"mapping","note":""},{"id":"e109","source":"q_jackup","relation":"needs","target":"sss","directed":true,"assertionKind":"mapping","note":""},{"id":"e110","source":"q_jackup","relation":"needs","target":"mag","directed":true,"assertionKind":"mapping","note":""},{"id":"e111","source":"q_jackup","relation":"needs","target":"sbp","directed":true,"assertionKind":"mapping","note":""},{"id":"e112","source":"q_jackup","relation":"needs","target":"hr2d","directed":true,"assertionKind":"mapping","note":""},{"id":"e113","source":"q_jackup","relation":"needs","target":"existing_data","directed":true,"assertionKind":"mapping","note":""},{"id":"e114","source":"q_jackup","relation":"needs","target":"borehole","directed":true,"assertionKind":"mapping","note":""},{"id":"e115","source":"q_jackup","relation":"needs","target":"cpt","directed":true,"assertionKind":"mapping","note":""},{"id":"e116","source":"q_jackup","relation":"needs","target":"rig_data","directed":true,"assertionKind":"mapping","note":""},{"id":"e117","source":"reference_frame","relation":"applies_to","target":"positioning","directed":true,"assertionKind":"stated","note":"Same frame for every dataset"},{"id":"e118","source":"reference_frame","relation":"applies_to","target":"mbes","directed":true,"assertionKind":"stated","note":"Same frame for every dataset"},{"id":"e119","source":"reference_frame","relation":"applies_to","target":"sss","directed":true,"assertionKind":"stated","note":"Same frame for every dataset"},{"id":"e120","source":"reference_frame","relation":"applies_to","target":"mag","directed":true,"assertionKind":"stated","note":"Same frame for every dataset"},{"id":"e121","source":"reference_frame","relation":"applies_to","target":"sbp","directed":true,"assertionKind":"stated","note":"Same frame for every dataset"},{"id":"e122","source":"reference_frame","relation":"applies_to","target":"hr2d","directed":true,"assertionKind":"stated","note":"Same frame for every dataset"},{"id":"e123","source":"reference_frame","relation":"applies_to","target":"borehole","directed":true,"assertionKind":"stated","note":"Same frame for every dataset"},{"id":"e124","source":"reference_frame","relation":"applies_to","target":"cpt","directed":true,"assertionKind":"stated","note":"Same frame for every dataset"},{"id":"e125","source":"seismic_section","relation":"informs","target":"time_depth","directed":true,"assertionKind":"stated","note":"Time needs converting"},{"id":"e126","source":"borehole","relation":"informs","target":"time_depth","directed":true,"assertionKind":"mapping","note":"Borehole ties calibrate the velocity model"},{"id":"e127","source":"time_depth","relation":"informs","target":"ground_model","directed":true,"assertionKind":"stated","note":""},{"id":"e128","source":"existing_data","relation":"needs","target":"data_age","directed":true,"assertionKind":"stated","note":"How old is it?"},{"id":"e129","source":"data_age","relation":"informs","target":"targeted_investigation","directed":true,"assertionKind":"mapping","note":"May prompt re-survey"},{"id":"e130","source":"data_age","relation":"applies_to","target":"jackup_placement","directed":true,"assertionKind":"mapping","note":"Recent seabed check before a rig move"},{"id":"e131","source":"seabed_sampling","relation":"informs","target":"sonar_image","directed":true,"assertionKind":"mapping","note":"Explains texture"},{"id":"e132","source":"seabed_sampling","relation":"informs","target":"ground_model","directed":true,"assertionKind":"mapping","note":"Surface material"},{"id":"e133","source":"visual_confirm","relation":"checks","target":"debris","directed":true,"assertionKind":"stated","note":"Confirms identity"},{"id":"e134","source":"sonar_image","relation":"needs","target":"visual_confirm","directed":true,"assertionKind":"mapping","note":"When a contact matters"},{"id":"e135","source":"bathymetry","relation":"may_show","target":"free_span","directed":true,"assertionKind":"stated","note":""},{"id":"e136","source":"sonar_image","relation":"may_show","target":"free_span","directed":true,"assertionKind":"stated","note":""},{"id":"e137","source":"mag_map","relation":"may_show","target":"crossing","directed":true,"assertionKind":"stated","note":""},{"id":"e138","source":"sonar_image","relation":"may_show","target":"crossing","directed":true,"assertionKind":"stated","note":""},{"id":"e139","source":"free_span","relation":"informs","target":"pipeline_route","directed":true,"assertionKind":"mapping","note":""},{"id":"e140","source":"crossing","relation":"informs","target":"pipeline_route","directed":true,"assertionKind":"mapping","note":""},{"id":"e141","source":"bathymetry","relation":"may_show","target":"spudcan_footprint","directed":true,"assertionKind":"stated","note":""},{"id":"e142","source":"spudcan_footprint","relation":"informs","target":"jackup_placement","directed":true,"assertionKind":"mapping","note":""},{"id":"e143","source":"spudcan_footprint","relation":"informs","target":"leg_penetration","directed":true,"assertionKind":"mapping","note":"Can make legs slide"},{"id":"e144","source":"cpt_profile","relation":"documented_in","target":"factual_report","directed":true,"assertionKind":"stated","note":""},{"id":"e145","source":"lab_results","relation":"documented_in","target":"factual_report","directed":true,"assertionKind":"stated","note":""},{"id":"e146","source":"bathymetry","relation":"documented_in","target":"factual_report","directed":true,"assertionKind":"stated","note":""},{"id":"e147","source":"seismic_section","relation":"documented_in","target":"factual_report","directed":true,"assertionKind":"stated","note":""},{"id":"e148","source":"ground_model","relation":"documented_in","target":"interpretive_report","directed":true,"assertionKind":"stated","note":""},{"id":"e149","source":"possible_gas","relation":"documented_in","target":"interpretive_report","directed":true,"assertionKind":"mapping","note":""},{"id":"e150","source":"soil_params","relation":"documented_in","target":"interpretive_report","directed":true,"assertionKind":"stated","note":""},{"id":"e151","source":"factual_report","relation":"informs","target":"interpretive_report","directed":true,"assertionKind":"stated","note":"Interpretation rests on facts"},{"id":"e152","source":"q_platform","relation":"needs","target":"reference_frame","directed":true,"assertionKind":"mapping","note":""},{"id":"e153","source":"q_pipeline","relation":"needs","target":"reference_frame","directed":true,"assertionKind":"mapping","note":""},{"id":"e154","source":"q_jackup","relation":"needs","target":"reference_frame","directed":true,"assertionKind":"mapping","note":""},{"id":"e155","source":"q_jackup","relation":"needs","target":"data_age","directed":true,"assertionKind":"mapping","note":""},{"id":"e156","source":"q_pipeline","relation":"needs","target":"seabed_sampling","directed":true,"assertionKind":"mapping","note":""},{"id":"e157","source":"sonar_image","relation":"documented_in","target":"factual_report","directed":true,"assertionKind":"stated","note":""},{"id":"e158","source":"mag_map","relation":"documented_in","target":"factual_report","directed":true,"assertionKind":"stated","note":""},{"id":"e159","source":"shallow_section","relation":"documented_in","target":"factual_report","directed":true,"assertionKind":"stated","note":""},{"id":"e160","source":"samples","relation":"documented_in","target":"factual_report","directed":true,"assertionKind":"stated","note":""},{"id":"e161","source":"artefact","relation":"documented_in","target":"interpretive_report","directed":true,"assertionKind":"mapping","note":"Alternative explanations are reported too"}],"chapters":[{"id":0,"title":"Why look before we build","page":"story","scene":"hero","focusNodes":["q_platform","q_pipeline","q_jackup"],"cam":{"x":0,"y":0,"k":1},"mfx":420,"durationMs":9000,"caption":"Offshore structures stand on ground nobody can see. Site investigation is how we look before we build — and reduce surprises later.","misconception":"\"The seabed is just flat sand.\" It hides objects, layers, channels and sometimes gas.","view3D":{"cam":[150,120,300],"target":[-100,-20,-10],"orbit":true}},{"id":1,"title":"Start with the question","page":"story","scene":"field","focusNodes":["q_platform","q_pipeline","q_jackup"],"cam":{"x":0,"y":0,"k":1},"mfx":760,"durationMs":17900,"caption":"A platform, a pipeline and a jack-up rig each ask different things of the ground. Tap one to see which evidence it needs.","misconception":"\"Run every survey everywhere.\" Good investigation starts from the question.","view3D":{"cam":[20,190,330],"target":[10,-25,-5]},"beats":[{"label":"Platform: where can it stand?","text":"A fixed platform needs a place to stand — and ground that can carry it.","sel":"q_platform","at":0},{"label":"Pipeline: which route?","text":"A pipeline crosses a long strip of seabed. It asks about slopes, objects and what lies along the way.","sel":"q_pipeline","at":0.296},{"label":"Jack-up: can its legs stand?","text":"A jack-up rig asks how far its legs will sink — and whether the soil can carry it.","sel":"q_jackup","at":0.656}]},{"id":2,"title":"Plan and position the survey","page":"gsi","tab":"survey","scene":"survey","focusNodes":["positioning","reference_frame"],"cam":{"x":0,"y":0,"k":1},"mfx":1000,"durationMs":18700,"caption":"Survey lines are planned to cover the area. Every sensor is tied to a precise position — and every dataset to a stated coordinate frame and depth reference.","misconception":"\"The ship knows where it is, so the sensors do too.\" Towed sensors trail behind.","view3D":{"cam":[-150,75,-150],"target":[5,-14,20]},"beats":[{"label":"Plan the lines","text":"Survey lines are planned to cover the whole area. Finished swaths are blue; planned lines are dashed.","sel":"mbes","at":0},{"label":"Tie every sensor to a position","text":"The vessel's position, its motion and every offset are combined, so each measurement has a place.","sel":"positioning","at":0.313},{"label":"One coordinate frame and datum","text":"All data is stated in one coordinate frame and depth reference. Without it, the same place can plot in two different spots.","sel":"reference_frame","at":0.6107}]},{"id":3,"title":"Read the seabed","page":"gsi","tab":"seabed","scene":"seabed","focusNodes":["mbes","sss","mag","visual_confirm"],"overlays":{"mbes":true,"sss":true,"mag":true},"cam":{"x":0,"y":0,"k":1},"mfx":800,"durationMs":24600,"caption":"Multibeam maps shape, side scan sonar shows texture and shadows, the magnetometer finds metal. Important contacts are confirmed with a camera.","misconception":"\"Shape alone tells us what it is.\" Combine all three before deciding.","view3D":{"cam":[0,92,118],"target":[0,-2,4]},"beats":[{"label":"MBES: the shape of the seabed","text":"Multibeam sound maps depth and shape — slopes, mounds, dips and objects — but not what they are made of.","sel":"mbes","ov":{"mbes":true},"at":0},{"label":"Side scan sonar: texture and shadows","text":"Side scan sonar images texture. Raised objects cast acoustic shadows, which helps spot debris and boulders.","sel":"sss","ov":{"sss":true},"at":0.2733},{"label":"Magnetometer: where there is metal","text":"The magnetometer responds to iron and steel, even when buried. A contact with a response is probably man-made.","sel":"mag","ov":{"mag":true},"at":0.5},{"label":"Combine, then confirm with a camera","text":"No single view identifies a contact. Combine all three, then check important contacts with an ROV or camera.","sel":"visual_confirm","ov":{"mbes":true,"sss":true,"mag":true,"cam":true},"at":0.75}]},{"id":4,"title":"Look below the seabed","page":"gsi","tab":"below","scene":"below","focusNodes":["sbp","hr2d","time_depth"],"overlays":{"tdc":true},"cam":{"x":0,"y":0,"k":1},"mfx":640,"durationMs":18400,"caption":"SBP shows shallow layers in fine detail; 2D HR seismic sees deeper with less detail. Both record travel time — depth needs a velocity model.","misconception":"\"SBP and seismic are the same.\" One trades depth for detail.","beats":[{"label":"SBP: fine detail, shallow","text":"The sub-bottom profiler sees the first layers below the seabed in fine detail — but not very deep.","sel":"sbp","ov":{},"at":0},{"label":"2D HR seismic: deeper, coarser","text":"2D high-resolution seismic sees deeper with less detail — and only along its survey lines.","sel":"hr2d","ov":{},"at":0.3333},{"label":"Time is not depth","text":"Both record travel time. Turning time into depth needs a velocity model — an estimate of sound speed in each layer.","sel":"time_depth","ov":{"tdc":true},"at":0.6202}]},{"id":5,"title":"Shallow gas and other signs","page":"gsi","tab":"below","scene":"below","focusNodes":["bright_spot","possible_gas"],"overlays":{"bright":true,"blank":true,"pull":true,"fault":true,"channel":true},"cam":{"x":-344,"y":-330,"k":1.3},"mfx":1000,"durationMs":34700,"caption":"Bright spots, blanking and pull-down may mean gas — or sand, or a processing effect. No sign is not proof of no gas.","misconception":"\"No bright spot means no gas.\" Absence of a sign is not proof.","beats":[{"label":"Bright spot: a very strong reflection","text":"A reflection much stronger than its neighbours. It may be gas trapped in a porous layer — or simply a change in soil type.","sel":"bright_spot","ov":{"bright":true},"at":0},{"label":"Acoustic blanking: the picture fades","text":"Where gas scatters sound, layers fade into noise. Blank means “cannot see”, not “nothing there”.","sel":"blanking","ov":{"bright":true,"blank":true},"at":0.2263},{"label":"Pull-down: layers sag below","text":"Sound travels slower through gas, so layers beneath look pulled down. The ground is not really bent.","sel":"pull_down","ov":{"bright":true,"blank":true,"pull":true},"at":0.3786},{"label":"Other features: faults and channels","text":"Faults and buried channels also change the picture. They are part of the geology — not always signs of gas.","sel":"fault","ov":{"bright":true,"blank":true,"pull":true,"fault":true,"channel":true},"at":0.5473},{"label":"Together: possible gas — not proven","text":"Several signs together suggest possible shallow gas. It stays an interpretation: sand or a processing effect can look similar, and no sign is not proof of no gas.","sel":"possible_gas","ov":{"bright":true,"blank":true,"pull":true,"gas":true},"at":0.7407}]},{"id":6,"title":"Put the evidence together","page":"gsi","tab":"together","scene":"together","focusNodes":["line_gap"],"cam":{"x":0,"y":0,"k":1},"mfx":560,"durationMs":19600,"caption":"No single tool tells the whole story. Swath tools cover the area; seismic covers lines. Between the lines the ground is unknown, not empty.","misconception":"\"Between survey lines the ground is the same.\" It is unknown.","view3D":{"cam":[30,250,170],"target":[0,-18,0],"gaps":true,"interp":false},"beats":[{"label":"Four kinds of evidence","text":"Terrain comes from multibeam, seabed objects from side scan and magnetometer, shallow layers from SBP, deeper structure from 2D seismic.","sel":"mbes","stack":true,"gaps":false,"at":0},{"label":"Seismic covers lines only","text":"2D seismic images only along its survey lines — each one a thin slice of the ground.","sel":"hr2d","stack":true,"gaps":false,"at":0.3431},{"label":"Between the lines: unknown, not empty","text":"The hatched ground between lines was never imaged. It is unknown — not the same as the lines, and not empty.","sel":"line_gap","stack":false,"gaps":true,"at":0.6423}]},{"id":7,"title":"Investigate the soil","page":"gti","tab":"soil","scene":"soil","focusNodes":["borehole","cpt"],"cam":{"x":0,"y":0,"k":1},"mfx":700,"durationMs":18100,"caption":"GTI touches the ground. Boreholes recover real soil, the CPT cone measures resistance continuously, and the lab turns samples into properties.","misconception":"\"A survey tells us soil strength.\" GSI images; GTI measures.","beats":[{"label":"Borehole: recover real soil","text":"A borehole recovers real soil samples from known depths — the only direct look at the ground.","sel":"borehole","at":0},{"label":"CPT: measure resistance continuously","text":"A cone is pushed into the soil, measuring resistance and pressure all the way down — a profile of layers and strength.","sel":"cpt","at":0.3228},{"label":"Lab tests: samples become properties","text":"Samples go to the laboratory, where strength and other properties are measured for design.","sel":"lab","at":0.7244}]},{"id":8,"title":"Build the ground model","page":"gti","tab":"ground","scene":"ground","focusNodes":["ground_model","existing_data","data_age"],"cam":{"x":0,"y":0,"k":1},"mfx":800,"durationMs":23400,"caption":"Soil points plus seismic layers make a ground model. Start with existing data — check its age — then target new work where it changes the answer.","misconception":"\"The model is the ground.\" It is our best current picture.","view3D":{"cam":[215,105,235],"target":[0,-26,0],"gaps":false,"interp":true},"beats":[{"label":"Data at points","text":"Boreholes and CPTs give soil data at single points. Solid lines are measured; between the points there is nothing yet.","sel":"borehole","interp":false,"gaps":false,"at":0},{"label":"Add seismic layers: a ground model","text":"Tying the points to seismic layers lets us draw layers between them. Dashed lines are interpreted, not measured.","sel":"ground_model","interp":true,"gaps":false,"at":0.2866},{"label":"Start with existing data","text":"Before new work, review what earlier surveys and soil data already tell us.","sel":"existing_data","interp":true,"gaps":false,"at":0.5488},{"label":"Check its age, then target new work","text":"Old data may no longer describe today's seabed. Where it is not enough, add targeted new investigation.","sel":"data_age","interp":true,"gaps":false,"at":0.75}]},{"id":9,"title":"Mudmat","page":"gti","tab":"mudmat","scene":"mudmat","focusNodes":["soft_clay","mudmat_design"],"cam":{"x":0,"y":0,"k":1},"mfx":620,"durationMs":31000,"caption":"Before piles go in, the jacket stands on mudmats. Soft surface clay thickness and near-surface strength decide how big they must be.","misconception":"\"If piles are strong, mudmats do not matter.\" Mudmats carry the jacket first.","beats":[{"label":"Mudmats carry the jacket first","text":"Before piles go in, the jacket stands on mudmats — flat plates that spread its weight on the seabed.","sel":"mudmat_design","at":0},{"label":"Soft surface clay: how thick?","text":"The weak clay at the very top of the seabed is a key input: the thicker and softer it is, the larger the mudmat must be.","sel":"soft_clay","at":0.2074},{"label":"Near-surface strength","text":"How strong the first part of the soil is decides how much load each mudmat can carry.","sel":"near_strength","at":0.4793},{"label":"Check 1: can the soil carry it?","text":"The bearing check compares the load with what the soil can resist.","sel":"mudmat_bearing","at":0.6682},{"label":"Check 2: how far will it sink?","text":"The settlement check estimates how far the mudmat sinks, so the jacket stays level enough for piling.","sel":"mudmat_settlement","at":0.8111}]},{"id":10,"title":"Pile","page":"gti","tab":"pile","scene":"pile","focusNodes":["pile_capacity","drivability"],"cam":{"x":0,"y":0,"k":1},"mfx":780,"durationMs":19600,"caption":"\"Will it hold?\" and \"Can we drive it?\" are different questions with different owners. Both must be answered.","misconception":"\"Enough capacity means it can be driven.\" Separate analysis.","beats":[{"label":"Will it hold? (capacity)","text":"Capacity comes from friction along the pile and bearing at its tip, using the soil layers. Owner: the geotechnical designer.","sel":"pile_capacity","sub":"capacity","at":0},{"label":"…so how deep must it go?","text":"The capacity analysis gives the depth the pile must reach to carry the platform for its life.","sel":"required_penetration","sub":"capacity","at":0.3431},{"label":"Can we drive it? (installation)","text":"Drivability asks whether the chosen hammer can drive the pile to that depth. A different question, owned by the installation contractor.","sel":"drivability","sub":"install","at":0.6423}]},{"id":11,"title":"Jack-up","page":"gti","tab":"jackup","scene":"jackup","focusNodes":["leg_penetration","rig_data","spudcan_footprint"],"cam":{"x":0,"y":0,"k":1},"mfx":760,"durationMs":25700,"caption":"Spudcan penetration depends on the soil and the rig. Strong-over-weak layers can cause a sudden drop; old footprints matter. A new rig needs a new check.","misconception":"\"If one rig stood here, any rig can.\" Rigs differ.","view3D":{"cam":[110,85,300],"target":[10,8,0]},"beats":[{"label":"Rig A: legs settle and stop","text":"Under preload the spudcans sink until the strong sand layer carries the load. Rig A settles and stops.","sel":"leg_penetration","rig":"A","at":0},{"label":"Rig B: breaks through the strong layer","text":"A heavier rig with wider spudcans can push through the strong layer into weaker clay — a sudden drop called punch-through.","sel":"punch_through","rig":"B","at":0.2389},{"label":"Old footprints matter","text":"Depressions left by earlier rigs can change how new spudcans settle — worth checking before the legs go down.","sel":"spudcan_footprint","rig":"B","at":0.5111},{"label":"A new rig needs a new check","text":"Leg loads and spudcan size differ between rigs, so the check must be repeated with this rig's data.","sel":"rig_data","rig":"A","at":0.7611}]},{"id":12,"title":"From evidence to decision","page":"story","scene":"decision","focusNodes":["factual_report","interpretive_report","platform_location"],"cam":{"x":0,"y":0,"k":1},"mfx":800,"durationMs":17000,"caption":"GSI tells us where. GTI tells us how. Facts and interpretation are reported separately — and people make the decision.","misconception":"\"The data makes the decision.\" It informs it.","doc":true,"beats":[{"label":"Facts: what was measured","text":"The factual report records what was measured, where and how — without interpretation.","sel":"factual_report","at":0},{"label":"Interpretation: what it probably means","text":"The interpretive report explains what the data probably means, with its assumptions and limits.","sel":"interpretive_report","at":0.2773},{"label":"People decide","text":"People use both to decide — for example, where a platform should stand. Evidence informs the decision; it does not make it.","sel":"platform_location","at":0.5714}]},{"id":13,"title":"Check yourself","page":"story","scene":"quiz","focusNodes":["ground_model"],"cam":{"x":0,"y":0,"k":1},"mfx":800,"durationMs":0,"caption":"Seven quick questions. Instant feedback.","misconception":"\"I will remember it all.\" A quick check helps it stick."}],"tabs":{"gsi":[{"id":"survey","label":"Survey setup"},{"id":"seabed","label":"Seabed"},{"id":"below","label":"Below seabed"},{"id":"together","label":"Putting it together"},{"id":"pipeline","label":"Pipeline route"},{"id":"hazard","label":"Hazard map example"}],"gti":[{"id":"soil","label":"Getting soil data"},{"id":"ground","label":"Ground model"},{"id":"mudmat","label":"Mudmat"},{"id":"pile","label":"Pile"},{"id":"jackup","label":"Jack-up"}]},"tabInfo":{"survey":{"node":"positioning","caption":"Lines cover the area; positioning ties every sensor to the same frame."},"seabed":{"node":"mbes","caption":"Switch lenses or drag the divider to compare. Tap a pin to compare three kinds of evidence."},"below":{"node":"hr2d","caption":"Toggle overlays to see what shallow gas and other features look like on seismic. \"Where is this line?\" shows the line in 3D."},"together":{"node":"line_gap","caption":"Swath tools cover areas; seismic covers lines. Hatched ground is not observed. In 3D, \"Stack layers\" separates the evidence."},"hazard":{"node":"possible_gas","caption":"A synthetic hazard map: plan, section and a table of features with possible explanations."},"soil":{"node":"cpt","caption":"Boreholes, CPT and lab tests collect real soil information."},"ground":{"node":"ground_model","caption":"Solid boundaries are measured at points; dashed are interpreted between them. In 3D, slide the cut and switch interpretation on."},"mudmat":{"node":"mudmat_design","caption":"Mudmats hold the jacket before piling. Soft surface clay governs their size."},"pile":{"node":"pile_capacity","caption":"Switch between Capacity and Installation — two questions, two owners."},"jackup":{"node":"leg_penetration","caption":"Switch rigs and press Preload. Each rig needs its own check — concept only, not a prediction."},"pipeline":{"node":"pipeline_route","caption":"A route corridor: crossings, free spans, debris and slopes along the way."}},"features":{"f_debris":{"label":"Seabed debris","node":"debris","mbes":"Small raised shape","sss":"Strong return, sharp shadow","mag":"Magnetic response","reading":"Likely a man-made metal object. Confirm with a camera before anything lands nearby.","confirm":"Visual check (ROV / camera)"},"f_boulder":{"label":"Boulder","node":"sss","mbes":"Rounded bump","sss":"Bright return with shadow","mag":"No response","reading":"Likely a natural boulder — shape and shadow without metal."},"f_pock":{"label":"Pockmark cluster","node":"pockmark","mbes":"Circular depressions","sss":"Subtle darker rings","mag":"No response","reading":"Possible past fluid or gas escape. Compare with seismic below."},"f_slope":{"label":"Slope zone","node":"slope","mbes":"Steeper gradient","sss":"Texture change","mag":"No response","reading":"Uneven support for footings and pipelines."},"f_pipe":{"label":"Existing pipeline","node":"mag","mbes":"Linear raised feature","sss":"Continuous line with shadow","mag":"Strong linear response","reading":"A known asset. Survey confirms its true position; routes and footprints must respect it."}},"matrix":{"cols":[{"label":"Seabed (MBES · SSS · Mag)","node":"mbes"},{"label":"Below seabed (SBP · 2D HR)","node":"hr2d"},{"label":"Soil data (BH · CPT · Lab)","node":"cpt"},{"label":"Ground model","node":"ground_model"},{"label":"Engineering analysis","node":null}],"rows":[{"label":"Platform location","node":"platform_location","v":["P","P","S","S","-"],"ana":null},{"label":"Pipeline route","node":"pipeline_route","v":["P","S","S","S","-"],"ana":null},{"label":"Jack-up placement","node":"jackup_placement","v":["P","P","P","P","P"],"ana":"leg_penetration"},{"label":"Mudmat","node":"mudmat_design","v":["S","-","P","P","P"],"ana":"mudmat_bearing"},{"label":"Pile","node":"pile_design","v":["-","S","P","P","P"],"ana":"pile_capacity"}]},"quiz":[{"q":"No bright spot on the seismic means there is no shallow gas.","opts":["True","False"],"a":1,"why":"Absence of a sign is not proof. Gas can be present without a clear bright spot."},{"q":"Which of these actually measures soil strength?","opts":["Multibeam echosounder","Side scan sonar","Cone penetration test (CPT)","Magnetometer"],"a":2,"why":"The CPT pushes into the soil and measures resistance. The others image or detect; they do not measure strength."},{"q":"A pile has enough capacity. Does that prove it can be driven to depth?","opts":["Yes","No"],"a":1,"why":"Capacity (will it hold?) and drivability (can we drive it?) are different analyses with different owners."},{"q":"Between two 2D seismic lines, the ground is…","opts":["The same as on the lines","Unknown — not observed","Always clay"],"a":1,"why":"Seismic only images along its lines. Between them is interpretation, not observation."},{"q":"A different jack-up rig comes to a location where another rig worked. The leg penetration check…","opts":["Can be reused as it is","Needs a new check with this rig's data","Is not needed"],"a":1,"why":"Leg loads and spudcan size differ between rigs, so the check must be redone."},{"q":"In one phrase: GSI tells us ___, GTI tells us ___.","opts":["where · how","how · where","when · why"],"a":0,"why":"GSI images the seabed and below to tell us where. GTI measures the soil to tell us how to build."},{"q":"Two datasets show the same platform in slightly different places. What should you check first?","opts":["Which one is newer","Their coordinate reference frames","Which survey cost more"],"a":1,"why":"Different coordinate frames or datums put the same place at different numbers. Check the frame before anything else."}],"glossary":[{"term":"GSI","def":"Geophysical Site Investigation: using sound and magnetic sensors to image the seabed and the ground below it without touching it.","aliases":["geophysical site investigation"]},{"term":"GTI","def":"Geotechnical Site Investigation: drilling, sampling and testing the soil to measure its properties.","aliases":["geotechnical site investigation"]},{"term":"MBES","def":"Multibeam echosounder: a fan of sound beams that maps seabed depth across a wide swath.","aliases":["multibeam","multibeam echosounder"]},{"term":"Bathymetry","def":"The measurement and mapping of water depth and seabed shape.","aliases":[]},{"term":"Swath","def":"The strip of seabed covered by one pass of a sonar or multibeam.","aliases":[]},{"term":"SSS","def":"Side scan sonar: a towed sonar that images seabed texture and objects.","aliases":["side scan sonar","side scan"]},{"term":"Acoustic shadow","def":"A dark area on a sonar image behind a raised object, where sound could not reach.","aliases":[]},{"term":"Magnetometer","def":"A sensor that detects changes in the magnetic field caused by metal objects.","aliases":[]},{"term":"SBP","def":"Sub-bottom profiler: a sound source that images shallow layers just below the seabed in fine detail.","aliases":["sub-bottom profiler"]},{"term":"2D HR seismic","def":"Two-dimensional high-resolution seismic: images deeper layers along survey lines using a stronger source and a long receiver cable.","aliases":["2D high-resolution seismic","2D HR"]},{"term":"Streamer","def":"A long cable of hydrophones towed behind the vessel to record seismic echoes.","aliases":[]},{"term":"Hydrophone","def":"An underwater microphone that records returning sound.","aliases":[]},{"term":"Sparker","def":"A seismic source that makes a sound pulse with an electrical discharge in water.","aliases":[]},{"term":"Reflector","def":"A boundary between layers that bounces sound back, seen as a line on seismic.","aliases":["reflection"]},{"term":"Two-way time","def":"The time sound takes to travel down to a reflector and back. Seismic sections are first displayed in it.","aliases":["TWT"]},{"term":"Bright spot","def":"An unusually strong seismic reflection; sometimes linked to gas, sometimes not.","aliases":["bright spots"]},{"term":"Acoustic blanking","def":"A zone where seismic layers fade into noise, often because gas scatters the sound.","aliases":["blanking"]},{"term":"Pull-down","def":"Layers that appear to sag beneath gas because sound travels slower through it.","aliases":["pull-downs"]},{"term":"Fault","def":"A break in the ground where layers are offset.","aliases":[]},{"term":"Buried channel","def":"An old river or tidal channel that has been filled in and buried.","aliases":[]},{"term":"Pockmark","def":"A small crater in the seabed formed by fluid or gas escape.","aliases":["pockmarks"]},{"term":"Debris","def":"Man-made objects lying on the seabed.","aliases":[]},{"term":"Shallow gas","def":"Gas trapped in the upper layers below the seabed.","aliases":[]},{"term":"Survey line","def":"A planned path the vessel follows while collecting data.","aliases":["survey lines"]},{"term":"Line spacing","def":"The distance between survey lines; features smaller than it can be missed.","aliases":[]},{"term":"GNSS","def":"Global Navigation Satellite System, such as GPS, used to position the vessel.","aliases":[]},{"term":"Motion sensor","def":"An instrument measuring the vessel's roll, pitch and heave so data can be corrected.","aliases":[]},{"term":"Layback","def":"The distance from the vessel to an instrument towed behind it.","aliases":[]},{"term":"Borehole","def":"A hole drilled into the seabed to recover soil samples and run tests.","aliases":["boreholes"]},{"term":"CPT","def":"Cone penetration test: a cone pushed into the soil that measures its resistance continuously.","aliases":["cone penetration test","CPT cone"]},{"term":"Cone resistance","def":"The force needed to push the CPT cone, related to soil strength.","aliases":[]},{"term":"Sample","def":"A piece of soil recovered from a known depth.","aliases":["samples"]},{"term":"Lab test","def":"A controlled test on a soil sample to measure its properties.","aliases":["lab tests","laboratory testing"]},{"term":"Undrained shear strength","def":"The strength of clay when loaded quickly, before water can drain.","aliases":[]},{"term":"Clay","def":"Fine-grained soil that is sticky when wet; strength depends strongly on depth and history.","aliases":[]},{"term":"Sand","def":"Coarse-grained soil; strength depends on how dense it is.","aliases":[]},{"term":"Ground model","def":"A combined picture of the ground built from survey layers and soil data.","aliases":[]},{"term":"Mudmat","def":"A flat plate at the base of a jacket leg that supports it on the seabed before piling.","aliases":["mudmats"]},{"term":"Jacket","def":"The steel lattice frame that holds a fixed platform above the sea.","aliases":[]},{"term":"Pile","def":"A long steel tube driven into the seabed to anchor a structure permanently.","aliases":["piles"]},{"term":"Pile capacity","def":"How much load a pile can carry from soil friction and end bearing.","aliases":[]},{"term":"Drivability","def":"Whether a pile can be driven to the required depth with the chosen hammer.","aliases":[]},{"term":"Hammer","def":"The equipment that drives a pile into the seabed.","aliases":[]},{"term":"Jack-up","def":"A mobile rig that stands on legs lowered to the seabed.","aliases":["jack-up rig"]},{"term":"Spudcan","def":"The large footing at the bottom of each jack-up leg.","aliases":["spudcans"]},{"term":"Leg penetration","def":"How far a jack-up leg sinks into the seabed under load.","aliases":[]},{"term":"Punch-through","def":"A sudden drop when a spudcan breaks through a strong layer into a weaker one below.","aliases":[]},{"term":"Anomaly","def":"Something different from its surroundings in the data; not yet explained.","aliases":[]},{"term":"Interpretation","def":"What we think an observation means. It can change with more evidence.","aliases":[]},{"term":"Geohazard","def":"A ground condition that could harm people, structures or operations.","aliases":["geohazards"]},{"term":"CRS","def":"Coordinate reference system: the defined frame that gives coordinates their meaning.","aliases":["coordinate reference system"]},{"term":"Vertical datum","def":"The reference level that depths and heights are measured from.","aliases":["datum"]},{"term":"Velocity model","def":"An estimate of how fast sound travels through each layer, used to convert time to depth.","aliases":[]},{"term":"Grab sample","def":"A small scoop of seabed surface material taken during a survey.","aliases":["grab"]},{"term":"Gravity core","def":"A tube dropped into the seabed to recover a short column of shallow sediment.","aliases":[]},{"term":"ROV","def":"Remotely operated vehicle: an underwater robot with cameras, controlled from a vessel.","aliases":[]},{"term":"Free span","def":"A length of pipeline left unsupported over a dip in the seabed.","aliases":[]},{"term":"Crossing","def":"A point where a new pipeline or cable passes over an existing one.","aliases":[]},{"term":"Factual report","def":"A report of what was measured and how, without interpretation.","aliases":[]},{"term":"Interpretive report","def":"A report that explains what the data probably means, with stated assumptions.","aliases":[]},{"term":"Corridor","def":"The strip of seabed surveyed along a planned pipeline route.","aliases":[]}],"has3D":["hero","field","seabed","together","ground","jackup","survey"],"hazardRows":[["debris","Seabed debris","Seabed","Man-made object","Identify; keep footprint clear"],["pockmark","Pockmark cluster","Seabed","Past fluid or gas escape","Compare with seismic below"],["bright_spot","Bright spot","Shallow","Gas — or porous sand","Correlate lines; soil data"],["buried_channel","Buried channel","Shallow to medium","Infilled old channel","Map extent; target soil data"],["fault","Fault","Medium to deeper","Offset layers","Check extent toward seabed"]],"relLabels":{"produces":"produces","may_show":"can show","may_mean":"may mean","alternative":"or could be","informs":"informs","needs":"needs","checks":"checks","different_from":"is different from","applies_to":"applies to","documented_in":"is reported in"},"relLabelsIn":{"produces":"produced by","may_show":"can appear in","may_mean":"may be suggested by","alternative":"alternative to","informs":"informed by","needs":"needed by","checks":"checked by","different_from":"is different from","applies_to":"covers","documented_in":"reports"}}</script>
<script>/* ===================== SCENES (synthetic SVG illustrations) ===================== */
const C={ink:'#101215',ink2:'#474C53',ink3:'#7A7E84',paper:'#EFEAE0',card:'#FAF8F3',sig:'#F2590C',gsi:'#1D4ED8',gti:'#B45309',interp:'#6D28D9',model:'#0F766E',ana:'#BE185D',
 soft:'#B8A687',clay:'#9C8869',sand:'#D9C48F',stiff:'#7E6D55',dense:'#C7AE76',deep:'#6C5D49',bed:'#D3C29A',white:'#FFFFFF'};
const W=1600,H=900;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const r1=n=>Math.round(n*10)/10;
function pl(x0,x1,f,st){st=st||16;let d='';for(let x=x0;x<=x1+0.01;x+=st)d+=(d?'L':'M')+r1(x)+' '+r1(f(x));return d}
function band(x0,x1,ft,fb,st){st=st||16;let a=[],b=[];for(let x=x0;x<=x1+0.01;x+=st){a.push(r1(x)+' '+r1(ft(x)));b.unshift(r1(x)+' '+r1(fb(x)))}return 'M'+a.join('L')+'L'+b.join('L')+'Z'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hot(node,inner,label,halo){return `<g class="hot" data-node="${node}" tabindex="0" role="button" aria-label="${esc(label)}">${inner}${halo||''}</g>`}
function feat(id,inner,label,halo){return `<g class="hot" data-feature="${id}" tabindex="0" role="button" aria-label="${esc(label)}">${inner}${halo||''}</g>`}
const hr=(x,y,w,h,rx)=>`<rect class="halo" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx||10}"/>`;
const he=(cx,cy,rx,ry)=>`<ellipse class="halo" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry||rx}"/>`;
function tag(x,y,text,o){o=o||{};const w=text.length*9.2+22,dir=o.dir||1,col=o.col||C.ink,fg=o.fg||'#fff';
 const lead=o.lead?`<path d="M${o.lead[0]} ${o.lead[1]} L${x} ${y+15}" stroke="${col}" stroke-width="1.3" fill="none"/><circle cx="${o.lead[0]}" cy="${o.lead[1]}" r="4" fill="${col}"/>`:'';
 return `${lead}<g transform="translate(${dir<0?x-w:x} ${y})"><g class="tgs"><rect width="${r1(w)}" height="30" fill="${col}"/><text x="11" y="20" class="lbl" style="fill:${fg};font-size:14px">${esc(text)}</text></g></g>`}
function note(x,y,w,title,lines,col){col=col||C.sig;let t=lines.map((l,i)=>`<text x="16" y="${54+i*22}" style="font:400 16px var(--sans);fill:${C.ink}">${esc(l)}</text>`).join('');
 return `<g transform="translate(${x} ${y})" filter="url(#fSh)"><g class="nts"><rect width="${w}" height="${40+lines.length*22+16}" fill="${C.card}" stroke="${C.ink}"/><rect width="5" height="${40+lines.length*22+16}" fill="${col}"/><text x="16" y="28" class="cap" style="fill:${col}">${esc(title)}</text>${t}</g></g>`}

function defs(){return `<defs>
<linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6F1E7"/><stop offset="1" stop-color="#DDEBEE"/></linearGradient>
<linearGradient id="gSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFDDE6"/><stop offset=".45" stop-color="#6FA6BC"/><stop offset="1" stop-color="#2C6582"/></linearGradient>
<linearGradient id="gSeaS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9E3EA"/><stop offset="1" stop-color="#5E97AF"/></linearGradient>
<linearGradient id="gRay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="gFan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.sig}" stop-opacity=".55"/><stop offset="1" stop-color="${C.sig}" stop-opacity=".05"/></linearGradient>
<linearGradient id="gFanB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></linearGradient>
<linearGradient id="gSteel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E9E6E0"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CFCAC1"/></linearGradient>
<linearGradient id="gFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
<radialGradient id="gGlow"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#FFE8A8" stop-opacity=".55"/><stop offset="1" stop-color="#FFE8A8" stop-opacity="0"/></radialGradient>
<radialGradient id="gSun"><stop offset="0" stop-color="#FFF6DD"/><stop offset="1" stop-color="#FFF6DD" stop-opacity="0"/></radialGradient>
<pattern id="pClay" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="14" stroke="rgba(0,0,0,.16)" stroke-width="1.2"/></pattern>
<pattern id="pSand" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="rgba(0,0,0,.26)"/><circle cx="9.5" cy="9" r=".9" fill="rgba(0,0,0,.2)"/></pattern>
<pattern id="pSoft" width="28" height="12" patternUnits="userSpaceOnUse"><path d="M2 5h9M16 10h8" stroke="rgba(0,0,0,.2)" stroke-width="1.2"/></pattern>
<pattern id="pHatch" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="11" stroke="${C.sig}" stroke-width="2" stroke-opacity=".55"/></pattern>
<pattern id="pGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(16,18,21,.09)"/></pattern>
<pattern id="pGridB" width="200" height="200" patternUnits="userSpaceOnUse"><path d="M200 0H0V200" fill="none" stroke="rgba(16,18,21,.16)"/></pattern>
<pattern id="pLattice" width="16" height="22" patternUnits="userSpaceOnUse"><path d="M0 0L16 11L0 22M16 0L0 11" stroke="${C.ink}" stroke-width="1.4" fill="none"/></pattern>
<filter id="fSh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#3b2f1c" flood-opacity=".18"/></filter>
<filter id="fBlur"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="mA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${C.ink}"/></marker>
<marker id="mS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${C.sig}"/></marker>
<marker id="mM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${C.model}"/></marker>
</defs>`}

/* ---------- building blocks ---------- */
function sky(y1){return `<rect x="-400" y="-300" width="${W+800}" height="${y1+300}" fill="url(#gSky)"/><circle cx="1360" cy="40" r="160" fill="url(#gSun)"/>`}
function sea(y0,y1,grad){const R=rng(7);let rays='';for(let i=0;i<7;i++){const x=120+i*230+R()*60;rays+=`<path d="M${x} ${y0} L${x+70} ${y0} L${x+170} ${y1} L${x+40} ${y1}Z" fill="url(#gRay)" opacity="${(.35+R()*.4).toFixed(2)}"/>`}

const TEX={};
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function seismicTex(){if(TEX.seis)return TEX.seis;const w=720,h=290,c=cv(w,h),g=c.getContext('2d'),im=g.createImageData(w,h),R=rng(2026);
 const hz=[];let b=3;while(b<h+10){const shallow=b<60;hz.push({b,a:(R()*.7+.35)*(R()<.5?-1:1),w:shallow?.9:1.5+R()*1.1,p:R()*6,f:.01+R()*.02,A:shallow?.3:.6+R()*.8,ap:R()*6,af:.004+R()*.01});b+=shallow?2.6+R()*1.4:4.5+R()*6}
 const D=(x,b)=>(b/h)*(9*Math.sin(x*.0065+.6)+4*Math.sin(x*.017+2))+ (b>120?6*Math.tanh((x-470)/40)*((b-120)/170):0)+1.5*Math.sin(x*.003);
 const noise=new Float32Array(w*h);for(let i=0;i<w*h;i++)noise[i]=(R()-.5);
 for(let x=0;x<w;x++){const tr=.94+.06*Math.sin(x*2.3);const ys=hz.map(H=>H.b+D(x,H.b)+H.A*Math.sin(x*H.f+H.p));const am=hz.map(H=>H.a*(.65+.35*Math.sin(x*H.af+H.ap)));
  for(let y=0;y<h;y++){let v=0;for(let k=0;k<hz.length;k++){const dy=(y-ys[k])/hz[k].w;if(dy>-4&&dy<4){const t2=dy*dy;v+=am[k]*(1-t2)*Math.exp(-t2/2)}}
   v=v*tr+noise[y*w+x]*.22+noise[((y*13)%h)*w+((x*7)%w)]*.08;const att=1-.4*(y/h);const g8=Math.max(0,Math.min(255,132+v*118*att));const o=(y*w+x)*4;im.data[o]=g8;im.data[o+1]=g8;im.data[o+2]=g8+4;im.data[o+3]=255}}
 g.putImageData(im,0,0);TEX.seis=c.toDataURL();return TEX.seis}
function blankTex(){if(TEX.blank)return TEX.blank;const w=120,h=260,c=cv(w,h),g=c.getContext('2d'),im=g.createImageData(w,h),R=rng(77);

function hFun(x,y){ // seabed height for plan scenes (synthetic), x,y in 0..1600,0..900
 let h=-(x<520&&y>540? (520-x)/520*0 : 0);h+= .9*Math.max(0,(560-x))/560*Math.max(0,(y-520))/380*60;
 h+=3*Math.sin(x/38+y/90)+1.5*Math.sin(x/17-y/40);
 [[1120,610],[1185,650],[1150,700],[1240,600],[1210,720]].forEach(([a,b],i)=>{const r=Math.hypot(x-a,y-b);h-=14*Math.exp(-(r*r)/(2*(i%2?16:22)**2))});
 h+=16*Math.exp(-((x-980)**2+(y-300)**2)/(2*13**2));h+=11*Math.exp(-(((x-520)/18)**2+((y-380)/9)**2)/2);
