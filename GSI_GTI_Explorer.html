<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EFEAE0">
<meta name="author" content="Rattawit W.">
<title>GSI × GTI Investigation Explorer</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.min.js"}}</script>
<style>:root{
 --paper:#EFEAE0;--paper2:#E5DECF;--card:#FAF8F3;--ink:#101215;--ink2:#474C53;--ink3:#5E636A;--rule:#CBC2AF;--rule2:#DDD6C7;
 --gsi:#1D4ED8;--gti:#B45309;--interp:#6D28D9;--model:#0F766E;--ana:#BE185D;--sig:#F2590C;--sea1:#D9ECF0;--sea2:#2F6E8C;
 --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,"Noto Serif",Georgia,serif;
 --mono:"JetBrains Mono","Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
 --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.10;mix-blend-mode:multiply;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.3  0 0 0 0 0.27  0 0 0 0 0.2  0 0 0 .55 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100dvh}

/* ---------- HEADER ---------- */
header{display:flex;align-items:center;gap:22px;padding:10px 22px;border-bottom:1px solid var(--ink);background:var(--paper);position:relative;z-index:5}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap;cursor:pointer}
.brand b{font:600 26px/1 var(--serif);letter-spacing:-.5px}
.brand b i{font-style:italic;color:var(--sig);font-weight:400;padding:0 2px}
.brand small{font:500 10px/1 var(--mono);letter-spacing:2.2px;text-transform:uppercase;color:var(--ink2)}
nav.pages{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
nav.pages::-webkit-scrollbar{display:none}
nav.pages button{font:500 12px/1 var(--mono);letter-spacing:1.2px;text-transform:uppercase;padding:10px 12px;border-bottom:2px solid transparent;white-space:nowrap;color:var(--ink2)}
nav.pages button:hover{color:var(--ink)}
nav.pages button[aria-current=page]{color:var(--ink);border-color:var(--sig)}
.qchips{display:flex;gap:6px;align-items:center;white-space:nowrap}
.qchips span{font:500 10px/1 var(--mono);letter-spacing:1.6px;color:var(--ink3);text-transform:uppercase;margin-right:2px}
.chip{font:500 12px/1 var(--sans);padding:7px 11px;border:1px solid var(--ink);border-radius:999px;background:transparent;transition:.2s}
.chip:hover{background:var(--ink);color:var(--paper)}
.chip[aria-pressed=true]{background:var(--sig);border-color:var(--sig);color:#fff}

/* ---------- MAIN ---------- */
main{display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);min-height:0;transition:grid-template-columns .25s}
#rail{border-right:1px solid var(--rule);overflow:auto;padding:18px 0;background:linear-gradient(90deg,var(--paper2),var(--paper) 70%)}
#subnav{display:none}
.rail-h{font:500 10px/1 var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--ink3);padding:0 20px 10px}
.ch{display:grid;grid-template-columns:42px 1fr;align-items:baseline;width:100%;text-align:left;padding:9px 20px 9px 16px;border-left:3px solid transparent;transition:.15s}
.ch:hover{background:rgba(255,255,255,.45)}
.ch .n{font:400 22px/1 var(--serif);color:var(--ink3);font-variant-numeric:lining-nums}
.ch .t{font:500 13.5px/1.25 var(--sans)}
.ch.on{border-color:var(--sig);background:var(--card)}
.ch.on .n{color:var(--sig)}
.ch.done .n{color:var(--ink)}
.rail-sec{padding:4px 16px 14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:500 12px/1 var(--sans);padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--card)}
.seg button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.search{width:100%;font:14px var(--sans);padding:9px 11px;border:1px solid var(--ink);background:var(--card);border-radius:6px}
.results{margin-top:6px;display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto}
.results button{text-align:left;padding:6px 8px;border-radius:4px;font-size:13px}
.results button:hover{background:var(--card)}
.legend{display:grid;gap:6px;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.tabbtn{display:block;width:100%;text-align:left;padding:11px 20px;font:500 14px var(--sans);border-left:3px solid transparent}
.tabbtn[aria-current=true]{border-color:var(--sig);background:var(--card)}
.tabbtn small{display:block;font:500 10px/1.2 var(--mono);color:var(--ink3);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:2px}

/* ---------- STAGE ---------- */
#stage{position:relative;overflow:hidden;background:var(--paper);min-height:0}
#stage .frame{position:absolute;inset:14px;pointer-events:none;z-index:3;
 background:
  linear-gradient(var(--ink),var(--ink)) top left/22px 1.5px no-repeat,linear-gradient(var(--ink),var(--ink)) top left/1.5px 22px no-repeat,
  linear-gradient(var(--ink),var(--ink)) top right/22px 1.5px no-repeat,linear-gradient(var(--ink),var(--ink)) top right/1.5px 22px no-repeat,
  linear-gradient(var(--ink),var(--ink)) bottom left/22px 1.5px no-repeat,linear-gradient(var(--ink),var(--ink)) bottom left/1.5px 22px no-repeat,
  linear-gradient(var(--ink),var(--ink)) bottom right/22px 1.5px no-repeat,linear-gradient(var(--ink),var(--ink)) bottom right/1.5px 22px no-repeat}
#scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#scene.drag{cursor:grabbing}
#scene .enter{animation:reveal .7s cubic-bezier(.2,.7,.2,1)}
@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stage-title{position:absolute;left:30px;top:24px;z-index:4;pointer-events:none;max-width:62%}
.stage-title .num{font:400 76px/.8 var(--serif);color:transparent;-webkit-text-stroke:1.2px var(--ink);letter-spacing:-2px;display:block}
.stage-title h1{font:500 30px/1.05 var(--serif);margin:6px 0 0;letter-spacing:-.4px;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.stage-title .kick{font:500 10.5px/1 var(--mono);letter-spacing:2.4px;text-transform:uppercase;color:var(--ink2);margin-top:8px;display:block}
.badge{position:absolute;right:28px;top:26px;z-index:4;font:600 10px/1 var(--mono);letter-spacing:1.8px;text-transform:uppercase;padding:7px 10px;background:var(--ink);color:var(--paper);pointer-events:none}
.badge::before{content:"";display:inline-block;width:7px;height:7px;background:var(--sig);border-radius:50%;margin-right:8px;vertical-align:0;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.25}}
.toolbar{position:absolute;left:30px;bottom:24px;z-index:4;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 200px)}
.toggle{font:500 12px/1 var(--sans);padding:8px 11px 8px 9px;border:1px solid var(--ink);border-radius:999px;background:rgba(250,248,243,.9);backdrop-filter:blur(4px);display:flex;align-items:center;gap:7px}
.toggle::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink)}
.toggle[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.toggle[aria-pressed=true]::before{background:var(--sig);border-color:var(--sig)}
.zoom{position:absolute;right:26px;bottom:24px;z-index:4;display:flex;flex-direction:column;border:1px solid var(--ink);background:var(--card)}
.zoom button{width:38px;height:36px;font:500 18px/1 var(--mono)}
.zoom button+button{border-top:1px solid var(--rule)}
.resume{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;background:var(--sig);color:#fff;font:600 13px var(--sans);padding:11px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(242,89,12,.35);display:none}
.resume.show{display:block;animation:reveal .4s}
#doc{position:absolute;inset:0;overflow:auto;padding:40px 48px 60px;display:none;z-index:2}
#doc.show{display:block}
.hero{position:absolute;left:5%;top:16%;z-index:4;max-width:640px;pointer-events:none}
.hero h1{font:400 clamp(44px,6.4vw,96px)/.92 var(--serif);letter-spacing:-2.5px;margin:0}
.hero h1 em{color:var(--sig);font-style:italic}
.hero p{font:400 17px/1.5 var(--sans);max-width:440px;color:var(--ink2);margin:18px 0 22px}
.hero .go{pointer-events:auto;background:var(--ink);color:var(--paper);font:600 14px var(--sans);padding:14px 22px;border-radius:999px;display:inline-flex;gap:10px;align-items:center}
.hero .go:hover{background:var(--sig)}
.hero .meta{font:500 10.5px/1.6 var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--ink2);margin-bottom:14px}

/* ---------- SVG ---------- */
svg text{font-family:var(--mono)}
.lbl{font:500 15px var(--mono);fill:var(--ink);letter-spacing:.6px}
.lbl-s{font:500 13px var(--mono);fill:var(--ink2);letter-spacing:.8px}
.lbl-w{font:600 15px var(--mono);fill:#fff;letter-spacing:.6px}
.ttl{font:500 24px var(--serif);fill:var(--ink)}
.cap{font:600 12px var(--mono);letter-spacing:2px;fill:var(--ink2)}
.hot{cursor:pointer}
.hot .halo{fill:none;stroke:var(--sig);stroke-width:2.5;stroke-dasharray:6 5;opacity:0;transition:opacity .2s}
.hot:hover .halo,.hot:focus .halo{opacity:.7}
.hot.on .halo{opacity:1;animation:march 1.2s linear infinite}
.hot:focus{outline:none}
@keyframes march{to{stroke-dashoffset:-22}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.8s cubic-bezier(.2,.6,.3,1) infinite}
.ping.d2{animation-delay:.93s}.ping.d3{animation-delay:1.86s}
@keyframes ping{0%{transform:scale(.1);opacity:.9}100%{transform:scale(1);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.bob{animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.sweep{transform-box:fill-box;transform-origin:50% 0;animation:sweep 4s ease-in-out infinite}
@keyframes sweep{0%,100%{opacity:.35}50%{opacity:.75}}
.sail{animation:sail 14s linear infinite}
@keyframes sail{from{transform:translateY(0)}to{transform:translateY(-470px)}}
.flow{stroke-dasharray:4 10;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.drive{animation:drive 1.4s ease-in infinite}
@keyframes drive{0%,60%{transform:translateY(-14px)}70%{transform:translateY(0)}100%{transform:translateY(-14px)}}
.wave{transform-box:fill-box;transform-origin:center;animation:wavedown 1.4s ease-out infinite}
@keyframes wavedown{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(420px);opacity:0}}
.gnode rect{transition:opacity .25s,stroke .2s}
.gnode text{font:500 12.5px var(--sans);fill:var(--ink);pointer-events:none}
.gnode.fade{opacity:.13}
.gedge{fill:none;stroke:#8E8778;stroke-width:1.2;transition:opacity .25s}
.gedge.fade{opacity:.06}
.gedge.hl{stroke:var(--ink);stroke-width:2}
.gedge.path{stroke:var(--sig);stroke-width:3.2}
.gedge.und{stroke-dasharray:3 4}
.gedge.via{stroke-dasharray:1 5;stroke-linecap:round;stroke-width:1.8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- PANEL ---------- */
#panel{border-left:1px solid var(--rule);overflow:auto;background:var(--card)}
.pcard{padding:20px 24px;border-bottom:1px solid var(--rule2)}
.pcard.chap{background:var(--ink);color:var(--paper)}
.pcard.chap .k{color:#B9B2A3}
.pcard.chap p{margin:8px 0 0;font-size:14px;color:#E9E4DA}
.pcard.chap .mis{margin-top:12px;padding:10px 12px;border:1px solid #3A3E44;border-left:3px solid var(--sig);font-size:13.5px;color:#F3EFE7}
.pcard.chap .mis b{display:block;font:600 10px/1 var(--mono);letter-spacing:1.8px;text-transform:uppercase;color:var(--sig);margin-bottom:6px}
.k{font:500 10px/1 var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--ink3)}
.ptitle{font:500 27px/1.08 var(--serif);margin:8px 0 6px;letter-spacing:-.3px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font:600 10px/1 var(--mono);letter-spacing:1.3px;text-transform:uppercase;padding:5px 7px;border:1px solid currentColor;border-radius:3px}
.oneline{font:400 17px/1.4 var(--serif);margin:12px 0 0;font-style:italic}
.depth{display:flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden;margin-top:14px;width:max-content}
.depth button{font:500 11.5px var(--sans);padding:6px 12px}
.depth button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.sec{padding:14px 24px;border-bottom:1px solid var(--rule2)}
.sec h3{margin:0 0 6px;font:600 10.5px/1 var(--mono);letter-spacing:1.8px;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:8px}
.sec h3::before{content:"";width:14px;height:1.5px;background:var(--sig)}
.sec p,.sec li{margin:0;font-size:14.2px;color:var(--ink)}
.sec ul{margin:0;padding-left:18px}
.sec.mis{background:#FFF4EC}
.na{color:var(--ink3);font-style:italic}
details.spec summary{cursor:pointer;font:600 10.5px/1 var(--mono);letter-spacing:1.8px;text-transform:uppercase;color:var(--ink2);padding:2px 0}
details.spec p{margin-top:8px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{font:500 12px/1.2 var(--sans);padding:6px 9px;border:1px solid var(--rule);border-radius:999px;background:#fff;text-align:left}
.links button:hover{border-color:var(--ink)}
.links button em{font:500 9.5px var(--mono);font-style:normal;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;margin-right:5px}
.ev3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.ev3 div{border:1px solid var(--rule);padding:9px;border-radius:6px;background:#fff;font-size:13px}
.ev3 b{display:block;font:600 9.5px/1 var(--mono);letter-spacing:1.4px;color:var(--gsi);margin-bottom:6px}
dfn{font-style:normal;border-bottom:1.5px dotted var(--ink3);cursor:help}
dfn:hover,dfn:focus{border-color:var(--sig);outline:none;background:rgba(242,89,12,.08)}
#tip{position:fixed;z-index:100;max-width:300px;background:var(--ink);color:var(--paper);padding:11px 13px;font-size:13px;line-height:1.45;border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.25);display:none}
#tip b{display:block;font:600 10px/1 var(--mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--sig);margin-bottom:5px}
#tip.show{display:block;animation:reveal .2s}

/* ---------- FOOTER ---------- */
footer{display:grid;grid-template-columns:max(var(--lw),170px) minmax(0,1fr) var(--rw);border-top:1px solid var(--ink);background:var(--paper);align-items:stretch}
.ctrl{display:flex;align-items:center;gap:6px;padding:10px 16px;border-right:1px solid var(--rule)}
.ctrl button{width:40px;height:40px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.ctrl button.play{width:48px;height:48px;background:var(--ink);color:var(--paper)}
.ctrl button.play[aria-pressed=true]{background:var(--sig);border-color:var(--sig)}
.ctrl svg{width:16px;height:16px;fill:currentColor}
.tl{padding:10px 18px;display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
.ticks{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.ticks button{height:22px;position:relative;font:500 9.5px/1 var(--mono);color:var(--ink3);text-align:left;padding:0}
.ticks button::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rule)}
.ticks button.done::before{background:var(--ink)}
.ticks button.on{color:var(--sig)}
.ticks button.on::before{background:var(--sig);height:5px}
.ticks button .bar{position:absolute;left:0;bottom:0;height:5px;background:var(--sig);width:0}
.caption{font:400 15.5px/1.35 var(--serif);color:var(--ink);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fmeta{padding:10px 20px;border-left:1px solid var(--rule);font:500 10.5px/1.6 var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--ink2);display:flex;flex-direction:column;justify-content:center}
.fmeta b{color:var(--ink)}

/* ---------- DOC PAGES ---------- */
.doc-h{font:400 54px/1 var(--serif);letter-spacing:-1.5px;margin:0 0 6px}
.doc-sub{color:var(--ink2);max-width:640px;margin:0 0 26px}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.gl div{background:var(--card);padding:14px 16px}
.gl b{font:500 19px/1.1 var(--serif);display:block;margin-bottom:4px}
.gl small{font:500 10px var(--mono);color:var(--ink3);letter-spacing:1px;text-transform:uppercase}
.gl p{margin:6px 0 0;font-size:13.8px;color:var(--ink2)}
.about{max-width:860px}
.about h2{font:500 24px var(--serif);margin:30px 0 8px}
.vt{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card)}
.vt td,.vt th{border:1px solid var(--rule);padding:8px 10px;text-align:left}
.vt th{font:600 10.5px var(--mono);letter-spacing:1.4px;text-transform:uppercase;background:var(--paper2)}
.pass{color:var(--model);font-weight:700}.fail{color:var(--ana);font-weight:700}
.quiz{max-width:760px}
.qitem{background:var(--card);border:1px solid var(--rule);padding:18px 20px;margin-bottom:12px;border-radius:8px}
.qitem h3{font:500 20px/1.25 var(--serif);margin:4px 0 12px}
.qopts{display:flex;flex-wrap:wrap;gap:8px}
.qopts button{padding:10px 14px;border:1px solid var(--ink);border-radius:999px;font-size:14px;background:#fff}
.qopts button.right{background:var(--model);border-color:var(--model);color:#fff}
.qopts button.wrong{background:var(--ink3);border-color:var(--ink3);color:#fff;text-decoration:line-through}
.qwhy{margin-top:10px;font-size:14px;color:var(--ink2);display:none}
.qitem.answered .qwhy{display:block}
.score{font:400 40px var(--serif);margin:10px 0}

/* ---------- RESPONSIVE ---------- */
@media (max-width:1400px){.app{--lw:220px;--rw:340px}}
@media (max-width:1250px){.qchips span{display:none}}
@media (max-width:1050px){.qchips{display:none}}
@media (max-width:900px){
 body{overflow:auto}
 .app{display:block;height:auto;min-height:100dvh}
 header{position:sticky;top:0;flex-wrap:wrap;gap:6px 12px;padding:10px 14px 0}
 .brand b{font-size:22px}.brand small{display:none}
 nav.pages{order:3;flex-basis:100%;margin:0 -14px;padding:0 8px}
 .qchips{display:flex;order:2;margin-left:auto;overflow-x:auto}
 .qchips .chip{padding:6px 9px;font-size:11px}
 main{display:block}
 #rail{display:none}
 #subnav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--paper2);scrollbar-width:none}
 #subnav:empty{display:none}
 #subnav .tabbtn{flex:0 0 auto;width:auto;border:1px solid var(--rule);border-radius:999px;padding:8px 12px;font-size:13px;background:var(--card)}
 #subnav .tabbtn small{display:none}
 #subnav .tabbtn[aria-current=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
 #subnav .rail-sec{padding:0;display:flex;gap:6px;align-items:center;flex:0 0 auto}
 #subnav .rail-h,#subnav .legend,#subnav .results:empty{display:none}
 #subnav .search{width:170px;padding:7px 10px}
 #subnav .results{position:absolute;margin-top:40px;background:var(--card);border:1px solid var(--ink);z-index:9;max-width:260px}
 #stage{height:min(68svh,560px);border-bottom:1px solid var(--ink)}
 #stage .frame{inset:8px}
 .stage-title{left:16px;top:14px;max-width:70%}
 .stage-title .num{font-size:44px}
 .stage-title h1{font-size:20px;display:inline;background:rgba(239,234,224,.9);padding:0 6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
 .stage-title .kick{display:none}
 .badge{right:12px;top:12px;font-size:8.5px;padding:5px 7px;letter-spacing:1.2px}
 .toolbar{left:12px;bottom:12px;max-width:calc(100% - 70px);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}

<script type="application/json" id="data">{"meta":{"title":"GSI × GTI Investigation Explorer","version":"2.8.0","dataMode":"concept_only","author":"Rattawit W.","three":{"version":"0.186.0","primary":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.min.js","fallback":"https://unpkg.com/three@0.186.0/build/three.module.min.js"}},"nodes":[{"id":"q_platform","type":"question","discipline":"Integrated","label":"Platform location","keyNode":true,"aliases":["wellhead platform","fixed platform","WHP"],"chapterIds":[0,1],"evidenceTag":"GEN","targets":["platform_location","mudmat_design","pile_design"],"oneLine":"Where can a fixed platform stand, and what will its foundations sit on?","measures":"A question, not a measurement. It decides which surveys and tests are worth doing.","whatWeSee":"Seabed shape and objects, shallow layers, signs of gas, and real soil data at the site.","mightMean":"Together they show whether a location looks workable and what the foundation must handle.","limits":["Surveys reduce uncertainty; they do not remove it.","The final choice is made by the project team, not by a single dataset."],"whyCare":"Moving a platform late is expensive. Looking first is cheaper than fixing later.","misconception":"\"One survey type is enough.\" Each tool answers a different part of the question.","specialist":"Location screening combines geophysical constraints with geotechnical design inputs for mudmats and piles."},{"id":"q_pipeline","type":"question","discipline":"Integrated","label":"Pipeline route","keyNode":true,"aliases":["route","flowline","subsea pipeline"],"chapterIds":[0,1],"evidenceTag":"GEN","targets":["pipeline_route"],"oneLine":"Which path can a pipeline follow across the seabed with the fewest surprises?","measures":"A question about a long corridor rather than a single point.","whatWeSee":"Slopes, debris, existing pipelines and cables, pockmarks, and near-surface soil.","mightMean":"Features along the corridor can shift the route or change how the pipe is laid and protected.","limits":["A corridor survey only covers its width.","Seabed conditions can change over time."],"whyCare":"Pipelines cross long distances; one missed object can cause damage or a reroute.","misconception":"\"The seabed is flat and empty.\" It rarely is.","specialist":"Route engineering uses bathymetry, contacts, crossings and near-surface soil for lay, stability and span checks."},{"id":"q_jackup","type":"question","discipline":"Integrated","label":"Jack-up rig placement","keyNode":true,"aliases":["rig move","jack-up","drilling rig"],"chapterIds":[0,1,11],"evidenceTag":"GEN","targets":["jackup_placement"],"oneLine":"Can a jack-up rig stand its legs here, and how far will they sink?","measures":"A question that needs both seabed and soil information, plus data about the rig itself.","whatWeSee":"Debris and depressions on the seabed, shallow gas signs, and layered soil below.","mightMean":"The legs may settle gradually or, in some layer combinations, drop suddenly.","limits":["The answer depends on the specific rig.","Old checks for another rig do not transfer automatically."],"whyCare":"Leg problems put people and the rig at risk and can stop operations.","misconception":"\"If one rig stood here, any rig can.\" Rigs differ in weight and footing size.","specialist":"Jack-up site assessment combines seabed hazard screening with rig-specific leg penetration analysis."},{"id":"positioning","type":"method","discipline":"GSI","label":"Positioning","keyNode":false,"aliases":["GNSS","navigation","offsets","layback","motion sensor"],"chapterIds":[2],"evidenceTag":"GEN","oneLine":"Knowing exactly where every measurement was taken.","measures":"Satellite position of the vessel, its motion, and the distance to each sensor and towed instrument.","whatWeSee":"A track for every sensor, tied to one common coordinate frame.","mightMean":"Features from different tools can be overlaid and compared with confidence.","limits":["Errors in offsets or layback shift every result from that sensor.","Positioning quality must be checked, not assumed."],"whyCare":"If position is wrong, a correct observation ends up in the wrong place.","misconception":"\"The ship knows where it is, so the sensors do too.\" Towed sensors trail behind and move on their own.","specialist":"Combines GNSS, heading and motion data, measured offsets and acoustic or computed layback for towed equipment."},{"id":"mbes","type":"method","discipline":"GSI","label":"Multibeam echosounder (MBES)","keyNode":true,"aliases":["multibeam","echosounder","bathymetry survey","MBES"],"chapterIds":[3],"evidenceTag":"GEN","oneLine":"A fan of sound beams that maps the shape and depth of the seabed.","measures":"Travel time of sound from the vessel to the seabed and back, across a wide swath.","whatWeSee":"A detailed 3D surface: slopes, mounds, depressions and objects.","mightMean":"Shape tells us where the seabed is uneven or disturbed.","limits":["Shows shape, not what something is made of.","Needs correct sound speed in the water."],"whyCare":"Every structure and pipeline sits on this surface.","misconception":"\"A bump on the map tells us what the object is.\" Shape alone is not identity.","specialist":"Swath bathymetry corrected for sound velocity, motion and tide forms the digital terrain model.","short":"Multibeam (MBES)"},{"id":"sss","type":"method","discipline":"GSI","label":"Side scan sonar (SSS)","keyNode":true,"aliases":["side scan","sonar","SSS"],"chapterIds":[3],"evidenceTag":"GEN","oneLine":"A towed sonar that images seabed texture and objects like a black-and-white photo.","measures":"Strength of sound echoes returned from the seabed on both sides of a towed fish.","whatWeSee":"Bright returns from hard or rough surfaces and dark acoustic shadows behind raised objects.","mightMean":"Objects, debris, boulders, trawl marks and changes in seabed type.","limits":["No reliable depth.","Shadows depend on direction and height of the sonar."],"whyCare":"Finds objects that a footing, spudcan or pipe should not land on.","misconception":"\"A bright spot on sonar is metal.\" Many natural surfaces are also bright.","specialist":"Backscatter mosaics and contact picking are correlated with MBES and magnetometer data."},{"id":"mag","type":"method","discipline":"GSI","label":"Magnetometer","keyNode":false,"aliases":["mag","magnetic survey"],"chapterIds":[3],"evidenceTag":"GEN","oneLine":"A towed sensor that detects buried or exposed metal.","measures":"Small changes in the Earth's magnetic field caused by ferrous objects.","whatWeSee":"Anomalies over pipelines, cables, wrecks and metal debris, even when buried.","mightMean":"A sonar contact with a magnetic response is likely man-made.","limits":["Does not image shape.","Non-ferrous objects give no response."],"whyCare":"Buried metal can be invisible to sonar but still hit a spudcan or anchor.","misconception":"\"No sonar contact means no object.\" Buried metal may only show on the magnetometer.","specialist":"Total-field anomalies are interpreted with altitude and line orientation in mind."},{"id":"sbp","type":"method","discipline":"GSI","label":"Sub-bottom profiler (SBP)","keyNode":false,"aliases":["sub-bottom","pinger","chirp","SBP"],"chapterIds":[4],"evidenceTag":"GEN","oneLine":"A sound source that images the first layers just below the seabed in fine detail.","measures":"Echoes from boundaries between shallow sediment layers.","whatWeSee":"Thin layers, buried channels and signs of gas near the seabed.","mightMean":"How the shallow ground is layered where footings and spudcans will bear.","limits":["Shallow penetration only.","Gas or hard layers can block the signal."],"whyCare":"The shallowest soil matters most for mudmats, pipelines and spudcans.","misconception":"\"SBP sees as deep as seismic.\" It trades depth for detail.","specialist":"Higher frequency gives finer vertical resolution with less penetration than 2D HR seismic."},{"id":"hr2d","type":"method","discipline":"GSI","label":"2D high-resolution seismic","keyNode":true,"aliases":["2D HR","2DHR","seismic","high resolution seismic","sparker","airgun"],"chapterIds":[4,5],"evidenceTag":"GEN","oneLine":"A stronger sound source and long receiver cable that image layers deeper below the seabed.","measures":"Echoes from deeper layer boundaries recorded along survey lines.","whatWeSee":"Layer geometry, faults, buried channels, and amplitude anomalies such as bright spots.","mightMean":"Where shallow gas or other geohazards may be present beneath a site.","limits":["Only along lines; between lines is not observed.","Less detail than SBP near the seabed."],"whyCare":"Shallow gas and faults matter for structures and for drilling the first part of a well.","misconception":"\"No anomaly means no gas.\" Absence of a sign is not proof.","specialist":"Typically a sparker or small airgun source with a multichannel streamer, processed to preserve high frequencies.","short":"2D HR seismic"},{"id":"borehole","type":"method","discipline":"GTI","label":"Borehole sampling","keyNode":true,"aliases":["drilling","geotechnical borehole","sampling"],"chapterIds":[7],"evidenceTag":"GEN","oneLine":"Drilling into the seabed to recover real soil for testing.","measures":"Soil type and layering from recovered samples, plus in-hole tests.","whatWeSee":"Physical soil we can describe, photograph and send to the lab.","mightMean":"What each layer really is and how strong it might be.","limits":["Information is at one point only.","Sampling can disturb soft soil."],"whyCare":"It is the ground truth that seismic layers are tied to.","misconception":"\"A borehole tells us the soil everywhere.\" It tells us about one spot.","specialist":"Sampling and in-situ testing intervals are planned around expected foundation depths."},{"id":"cpt","type":"method","discipline":"GTI","label":"Cone penetration test (CPT)","keyNode":true,"aliases":["cone","cone penetration test","CPTu","piezocone","CPT"],"chapterIds":[7],"evidenceTag":"GEN","oneLine":"Pushing an instrumented cone into the soil to measure its resistance continuously.","measures":"Resistance at the cone tip, friction on the sleeve, and water pressure in the soil.","whatWeSee":"A continuous profile that changes as the cone passes through different layers.","mightMean":"Soil type and strength trends with depth.","limits":["No sample is recovered.","Interpretation relies on correlations checked against lab data."],"whyCare":"Fast, continuous strength information right where foundations bear.","misconception":"\"CPT and sonar measure the same thing.\" Sonar images; CPT measures soil.","specialist":"Piezocone data is used for soil classification and strength profiles alongside lab results.","short":"Cone test (CPT)"},{"id":"lab","type":"method","discipline":"GTI","label":"Laboratory testing","keyNode":false,"aliases":["lab","lab test","soil testing"],"chapterIds":[7],"evidenceTag":"GEN","oneLine":"Testing soil samples to measure strength and properties under control.","measures":"Strength, soil classification, density and water content.","whatWeSee":"Numbers for each sample that describe how the soil behaves.","mightMean":"Design soil parameters for each layer.","limits":["Results depend on sample quality.","Few samples must represent thick layers."],"whyCare":"Turns soil from a description into engineering properties.","misconception":"\"Lab results are exact.\" They are measurements on small, possibly disturbed pieces.","specialist":"Index and strength tests are combined with CPT to derive characteristic parameters."},{"id":"bathymetry","type":"data","discipline":"GSI","label":"Bathymetry map","keyNode":true,"aliases":["terrain model","depth map","DTM"],"chapterIds":[3],"evidenceTag":"GEN","oneLine":"A map of seabed depth and shape.","measures":"Seabed elevation across the surveyed area.","whatWeSee":"Slopes, depressions, mounds and linear features.","mightMean":"Where the seabed is uneven or disturbed.","limits":["Resolution depends on water depth and survey settings."],"whyCare":"Sets the top of the ground model.","misconception":"\"Depth is fixed forever.\" Seabeds move, especially sand.","specialist":"Gridded surface from cleaned soundings with stated vertical reference."},{"id":"sonar_image","type":"data","discipline":"GSI","label":"Sonar image","keyNode":false,"aliases":["mosaic","backscatter"],"chapterIds":[3],"evidenceTag":"GEN","oneLine":"A seabed picture made of sonar echo strength.","measures":"Echo strength along the swath.","whatWeSee":"Objects, shadows and changes in seabed type.","mightMean":"Possible debris, boulders or disturbed ground.","limits":["Brightness is not material.","Geometry varies with tow height."],"whyCare":"Primary tool for finding seabed objects.","misconception":"\"Dark means a hole.\" It can be a shadow behind an object.","specialist":"Mosaicked backscatter with contacts picked and measured from shadows."},{"id":"mag_map","type":"data","discipline":"GSI","label":"Magnetic map","keyNode":false,"aliases":["magnetic anomaly map"],"chapterIds":[3],"evidenceTag":"GEN","oneLine":"A map of magnetic anomalies along survey lines.","measures":"Magnetic field variation.","whatWeSee":"Anomalies over metal objects and existing assets.","mightMean":"Buried or exposed ferrous objects.","limits":["Weak response from small or deep objects."],"whyCare":"Confirms whether a contact is likely metal.","misconception":"\"Magnetic anomaly equals danger.\" It equals metal; context decides.","specialist":"Anomalies are listed with amplitude, shape and correlation to sonar contacts."},{"id":"shallow_section","type":"data","discipline":"GSI","label":"Shallow profile (SBP)","keyNode":false,"aliases":["sub-bottom section"],"chapterIds":[4],"evidenceTag":"GEN","oneLine":"A fine-detail image of the first layers below the seabed.","measures":"Shallow reflections along a line.","whatWeSee":"Thin layers, channels and blanked zones.","mightMean":"Shallow layering and possible gas.","limits":["Limited depth."],"whyCare":"Where most foundations bear.","misconception":"\"It shows soil strength.\" It shows boundaries, not strength.","specialist":"Interpreted horizons are tied to boreholes and CPT."},{"id":"seismic_section","type":"data","discipline":"GSI","label":"Seismic section (2D HR)","keyNode":true,"aliases":["seismic line","profile"],"chapterIds":[4,5],"evidenceTag":"GEN","oneLine":"A vertical slice showing layers deeper below the seabed along one line.","measures":"Reflections in two-way time.","whatWeSee":"Layer geometry, faults, channels and amplitude anomalies.","mightMean":"Geological setting and possible geohazards.","limits":["Vertical axis is time, not depth, until converted.","Only along the line."],"whyCare":"Main view for shallow gas screening.","misconception":"\"The picture is depth.\" It is travel time until converted with a velocity model.","specialist":"Time sections are converted to depth with a stated velocity model when needed."},{"id":"samples","type":"data","discipline":"GTI","label":"Soil samples","keyNode":false,"aliases":["sample","core"],"chapterIds":[7],"evidenceTag":"GEN","oneLine":"Pieces of real soil recovered from a borehole.","measures":"Physical material from known depths.","whatWeSee":"Colour, texture, layering and consistency.","mightMean":"Soil type and condition.","limits":["May be disturbed during recovery."],"whyCare":"The only direct look at the soil.","misconception":"\"A sample represents a whole layer.\" It represents a short interval.","specialist":"Sample quality is recorded and influences parameter selection."},{"id":"cpt_profile","type":"data","discipline":"GTI","label":"CPT profile","keyNode":false,"aliases":["cone resistance profile"],"chapterIds":[7,8],"evidenceTag":"GEN","oneLine":"A continuous log of cone resistance with depth.","measures":"Tip resistance, sleeve friction and pore pressure.","whatWeSee":"Layer changes and strength trends.","mightMean":"Soil type and strength profile.","limits":["Needs calibration against samples."],"whyCare":"Fills gaps between samples.","misconception":"\"A spike is always a hard layer.\" It can be a thin lens or obstruction.","specialist":"Classification charts and strength correlations are applied with site-specific checks."},{"id":"lab_results","type":"data","discipline":"GTI","label":"Laboratory results","keyNode":false,"aliases":["test results"],"chapterIds":[7],"evidenceTag":"GEN","oneLine":"Measured soil properties from lab tests.","measures":"Strength, classification, density, water content.","whatWeSee":"Values for each sample.","mightMean":"Basis for design parameters.","limits":["Scatter between samples is normal."],"whyCare":"Feeds every foundation check.","misconception":"\"One test is enough.\" Trends need many points.","specialist":"Combined with CPT to define characteristic profiles."},{"id":"debris","type":"observation","discipline":"GSI","label":"Seabed debris","keyNode":false,"aliases":["contact","object","obstruction"],"chapterIds":[3],"evidenceTag":"GEN","oneLine":"Objects lying on the seabed that do not belong to the natural ground.","measures":"Seen as sonar contacts, often with magnetic response.","whatWeSee":"Small raised shapes with sharp shadows.","mightMean":"Lost equipment, wreckage or old infrastructure.","limits":["Small objects can be missed.","Identity is uncertain without a visual check."],"whyCare":"A spudcan, mudmat or pipe landing on debris can be damaged or unstable.","misconception":"\"Small objects do not matter.\" They can concentrate load or damage equipment.","specialist":"Contacts are listed with size, height and correlation across sensors."},{"id":"pockmark","type":"observation","discipline":"GSI","label":"Pockmark","keyNode":false,"aliases":["crater","depression"],"chapterIds":[3],"evidenceTag":"GEN","oneLine":"A small crater in the seabed often linked to past fluid or gas escape.","measures":"Seen as circular depressions in bathymetry.","whatWeSee":"Round dips, sometimes in clusters.","mightMean":"Fluid or gas has moved up through the seabed at some time.","limits":["May be inactive and old."],"whyCare":"Uneven support and a hint of gas below.","misconception":"\"A pockmark means gas is escaping now.\" It may be ancient.","specialist":"Compared with shallow seismic for underlying gas indicators."},{"id":"slope","type":"observation","discipline":"GSI","label":"Seabed slope","keyNode":false,"aliases":["gradient","steep seabed"],"chapterIds":[3],"evidenceTag":"GEN","oneLine":"Places where the seabed is steeper than its surroundings.","measures":"Gradient from bathymetry.","whatWeSee":"Changes in depth over short distances.","mightMean":"Uneven support for footings or pipelines.","limits":["Small features can be smoothed out by gridding."],"whyCare":"Affects levelness, stability and pipe spans.","misconception":"\"Gentle slopes never matter.\" Even small ones affect long structures.","specialist":"Slope maps are derived from the terrain model at stated grid size."},{"id":"bright_spot","type":"observation","discipline":"GSI","label":"Bright spot","keyNode":true,"aliases":["amplitude anomaly","high amplitude","high-amplitude reflection"],"chapterIds":[5],"evidenceTag":"GEN","oneLine":"A reflection much stronger than its neighbours on the seismic section.","measures":"Unusually high reflection amplitude.","whatWeSee":"A short, very strong, often flat reflector.","mightMean":"Possibly gas trapped in a porous layer — or simply a change in rock or soil type.","limits":["Not proof of gas on its own.","No bright spot does not prove no gas.","Its strength alone does not tell gas from sand."],"whyCare":"One of the main signs used to screen for shallow gas.","misconception":"\"Bright spot = gas.\" It may be gas, porous sand, or a lithology change.","specialist":"Polarity, shape, associated blanking or pull-down and correlation across lines support interpretation."},{"id":"blanking","type":"observation","discipline":"GSI","label":"Acoustic blanking","keyNode":false,"aliases":["acoustic masking","acoustic turbidity","gas chimney","wipe-out"],"chapterIds":[5],"evidenceTag":"GEN","oneLine":"A zone where the seismic image fades into noise.","measures":"Loss of coherent reflections.","whatWeSee":"A smudged column or patch with no clear layers.","mightMean":"Gas scattering the sound — or a processing or acquisition effect.","limits":["Layers below cannot be seen."],"whyCare":"Hides what is underneath and may mark gas migration.","misconception":"\"Blank means nothing is there.\" It means we cannot see.","specialist":"Assessed with amplitude, frequency content and neighbouring lines."},{"id":"pull_down","type":"observation","discipline":"GSI","label":"Pull-down","keyNode":false,"aliases":["velocity pull-down","sag"],"chapterIds":[5],"evidenceTag":"GEN","oneLine":"Layers that appear to sag beneath an anomaly.","measures":"Apparent downward bending of reflections in time.","whatWeSee":"Reflectors dipping under a bright spot or blanked zone.","mightMean":"Sound travelling slower through gas above — the layers are not really bent.","limits":["Can also be a real structure."],"whyCare":"Supports a gas interpretation when seen with other signs.","misconception":"\"The ground is bent there.\" It may just be slower sound.","specialist":"A time-domain effect of lower velocity in gas-charged sediment."},{"id":"fault","type":"observation","discipline":"GSI","label":"Fault","keyNode":false,"aliases":["fracture","offset"],"chapterIds":[5],"evidenceTag":"GEN","oneLine":"A break where layers are offset against each other.","measures":"Displaced reflections along a plane.","whatWeSee":"Layers that step up or down across a line.","mightMean":"Past ground movement and a possible pathway for fluids.","limits":["Small offsets may be below resolution."],"whyCare":"Affects ground model continuity and possible gas pathways.","misconception":"\"Faults are always active.\" Most are old.","specialist":"Mapped across lines; extent toward seabed is noted."},{"id":"buried_channel","type":"observation","discipline":"GSI","label":"Buried channel","keyNode":false,"aliases":["palaeochannel","paleochannel","infilled channel"],"chapterIds":[5],"evidenceTag":"GEN","oneLine":"An old river or tidal channel now filled and buried.","measures":"A U- or V-shaped cut in the layers.","whatWeSee":"Cut-and-fill geometry with different internal layering.","mightMean":"Soil inside may differ strongly from soil around it.","limits":["Infill type is uncertain without soil data."],"whyCare":"Foundations straddling a channel edge can see very different soils.","misconception":"\"Same depth, same soil.\" Not across a channel edge.","specialist":"Channel extent is mapped and targeted with boreholes or CPT where relevant."},{"id":"line_gap","type":"observation","discipline":"GSI","label":"Gap between survey lines","keyNode":false,"aliases":["line spacing","coverage gap","unknown area"],"chapterIds":[6],"evidenceTag":"GEN","oneLine":"Ground between 2D seismic lines that was never imaged.","measures":"Nothing — that is the point.","whatWeSee":"Blank space between lines on the map.","mightMean":"Unknown conditions, not necessarily the same as on the lines.","limits":["Interpolation between lines is an assumption."],"whyCare":"Small features can hide between lines.","misconception":"\"Between the lines it must be the same.\" It is unknown.","specialist":"Line spacing is chosen for the expected feature size and the decision being supported."},{"id":"possible_gas","type":"interpretation","discipline":"GSI","label":"Possible shallow gas","keyNode":true,"aliases":["gas","shallow gas","gas-charged sediment"],"chapterIds":[5],"evidenceTag":"GEN","oneLine":"An interpretation that gas may be present in shallow layers.","measures":"Not measured directly; inferred from several signs.","whatWeSee":"Bright spots, blanking, pull-down and pockmarks — ideally together.","mightMean":"A geohazard for structures and for drilling the shallow part of a well.","limits":["An interpretation, not a confirmation.","Absence of signs does not prove absence of gas."],"whyCare":"Gas can weaken soil and is a well-known drilling hazard.","misconception":"\"Seismic confirms gas.\" It suggests; other evidence is needed.","specialist":"Interpretation confidence improves with multiple indicators, cross-line consistency and soil data.","confidence":"Low from one sign alone; higher when several signs agree across lines and soil data supports it."},{"id":"porous_sand","type":"interpretation","discipline":"GSI","label":"Porous sand (alternative)","keyNode":false,"aliases":["sand layer","alternative explanation"],"chapterIds":[5],"evidenceTag":"GEN","oneLine":"A strong reflection can also come from a sand layer without gas.","measures":"Inferred.","whatWeSee":"Similar bright reflection, often without blanking or pull-down.","mightMean":"A normal soil boundary rather than a hazard.","limits":["Hard to tell apart from gas using seismic alone."],"whyCare":"Prevents over-reacting — and under-reacting.","misconception":"\"Every bright reflector is a problem.\" Some are just sand.","specialist":"Distinguished using polarity, associated effects and ground truth.","confidence":"Medium when a bright reflection lacks blanking or pull-down; confirmed only with soil data."},{"id":"lithology_change","type":"interpretation","discipline":"GSI","label":"Change in soil or rock type","keyNode":false,"aliases":["lithology"],"chapterIds":[5],"evidenceTag":"GEN","oneLine":"A boundary between different materials can produce a strong reflection.","measures":"Inferred.","whatWeSee":"Continuous strong reflector following the layers.","mightMean":"A normal geological boundary.","limits":["Needs soil data to confirm."],"whyCare":"Shapes the ground model.","misconception":"\"Strong means unusual.\" Contrast is normal at boundaries.","specialist":"Tied to borehole stratigraphy where available.","confidence":"Higher when the reflector is continuous and ties to a borehole boundary."},{"id":"artefact","type":"interpretation","discipline":"GSI","label":"Processing or acquisition effect","keyNode":false,"aliases":["artefact","artifact","noise"],"chapterIds":[5],"evidenceTag":"GEN","oneLine":"Some image features come from how data was recorded or processed.","measures":"Inferred.","whatWeSee":"Patches or stripes unrelated to geology.","mightMean":"Nothing in the ground.","limits":["Requires checking raw data and neighbouring lines."],"whyCare":"Prevents chasing problems that are not there.","misconception":"\"If it is on the screen it is in the ground.\" Not always.","specialist":"Checked against acquisition logs, adjacent lines and alternative processing.","confidence":"Higher when the feature follows acquisition patterns and vanishes on neighbouring lines."},{"id":"ground_model","type":"ground_model","discipline":"Integrated","label":"Ground model","keyNode":true,"aliases":["geological model","soil model","integrated model"],"chapterIds":[8,12],"evidenceTag":"GEN","oneLine":"One picture of the ground that combines survey layers and soil data.","measures":"Combines all evidence rather than measuring.","whatWeSee":"Layers, their extent and their properties.","mightMean":"The shared basis for foundation and route checks.","limits":["Between data points it is interpreted.","Only as good as its weakest evidence."],"whyCare":"Every design check uses it.","misconception":"\"The model is the ground.\" It is our best current picture.","specialist":"Seismic horizons are tied to boreholes and CPT to extend point data laterally."},{"id":"existing_data","type":"pathway","discipline":"Integrated","label":"Existing data review","keyNode":false,"aliases":["desk study","previous surveys","data reuse"],"chapterIds":[8],"evidenceTag":"GEN","oneLine":"Checking what earlier surveys and soil data already tell us.","measures":"Reviews previous datasets.","whatWeSee":"Coverage, age and quality of earlier information.","mightMean":"Whether new work is needed, and where.","limits":["Old data may not cover the new location or the new structure.","Seabed can change."],"whyCare":"Saves time and money when earlier data is enough.","misconception":"\"Old data is always enough\" — or \"never enough\". It depends on the question.","specialist":"Assessed for proximity, quality, relevance to foundation type and changes since acquisition."},{"id":"targeted_investigation","type":"pathway","discipline":"Integrated","label":"Targeted new investigation","keyNode":false,"aliases":["additional investigation","new borehole","infill survey"],"chapterIds":[8],"evidenceTag":"GEN","oneLine":"New survey or soil work aimed at the specific gaps.","measures":"Plans new data where uncertainty matters.","whatWeSee":"Extra lines, boreholes or CPTs in chosen spots.","mightMean":"Reduced uncertainty where it affects decisions.","limits":["Cost and time."],"whyCare":"Puts effort where it changes the answer.","misconception":"\"More data is always better.\" Targeted data is better.","specialist":"Scoped against the ground model, structure type and remaining risks."},{"id":"soil_layers","type":"parameter","discipline":"GTI","label":"Soil layers (stratigraphy)","keyNode":false,"aliases":["stratigraphy","layering"],"chapterIds":[8,10,11],"evidenceTag":"GEN","oneLine":"Which soils lie at which depths.","measures":"From boreholes, CPT and seismic ties.","whatWeSee":"A sequence of layers with thicknesses.","mightMean":"How load is carried and how piles and spudcans behave.","limits":["Layer boundaries between points are interpreted."],"whyCare":"Layer order controls foundation behaviour.","misconception":"\"Deeper is always stronger.\" Weak layers can lie below strong ones.","specialist":"Unit boundaries defined from integrated geophysical and geotechnical data."},{"id":"soil_params","type":"parameter","discipline":"GTI","label":"Soil design parameters","keyNode":false,"aliases":["design parameters","characteristic values","undrained shear strength"],"chapterIds":[8,10],"evidenceTag":"GEN","oneLine":"Strength and other properties chosen for design, layer by layer.","measures":"Derived from lab and CPT.","whatWeSee":"Profiles of strength, weight and friction with depth.","mightMean":"The numbers engineers use in foundation checks.","limits":["Chosen with judgement and scatter in mind."],"whyCare":"Direct input to capacity checks.","misconception":"\"Parameters are measured.\" They are selected from measurements.","specialist":"Characteristic values selected per unit with stated basis."},{"id":"soft_clay","type":"parameter","discipline":"GTI","label":"Soft surface clay thickness","keyNode":false,"aliases":["very soft clay","surface clay"],"chapterIds":[9],"evidenceTag":"GEN","oneLine":"How thick the weak clay at the very top of the seabed is.","measures":"From CPT and shallow samples.","whatWeSee":"A low-resistance zone near the seabed.","mightMean":"How far a mudmat may sink and how much it can carry.","limits":["Varies across a site."],"whyCare":"Key input for mudmat design.","misconception":"\"The top layer is too thin to matter.\" For mudmats it matters most.","specialist":"Used with near-surface strength for bearing and settlement checks."},{"id":"near_strength","type":"parameter","discipline":"GTI","label":"Near-surface strength","keyNode":false,"aliases":["shallow strength","surface strength"],"chapterIds":[9],"evidenceTag":"GEN","oneLine":"How strong the soil is in the first part below the seabed.","measures":"From CPT and lab tests on shallow samples.","whatWeSee":"Strength increasing with depth from a low value.","mightMean":"How much load a mudmat can carry.","limits":["Sensitive to sample disturbance."],"whyCare":"Controls mudmat size.","misconception":"\"Strength at depth tells us about the surface.\" It does not.","specialist":"Profile near the mudmat base governs bearing capacity."},{"id":"rig_data","type":"parameter","discipline":"Integrated","label":"Rig-specific data","keyNode":false,"aliases":["leg load","spudcan geometry","rig data"],"chapterIds":[11],"evidenceTag":"GEN","oneLine":"Weight on each leg and the size and shape of the rig's spudcans.","measures":"From the rig owner's information.","whatWeSee":"Loads and footing geometry for this rig.","mightMean":"How this rig will interact with this soil.","limits":["Different rig, different data."],"whyCare":"Leg penetration cannot be checked without it.","misconception":"\"Soil data alone is enough.\" The rig matters too.","specialist":"Preload, spudcan geometry and leg capacity are inputs to leg penetration analysis."},{"id":"hammer","type":"parameter","discipline":"GTI","label":"Hammer and installation method","keyNode":false,"aliases":["pile hammer","installation spread"],"chapterIds":[10],"evidenceTag":"GEN","oneLine":"The equipment and method used to drive the pile.","measures":"Chosen by the installer.","whatWeSee":"Hammer type and energy, pile make-up.","mightMean":"Whether the pile can be driven to the required depth.","limits":["Different hammer, different result."],"whyCare":"Key input to drivability.","misconception":"\"Any hammer will do.\" Drivability depends on it.","specialist":"Hammer selection is an installation responsibility informed by soil data.","external":true,"short":"Hammer and method"},{"id":"mudmat_bearing","type":"analysis","discipline":"GTI","label":"Mudmat bearing check","keyNode":false,"aliases":["bearing capacity"],"chapterIds":[9],"evidenceTag":"GEN","oneLine":"Can the soil carry the jacket on its mudmats before piling?","measures":"Compares load with soil resistance.","whatWeSee":"Result per mudmat and load case.","mightMean":"Whether mudmat size is enough.","limits":["Valid only for the load cases assumed."],"whyCare":"Prevents tilting or sinking during installation.","misconception":"\"If piles are strong, mudmats do not matter.\" Mudmats carry the jacket first.","specialist":"Bearing checks consider soft surface layers and load inclination where relevant."},{"id":"mudmat_
